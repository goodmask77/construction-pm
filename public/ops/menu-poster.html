<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080" />
<title>GROUN:D 菜單海報</title>
<!--
  菜單海報 HTML 模板（張良 2026-10-10 v1.1：加 ✨AI 插圖／Logo 變化／標語貼紙層，可拖曳縮放、設定存雲端）
  取代舊 canvas 手刻：用 CSS 排版 → puppeteer 截圖成 PNG。框線/對齊/換行全自動，不再切字。
  資料來源：window.MENU_DATA（截圖腳本/App 注入）；無則用內建 sample（當前菜單含沙拉）。
  直式畫布 1080×1920。字體：Alfa Slab One（英文大標）/ Noto Sans TC（中文）/ Poppins（英文副標）。
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Alfa+Slab+One&family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script src="js/menu-ai.js?v=1"></script>
<style>
  /* 官方 CIS 中文字型「寒蟬德黑體 ChillDINGothic」（SIL OFL 可商用，源於 DIN 工業字體，數字特別俐落）；單一字重 Regular */
  @font-face{ font-family:'ChillDINGothic'; src:url('fonts/ChillDINGothic_Std.woff2') format('woff2'); font-weight:normal; font-display:swap }
  *{margin:0;padding:0;box-sizing:border-box}
  :root{ --cream:#F5EADA; --red:#CE1611; --eng:#C56B54; --dot:#D98A7A; }
  html,body{background:#555}
  #dlbtn{ position:fixed; top:14px; right:14px; z-index:99; padding:12px 22px; background:#CE1611; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35); font-family:system-ui,sans-serif }
  #dlbtn:disabled{ opacity:.6 }
  #artbtn,#editbtn{ position:fixed; top:14px; z-index:99; padding:12px 18px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35); font-family:system-ui,sans-serif; color:#fff }
  #artbtn{ right:166px; background:#6d3df0 } #editbtn{ right:286px; background:#333 } #editbtn.on{ background:#1a7f37 }
  /* 貼紙層（插圖／Logo 變化／標語）：在品項之上、底條之下；只有編輯模式可點可拖 */
  #stk{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden }
  .stk{ position:absolute; pointer-events:none; transform:translate(-50%,-50%) rotate(var(--r,0deg)); user-select:none; -webkit-user-drag:none; touch-action:none }
  body.edit .stk{ pointer-events:auto; cursor:grab; outline:2px dashed rgba(26,127,55,.0) }
  body.edit .stk:hover{ outline-color:#1a7f37 } body.edit .stk.sel{ outline:3px solid #1a7f37 }
  body.edit #poster::after{ content:'編輯中：拖曳插圖移動；點一下調大小／旋轉／移除'; position:absolute; left:0; right:0; top:0; z-index:7; background:#1a7f37; color:#fff; font:700 20px/1.6 system-ui; text-align:center; padding:4px }
  #mini{ position:fixed; z-index:120; background:rgba(20,20,20,.96); color:#eee; padding:12px 14px; border-radius:12px; width:300px; font:14px/1.5 system-ui,sans-serif; display:none; box-shadow:0 8px 24px rgba(0,0,0,.45) }
  #mini.on{ display:block } #mini h4{ margin:0 0 6px; font-size:14px; color:#F5EADA; display:flex; justify-content:space-between; align-items:center } #mini h4 .x{ cursor:pointer; color:#aaa; font-size:18px; padding:0 4px }
  #mini label{ display:flex; align-items:center; gap:8px; margin:4px 0 } #mini label span{ width:60px; font-size:12px; color:#bbb } #mini input[type=range]{ flex:1 } #mini .v{ width:44px; text-align:right; font-variant-numeric:tabular-nums; font-size:12px }
  #mini .foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px; color:#999; gap:6px } #mini .foot a{ color:#9cf; cursor:pointer } #mini .foot button{ padding:5px 10px; border:none; border-radius:8px; background:#555; color:#fff; cursor:pointer; font-weight:700; font-size:12px }
  /* 直式畫布 */
  #poster{
    width:1080px; height:1920px; background:var(--cream); position:relative;
    font-family:"Noto Sans TC","ChillDINGothic",system-ui,sans-serif; color:var(--red); letter-spacing:.04em;
    padding:28px 38px 0; display:flex; flex-direction:column;
  }
  /* 品牌頭：用官方 logo 圖（brand_v13.png 無襯線粗黑體，照 CIS），不用字型拼 */
  .brand{ margin:0 -38px 6px; }
  .brand img{ width:1080px; display:block; }
  /* 欄頭 */
  .colhead{ display:flex; justify-content:space-between; align-items:baseline; font-size:19px; font-weight:700; padding:0 12px; margin-bottom:6px; }
  /* 分類：左右兩欄各自獨立堆疊（非行對齊，官方版式）；#cats 內容整體可被 JS 等比縮放塞進畫布 */
  .cats{ flex:1; display:flex; gap:37px; align-items:flex-start; transform-origin:top center; }
  .col{ flex:1; min-width:0; display:flex; flex-direction:column; gap:13px; }
  .cat{ }
  .cat h2{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; padding-left:2px; }
  .cat h2 .en{ font-family:"Alfa Slab One",serif; font-size:30px; line-height:1; }
  .cat h2 .zh{ font-size:25px; font-weight:900; letter-spacing:.14em; }
  .cat h2 .pz{ font-size:14px; font-weight:700; line-height:1.1; }
  /* 品項框 */
  .box{ border:2px solid var(--red); border-radius:16px; padding:12px 16px 14px; }
  .item{ margin:0; }
  .item + .item{ margin-top:10px; }
  .item .row1{ display:flex; align-items:baseline; gap:8px; font-weight:700; }
  .item .nm{ font-size:30px; font-weight:700; white-space:nowrap; line-height:1.15; letter-spacing:.05em; }
  .item .ih{ font-size:20px; font-weight:700; flex:0 0 auto; }
  .item .lead{ flex:1; border-bottom:4px dotted var(--dot); transform:translateY(-6px); min-width:14px; }
  .item .pr{ font-size:30px; font-weight:800; flex:0 0 auto; font-variant-numeric:tabular-nums; letter-spacing:0; }
  .item .tag{ flex:0 0 auto; font-size:22px; font-weight:800; }
  .item .tag.inc{ background:var(--red); color:var(--cream); border-radius:7px; padding:2px 10px; font-size:19px; }
  .item .en{ font-family:"Lora",Georgia,serif; color:var(--eng); font-size:18px; font-weight:500; margin-top:2px; letter-spacing:.01em; }
  .item .en .decaf{ color:var(--red); font-weight:700; margin-left:8px; }
  /* 自動縮字：品名過長時整列縮放，不切字（JS 控制 nm font-size） */
  /* 底部紅條 */
  .footer{ position:absolute; left:0; right:0; bottom:0; z-index:6; height:70px; background:var(--red); color:var(--cream);
    display:flex; align-items:center; justify-content:center; font-size:23px; font-weight:700; letter-spacing:.01em; }
  .footer b{ font-weight:800; }
</style>
</head>
<body>
<button id="editbtn" onclick="toggleEdit()">✎ 編輯</button>
<button id="artbtn" onclick="openArt()">✨ 插圖</button>
<button id="dlbtn" onclick="downloadPoster()">⬇ 下載圖片</button>
<div id="mini"></div>
<div id="poster">
  <div class="brand"><img src="menu/brand.png" alt="HAPPINESS GROUN:D"></div>
  <div class="colhead"><span>MENU 菜單</span><span>單點價／套餐</span></div>
  <div class="cats" id="cats"></div>
  <div id="stk"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
// ── 內建 sample（當前菜單含沙拉），無注入資料時用 ──
const SAMPLE = {
  setN:'89', origins:'牛肉 美國／豬肉 台灣／雞肉 美國、台灣',
  sections:[
    {name:'PIZZA 披薩', pz:'400°C 12吋', items:[
      {name:'經典瑪格麗特',en:'Classic Margherita',price:330},
      {name:'煙燻BBQ雞肉',en:'Smoked BBQ Chicken',price:360},
      {name:'松露綜合野菇',en:'Black Truffle Mushroom',price:380},
      {name:'辣楓糖臘腸培根',en:'Spicy Maple Pepperoni & Bacon',price:390}]},
    {name:'BOWLS 療癒碗', items:[
      {name:'紐約街頭雞上飯 / 沙拉',en:'NYC Chicken Over Rice / Salad',price:250},
      {name:'泰式椒麻炸雞飯 / 沙拉',en:'Thai Spicy Fried Chicken Rice / Salad',price:280},
      {name:'夏威夷BBQ烤豬飯 / 沙拉',en:'Hawaiian BBQ Pork Rice / Salad',price:280},
      {name:'24H爐烤牛肉飯 / 沙拉',en:'24H Slow-Roasted Beef Rice / Salad',price:320}]},
    {name:'BURGERS 漢堡', items:[
      {name:'香煎去骨雞腿堡',en:'Pan-Seared Boneless Chicken Burger',price:180},
      {name:'美式牧場炸雞腿堡',en:'Ranch Fried Chicken Burger',price:180},
      {name:'4oz 100%純牛肉起司堡',en:'4oz 100% Beef Cheeseburger',price:200},
      {name:'8oz 雙層純牛肉起司堡',en:'8oz Double Beef Cheeseburger',price:260}]},
    {name:'ROLLS 越法三明治', items:[
      {name:'生菜煎蛋越南三明治',en:'Lettuce and Fried Egg Bánh Mì',price:130},
      {name:'香料烤雞胸越南三明治',en:'Spiced Roast Chicken Bánh Mì',price:160},
      {name:'BBQ烤豬肉越南三明治',en:'BBQ Roast Pork Bánh Mì',price:180},
      {name:'爐烤牛排越南三明治',en:'Roast Steak Bánh Mì',price:250}]},
    {name:'PASTA 義大利麵', items:[
      {name:'經典番茄肉醬義大利麵',en:'Classic Tomato Meat Sauce Pasta',price:160},
      {name:'松露綜合野菇義大利麵',en:'Truffle Mushroom Pasta',price:180},
      {name:'明太子溫泉蛋義大利麵',en:'Mentaiko Pasta with Onsen Egg',price:210}]},
    {name:'BRUNCH 早午餐', items:[
      {name:'GROUN:D大早餐盤',en:'GD Ultimate Breakfast Plate',price:320},
      {name:'法式吐司早餐盤',en:'French Toast Breakfast Plate',price:280},
      {name:'美式鬆餅早餐盤',en:'Classic American Pancake Breakfast',price:280}]},
    {name:'SNACKS 炸物與小點', combo:60, items:[
      {name:'薯條',en:'Fries',price:60},
      {name:'可愛沙拉杯',en:'Happy Little Salad',price:60},
      {name:'酸奶油香煎小洋芋',en:'Crispy Smashed Baby Potatoes',price:80},
      {name:'GD招牌脆雞 原味/川味麻辣',en:'GD Crispy Chicken – Original / Sichuan Mala',price:80}]},
    {name:'DRINKS 飲品', combo:50, items:[
      {name:'可口可樂 原味 / ZERO',en:'Coca-Cola Original / Zero',price:50},
      {name:'四季桂花春烏龍',en:'Seasonal Osmanthus Spring Oolong',price:50},
      {name:'台灣高山青茶',en:'Taiwan Highland Green Tea',price:50},
      {name:'南非國寶茶',en:'Rooibos Tea',price:50,note:'無咖啡因'},
      {name:'國寶鮮奶茶 I/H',en:'Rooibos Milk Tea',price:65,note:'無咖啡因'},
      {name:'美式咖啡 I/H',en:'Americano',price:75},
      {name:'經典拿鐵 I/H',en:'Caffè Latte',price:90},
      {name:'抹茶 / 可可拿鐵 I/H',en:'Matcha / Cocoa Latte',price:90},
      {name:'番茄蔬菜湯',en:'Tomato & Vegetable Soup',price:60}]},
  ]
};

// 把 App 的 d.draft.sections 轉成模板資料（App 注入 window.MENU_DATA 時用）
function normalize(data){
  if (!data) return SAMPLE;
  const setN = (String(data.note||'').match(/(\d+)\s*元/)||[])[1] || '89';
  const sections = (data.sections||[]).map(s=>({
    name:s.name, combo:Number(s.combo)||0,
    items:(s.items||[]).filter(it=>Number(it.price)>0).map(it=>({name:it.name,en:it.en,price:it.price,note:it.note}))
  })).filter(s=>s.items.length);
  return { setN, origins:data.origins||SAMPLE.origins, sections };
}

const ORDER=['PIZZA','BOWL','BURGER','ROLL','PASTA','BRUNCH','SNACK','DRINK'];
function comboTag(combo, price){
  if (!combo) return null;
  const d = price - combo;
  if (d===0) return {t:'內含', inc:true};
  return {t:(d>0?'+':'')+d, inc:false};
}
function splitIH(name){
  let ih=false, nm=String(name||'');
  if (/\s+I\s*\/\s*H\s*$/i.test(nm)){ ih=true; nm=nm.replace(/\s+I\s*\/\s*H\s*$/i,'').trim(); }
  return {nm, ih};
}
function splitName(nm){
  nm=String(nm||'').trim();
  const m=nm.match(/^([A-Za-z0-9&'.\- ]+?)\s*([一-鿿].*)?$/);
  const en=m&&m[1]?m[1].trim():''; const zh=m&&m[2]?m[2].trim():(en?'':nm);
  return {en:en.toUpperCase(), zh};
}

function render(){
  const D = normalize(window.MENU_DATA);
  // 固定配對順序
  const rank=s=>{ const u=String(s.name||'').toUpperCase(); const i=ORDER.findIndex(k=>u.includes(k)); return i<0?99:i; };
  const secs = D.sections.slice().map((s,i)=>({s,i})).sort((a,b)=>rank(a.s)-rank(b.s)||a.i-b.i).map(o=>o.s);

  const cats=document.getElementById('cats'); cats.innerHTML='';
  const colL=document.createElement('div'); colL.className='col';
  const colR=document.createElement('div'); colR.className='col';
  cats.appendChild(colL); cats.appendChild(colR);
  secs.forEach((sec,ci)=>{
    const {en,zh}=splitName(sec.name);
    const cat=document.createElement('div'); cat.className='cat';
    let h=`<h2><span class="en">${en}</span>${zh?`<span class="zh">${zh}</span>`:''}${sec.pz?`<span class="pz">${sec.pz.replace(' ','<br>')}</span>`:''}</h2><div class="box">`;
    sec.items.forEach(it=>{
      const {nm,ih}=splitIH(it.name);
      const tag=comboTag(Number(sec.combo)||0, Number(it.price)||0);
      let note='', nmHtml=nm;
      // 無咖啡因 → 英文行末紅字
      const decaf = /無咖啡因/.test(it.note||'') ? '無咖啡因' : '';
      h+=`<div class="item"><div class="row1">`
        +`<span class="nm">${nmHtml}</span>`
        +(ih?`<span class="ih">冰 / 熱</span>`:``)
        +`<span class="lead"></span>`
        +`<span class="pr">${it.price}</span>`
        +(tag?`<span class="tag ${tag.inc?'inc':''}">${tag.t}</span>`:``)
        +`</div>`
        +(it.en?`<div class="en">${it.en}${decaf?`<span class="decaf">${decaf}</span>`:''}</div>`:``)
        +`</div>`;
    });
    h+=`</div>`;
    cat.innerHTML=h; (ci%2===0?colL:colR).appendChild(cat);
  });

  document.getElementById('footer').innerHTML =
    `<b>主餐 +${D.setN} 升級套餐</b>　｜　副餐選 1＋飲品選 1　｜　肉品產地：${D.origins}`;
  fit();
}

// 縮字＋縮高（可重複呼叫；每次先重置再算）——字體載入完成後要再跑一次，否則用替補字體量到的高度偏矮會撐破
function fit(){
  document.querySelectorAll('.item .row1').forEach(row=>{
    const nm=row.querySelector('.nm'); if(!nm) return;
    nm.style.fontSize=''; let size=30;
    const avail = row.clientWidth - 10; let guard=0;
    while((sumFixed(row) > avail) && size>20 && guard<20){ size--; nm.style.fontSize=size+'px'; guard++; }
  });
  const cats=document.getElementById('cats');
  const footerTop = 1920 - 70 - 18, availH = footerTop - cats.offsetTop;
  cats.style.transform='scale(1)';
  const real = cats.scrollHeight;
  cats.style.transform = real>availH ? 'scale('+(availH/real)+')' : 'scale(1)';
  window.__rendered = true;
}
function sumFixed(row){
  let w=0; row.childNodes.forEach(c=>{ if(c.classList && !c.classList.contains('lead')) w+=c.offsetWidth+8; });
  return w;
}
// 開機：先抓 App 的真實菜單（看板唯讀金鑰），抓不到(本機/離線)才用內建 sample
async function boot(){
  await MAI.load(); loadPoster();
  if (!window.MENU_DATA){
    try{
      const K=new URLSearchParams(location.search).get('k') || '7ea362bae1f0274372d4ec7b27c78852';
      const r=await fetch('/api/mail-sync?menu='+K);
      const d=await r.json();
      if (d && d.ok && d.draft) window.MENU_DATA=d.draft;
    }catch(e){}
  }
  render(); renderStk();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit);
}
boot();

// ── ✨ 貼紙層（v1.1）：AI 插圖／Logo 變化／標語，可拖曳、縮放、旋轉、分層；位置存雲端（哪台開都一樣）＋本機備份 ──
let POSTER={stickers:[]}, EDIT=false, SELS=null, pT=null;
function loadPoster(){ const c=MAI.assets.poster; if(c&&Array.isArray(c.stickers)) POSTER=c; else { try{ const o=JSON.parse(localStorage.getItem('gd_poster')||'null'); if(o&&o.stickers) POSTER=o; }catch(e){} } }
function savePoster(){ try{ localStorage.setItem('gd_poster',JSON.stringify(POSTER)); }catch(e){} clearTimeout(pT); pT=setTimeout(()=>{ if(MAI.TK()) MAI.api('menuassetset',{poster:POSTER}).catch(()=>{}); },900); }
function renderStk(){ const L=document.getElementById('stk'); L.innerHTML=POSTER.stickers.map((s,i)=>`<img class="stk ${SELS===i?'sel':''}" data-i="${i}" src="${s.url}" style="left:${s.x}px;top:${s.y}px;width:${s.w}px;--r:${s.r||0}deg;z-index:${i+1}" draggable="false" crossorigin="anonymous">`).join(''); }
function toggleEdit(){ EDIT=!EDIT; document.body.classList.toggle('edit',EDIT); const b=document.getElementById('editbtn'); b.classList.toggle('on',EDIT); b.textContent=EDIT?'✓ 完成編輯':'✎ 編輯'; if(!EDIT) closeStk(); }
function closeStk(){ SELS=null; document.getElementById('mini').classList.remove('on'); renderStk(); }
function stkSet(i,k,v){ const s=POSTER.stickers[i]; s[k]=Number(v); const el=document.querySelector(`.stk[data-i="${i}"]`); if(el){ if(k==='w') el.style.width=s.w+'px'; if(k==='r') el.style.setProperty('--r',s.r+'deg'); } const e=document.getElementById('sv_'+k); if(e) e.textContent=v+(k==='r'?'°':''); savePoster(); }
function stkLayer(i,d){ const j=i+d; if(j<0||j>=POSTER.stickers.length) return; const a=POSTER.stickers; [a[i],a[j]]=[a[j],a[i]]; savePoster(); openStk(j); }
function stkDel(i){ POSTER.stickers.splice(i,1); savePoster(); closeStk(); }
function openStk(i){
  SELS=i; renderStk(); const s=POSTER.stickers[i]; if(!s) return; const m=document.getElementById('mini');
  m.innerHTML=`<h4><b>插圖</b><span class="x" onclick="closeStk()">×</span></h4>`
    +`<label><span>大小</span><input type="range" min="60" max="900" value="${s.w}" oninput="stkSet(${i},'w',this.value)"><b class="v" id="sv_w">${s.w}</b></label>`
    +`<label><span>旋轉</span><input type="range" min="-60" max="60" value="${s.r||0}" oninput="stkSet(${i},'r',this.value)"><b class="v" id="sv_r">${s.r||0}°</b></label>`
    +`<div class="foot"><span><a onclick="stkLayer(${i},1)">上一層</a>　<a onclick="stkLayer(${i},-1)">下一層</a>　<a onclick="stkDel(${i})" style="color:#f88">從海報移除</a></span><button onclick="closeStk()">完成</button></div>`;
  m.classList.add('on');
  const el=document.querySelector(`.stk[data-i="${i}"]`); const r=el?el.getBoundingClientRect():{right:200,left:0,top:100}; const W=300,H=m.offsetHeight||150; let x=r.right+14,y=r.top;
  if(x+W>innerWidth-10) x=r.left-W-14; if(x<10) x=10; if(y+H>innerHeight-10) y=Math.max(10,innerHeight-H-10); m.style.left=x+'px'; m.style.top=y+'px';
}
(()=>{ const L=document.getElementById('stk'); let drag=null;
  L.addEventListener('pointerdown',ev=>{ if(!EDIT) return; const el=ev.target.closest('.stk'); if(!el) return; ev.preventDefault(); const i=+el.dataset.i, s=POSTER.stickers[i]; const sc=1080/document.getElementById('poster').getBoundingClientRect().width; drag={i,sx:ev.clientX,sy:ev.clientY,ox:s.x,oy:s.y,sc,moved:false}; try{ el.setPointerCapture(ev.pointerId); }catch(e){} });
  L.addEventListener('pointermove',ev=>{ if(!drag) return; const dx=(ev.clientX-drag.sx)*drag.sc, dy=(ev.clientY-drag.sy)*drag.sc; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; const s=POSTER.stickers[drag.i]; s.x=Math.round(drag.ox+dx); s.y=Math.round(drag.oy+dy); const el=L.querySelector(`.stk[data-i="${drag.i}"]`); if(el){ el.style.left=s.x+'px'; el.style.top=s.y+'px'; } });
  const up=ev=>{ if(!drag) return; const d=drag; drag=null; if(d.moved) savePoster(); openStk(d.i); };
  L.addEventListener('pointerup',up); L.addEventListener('pointercancel',up);
})();
function addStk(a){ POSTER.stickers.push({id:a.id,url:a.url,x:540,y:960,w:a.sub==='slogan'?560:260,r:0}); savePoster(); if(!EDIT) toggleEdit(); renderStk(); openStk(POSTER.stickers.length-1); }
// ✨ 插圖面板：貼上喜歡的風格截圖＋講概念 → 文字模型寫指令 → Gemini 畫 4 張 → 挑一張 → 去背成貼紙 → 入圖庫＋放到海報
function openArt(){
  MAI.open({ kind:'art', title:'✨ AI 插圖／Logo 變化／標語', n:4,
    onPick: async (url,meta)=>{ const cut=await MAI.cutout(url); const pub=await MAI.upload(cut,'art'); const r=await MAI.api('menuaisave',{kind:'art',url:pub,sub:meta.sub,brief_zh:meta.brief_zh}); if(!r.ok) throw new Error(r.error||'登記失敗'); await MAI.load(); addStk(r.art[0]); },
    onLib: async (a)=>addStk(a),
    onLibDel: (id)=>{ POSTER.stickers=POSTER.stickers.filter(s=>s.id!==id); savePoster(); renderStk(); } });
}

// ⬇ 下載 PNG（前端出圖，html-to-image）：等字體載入→暫時放大到 1:1 截 1080×1920
async function downloadPoster(){
  const btn=document.getElementById('dlbtn'); if(btn){ btn.textContent='產生中…'; btn.disabled=true; }
  try{
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    fit();
    const wasEdit=document.body.classList.contains('edit'); if(wasEdit){ document.body.classList.remove('edit'); SELS=null; renderStk(); document.getElementById('mini').classList.remove('on'); } // 出圖不帶編輯提示條/選取框
    const node=document.getElementById('poster');
    const url=await htmlToImage.toPng(node,{ width:1080, height:1920, pixelRatio:2, backgroundColor:'#F5EADA', cacheBust:true });
    if(wasEdit) document.body.classList.add('edit');
    const a=document.createElement('a'); a.href=url; a.download='GROUND菜單_直式_'+(new Date().toISOString().slice(0,10))+'.png'; a.click();
  }catch(e){ alert('出圖失敗，再試一次：'+e); }
  finally{ if(btn){ btn.textContent='⬇ 下載圖片'; btn.disabled=false; } }
}
