<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GD</title>
<meta name="robots" content="noindex" />
<!-- PWA（張良 2026-09-21 幹成App）：手機瀏覽器「加入主畫面」→ 全螢幕獨立視窗＋icon；icon=:D 紅標、名稱=GD -->
<link rel="manifest" href="/ops/manifest.json" />
<link rel="icon" type="image/png" href="/ops/icon-192.png?v=2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GD" />
<meta name="theme-color" content="#0E1217" />
<link rel="apple-touch-icon" href="/ops/icon-180.png?v=2" />
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Beach Ops 同款視覺（張良 2026-09-24：顏色/字型/間距/排版對齊 beachops）——類名不動只換皮 */
  :root{ /* v4.8.0 黑灰質感主題（張良 2026-10-02「整個app改黑灰底 有質感帥的」） */
    --bg:#0E1217; --card:#161B22; --soft:#1C222B; --ink:#F2F5F9; --text:#C7D0DB; --muted:#8C98A8;
    --primary:#4DA3FF; --pdark:#9CC7F5; --psoft:#1A2940; --line:#2A3240; --green:#3DBE6C; --red:#F07373;
    --grad:linear-gradient(135deg,#2493EF,#1266C8);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); }
  *{box-sizing:border-box;margin:0;padding:0}
  :root{color-scheme:dark}
  input,select,textarea{background:var(--soft);color:var(--ink)}
  html,body{overscroll-behavior-x:none} /* 擋瀏覽器橫滑返回上一頁（張良 2026-10-02） */
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
  .brand{font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--primary)}
  .bseg{cursor:pointer;opacity:.35;padding-bottom:2px}
  .bseg.on{opacity:1;border-bottom:2.5px solid var(--primary)}
  h1{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:6px}
  .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:15px;font-weight:700;color:#C3CEDC;cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:background .15s;display:inline-flex;gap:7px;align-items:center}
  .tabs button:hover{background:#232B36}
  .tabs button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(18,102,200,.30)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
  .kpi .l{font-size:14px;font-weight:600;color:var(--text)}
  .kpi .v{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;margin-top:16px;overflow:hidden}
  .mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#A9C3E2;cursor:pointer;margin-left:4px;transition:background .15s}
  .mini:hover{background:#232B36}
  .mini{white-space:nowrap}
  .wopt{display:inline} @media(max-width:760px){.wopt{display:none}}
  .mini.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 9px rgba(18,102,200,.28)}
  h2{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
  .hint{font-size:13px;color:var(--muted);font-weight:500}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  th{background:var(--soft);color:var(--muted);font-size:12.5px;font-weight:700;text-align:right;padding:9px 8px;white-space:nowrap;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 8px;border-top:1px solid #222A35;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even) td{background:#191F28}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  #lbTbl,#lbTbl th,#lbTbl td,#lbTbl div,#lbMn,#lbMn *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} /* v4.29.6 手機點格不再跳iOS選字浮條 */
  table.tight th{padding:5px 6px}
  table.tight td{padding:3px 6px;font-size:13px} /* v4.28.2 張良「縮小版面」：備料表緊湊版 */
  .catband td{background:var(--psoft)!important;color:var(--pdark);font-weight:800;font-size:14px}
  .subrow td{background:#2A2415!important}
  .todaycol{background:var(--psoft)!important;color:var(--pdark)!important;animation:glowp 2s ease-in-out infinite;position:relative}
  @keyframes glowp{0%,100%{box-shadow:inset 0 0 0 1.5px #2493EF,0 0 5px rgba(36,147,239,.3)}50%{box-shadow:inset 0 0 0 1.5px #2493EF,0 0 13px rgba(36,147,239,.7)}}
  @media (prefers-reduced-motion:reduce){.todaycol{animation:none;box-shadow:inset 0 0 0 1.5px #2493EF}}
  .iname{max-width:40vw;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--ink)}
  .avg{font-weight:800;color:var(--pdark);font-size:15px}
  .up{color:var(--green);font-weight:800} .dn{color:var(--red);font-weight:800} .mut{color:var(--muted)}
  .bar{display:inline-block;background:var(--primary);border-radius:2px 2px 0 0;width:14px;vertical-align:bottom}
  .slotrow{display:flex;align-items:flex-end;gap:6px;padding:6px 2px 0}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
  .foot{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}
  .err{background:#3A2023;color:#F07373;border-radius:12px;padding:14px;font-weight:700;margin-top:20px}
  @media(max-width:480px){ .kpi .v{font-size:19px} h1{font-size:22px} .tabs button{padding:7px 13px;font-size:14px} }
  /* 桌機＝Beach Ops 左側欄版型（≥920px；分頁選單變側欄、內容右移） */
  @media(min-width:920px){
    body{padding-left:216px}
    .wrap{max-width:1200px}
    .tabs{position:fixed;left:0;top:0;bottom:0;width:248px;margin:0;padding:20px 14px 14px;background:#11151B;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:6px;overflow-y:auto;z-index:20;flex-wrap:nowrap} /* 2026-10-02 張良：比例跟 Beach Ops 一樣大 */
    .tabs::before{content:"≋ GD 營運看板";display:block;font-weight:900;font-size:24px;background:linear-gradient(120deg,#5EB2FF 10%,#9BE1FF 55%,#5EB2FF 95%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px 10px 22px;letter-spacing:.04em;text-shadow:0 0 22px rgba(77,163,255,.25)}
    .tabs button{text-align:left;border:none;background:transparent;border-radius:12px;padding:13px 14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
    .tabs button:hover{background:#232B36}
    .tabs button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(18,102,200,.32)}
  }
@keyframes trGlow{0%,100%{box-shadow:0 0 2px 0 var(--gc)}50%{box-shadow:0 0 10px 2.5px var(--gc)}} /* 🎓帶訓卡發光（張良 2026-10-02） */
@keyframes goldGlow{0%,100%{box-shadow:0 0 0 2px #D4A72C,0 0 6px 2px rgba(212,167,44,.35)}50%{box-shadow:0 0 0 3px #F2CE60,0 0 22px 7px rgba(242,206,96,.75)}} /* 🔗deep link 跳轉定位閃光（v4.16.0） */
@keyframes shSlideL{from{transform:translateX(44px);opacity:.35}to{transform:none;opacity:1}} /* 週表左右滑動（張良 2026-10-02） */
@keyframes shSlideR{from{transform:translateX(-44px);opacity:.35}to{transform:none;opacity:1}}
.glowgold{animation:goldGlow 1s ease-in-out 4;border-radius:8px}
.lnkbtn{opacity:.35;cursor:pointer;font-size:12px} .lnkbtn:hover{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <!-- 品牌字標＝切店（張良 2026-09-21）；右上=⏰打卡＋🔄更新App（張良 2026-09-22：🔄不是只抓數據，是整個App重開、連新功能一起拿最新版） -->
  <div class="brand" style="display:flex;align-items:center;justify-content:space-between">
    <span><span id="bs-ground" class="bseg on" onclick="load('ground')">GROUN:D</span> × <span id="bs-abeach" class="bseg" onclick="load('abeach')">A BEACH</span></span>
    <span style="display:flex;gap:6px"><button id="bindBtn" class="mini" style="display:none;font-size:14px;padding:5px 12px;font-weight:700" onclick="bindPrompt()" title="私訊 DD「登入碼」拿 4 位數填入">登入</button><button class="mini" style="font-size:14px;padding:5px 12px;font-weight:700;display:inline-flex;gap:5px;align-items:center" onclick="punchNow()" title="上下班打卡"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>打卡</button><button class="mini" style="padding:5px 10px;display:inline-flex;align-items:center" onclick="mobilePreview()" title="手機版畫面預覽">📱</button><button class="mini" style="padding:5px 10px;display:inline-flex;align-items:center" onclick="hardRefresh()" title="更新App到最新版"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4h-4"/></svg></button></span>
  </div>
  <h1>營運看板</h1>
  <div class="sub" id="upd">載入中…</div>
  <div class="tabs">
    <button id="tab-home" onclick="load(lastStore)" title="回營運看板" style="padding:7px 13px;font-size:16px">🏠</button>
    <button id="tab-sop" onclick="sopPage()">✅ SOP</button>
    <button id="tab-task" onclick="taskEmbed()">🛠 任務</button> <!-- 2026-10-02 整併：改掛主App任務中心（同團隊空間雙向同步） -->
    <button id="tab-lb" onclick="loadLB()">🏆 排行榜</button>
    <button id="tab-food" onclick="invLoad('food')">🥩 盤點</button>
    <button id="tab-pack" onclick="invLoad('pack')">📦 包材</button>
    <button id="tab-buy" onclick="buyLoad()">🛒 採購</button>
    <button id="tab-meet" onclick="meetLoad()">📋 會議</button>
    <button id="tab-shift" onclick="window._shScrollTo='today';shiftLoad()">📅 班表</button>
    <button id="tab-inc" onclick="incLoad()" title="AB=阿桑系統自動同步；GD ERP 之後接入">⚠️ 異常通知</button>
    <button id="tab-fb" onclick="fbLoad()">💬 回饋</button>
    <button id="tab-menu" onclick="menuLoad()">🍔 菜單</button>
    <button id="tab-gear" onclick="settingsLoad()" title="設定">⚙️ 設定</button>
    <button id="tab-errs" onclick="errsView()" title="問題回報・功能許願">🐞 問題回報</button>
    <div id="meChip" style="margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 2px;display:flex;gap:10px;align-items:center"></div>
  </div>
  <div id="app"></div>
  <div class="foot">資料每天自動同步（打開即最新）・僅供內部參考與備料使用，請勿外傳連結</div>
</div>
<script>
// v4.33.3 治本（張良點 #meet= 測試連結變訪客+讀不到資料）：舊邏輯「沒 ?k= 就把 # 後面整串當金鑰」會把
// #meet=/#sop= 深層連結吃成假金鑰→全部 API 403。改成只有「長得像金鑰」的 hash（#k=… 或純16進位長串）才算
const K = (() => {
  const q = new URLSearchParams(location.search).get('k'); if (q) return q
  const h = (location.hash || '').replace(/^#/, '')
  const m = h.match(/^k=([A-Za-z0-9]+)$/) || h.match(/^([a-f0-9]{24,})$/i)
  return m ? m[1] : '7ea362bae1f0274372d4ec7b27c78852' // 內建看板唯讀金鑰（短網址 /prep 用；與管理金鑰分開）
})()
const fmt = n => 'NT$' + Math.round(n || 0).toLocaleString()
const app = document.getElementById('app')
let curStore = 'ground'
let lastStore = 'ground'
function setTabs(k){
  ['sop','task','lb','food','pack','buy','meet','shift','inc','fb','menu','errs','gear'].forEach(t => { const b = document.getElementById('tab-' + t); if (b) b.className = (t===k) ? 'on' : '' })
  const hb = document.getElementById('tab-home'); if (hb) hb.className = (k==='ground'||k==='abeach') ? 'on' : '' // 🏠=回店面（張良 2026-09-21：怕有人不知道怎麼回去）
  if (k === 'ground' || k === 'abeach') lastStore = k
  const g = document.getElementById('bs-ground'), a = document.getElementById('bs-abeach')
  if (g) g.className = 'bseg' + (lastStore==='ground' ? ' on' : '')
  if (a) a.className = 'bseg' + (lastStore==='abeach' ? ' on' : '')
  try { sessionStorage.setItem('prepView', curStore) } catch(_) {} // v4.4.0（張良 2026-10-02：重新整理留在原頁面）
}
// 🔄 更新App（張良 2026-09-22：不是只抓數據——整個 App 重開、連新功能一起拿最新版；r=時戳穿透 CDN 快取）
// 📱 手機版預覽（張良 2026-10-02：每頁右上隨時切手機寬度檢查排版）——iframe 實機 390px 寬載同一頁
function mobilePreview(){
  const ov = document.createElement('div'); ov.id='mpOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px'
  ov.innerHTML = `<div style="background:#222B38;border:1px solid #3B4654;border-radius:18px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.55)" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px"><b>📱 手機版預覽（390px）</b><button class="mini" style="padding:5px 12px" onclick="document.getElementById('mpOv').remove()">關閉</button></div>
    <iframe src="${location.pathname}" style="width:390px;height:min(78vh,760px);border:1px solid #3B4654;border-radius:12px;background:var(--bg)"></iframe></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
async function posFresh(){ // 跟主App同款：手動叫喬亞抓一次盤中→重載看板（v4.18.2）
  const b = document.getElementById('pfBtn'); if (b) { b.disabled = true; b.textContent = '抓取中…' }
  try { await fetch('/api/joya-intraday?manual=1&r=' + Date.now()) } catch(e) {}
  await load('ground', true)
}
function hardRefresh(){ location.replace(location.pathname + '?r=' + Date.now()) }
// 依目前分頁重畫（綁定後/操作後用）
function taskEmbed(){ // 任務原地切換（張良 2026-10-02：不要像開新分頁）——iframe 內嵌，側欄照舊
  curStore = 'taskx'; setTabs('task')
  document.getElementById('upd').textContent = '任務中心・與主 App 同步'
  app.innerHTML = `<iframe src="/ops-tasks.html?v=${Date.now()}" style="width:100%;height:calc(100vh - 150px);min-height:560px;border:none;border-radius:14px;background:var(--bg)"></iframe>`
}
function goView(){
  if (curStore === 'task') taskLoad()
  else if (curStore === 'lb') loadLB()
  else if (curStore === 'food' || curStore === 'pack') invLoad(curStore)
  else if (curStore === 'buy') buyLoad()
  else if (curStore === 'meet') meetLoad()
  else if (curStore === 'shift') shiftLoad()
  else if (curStore === 'fb') fbLoad()
  else if (curStore === 'menu') menuLoad()
  else if (curStore === 'errs') errsView()
  else load(curStore, true)
}
// 🔑 輸入綁定碼（iPhone 加入主畫面的 App 跟 Safari 儲存分開→token 帶不過去；貼一次 DD 給的連結/代碼即可）
function bindPrompt(){
  const v = prompt('📱 用 LINE 私訊 DD「登入碼」→ 把 DD 給的 4 個數字填在這裡（10分鐘內有效）\n\n（沒綁定過？先私訊 DD「綁定GD 你的本名」；貼個人連結也可以）')
  if (!v) return
  // 🔢 四位數登入碼（v4.31.3 張良：要更簡單＝打4個數字就好）
  if (/^\d{4}$/.test(v.trim())) {
    fetch('/api/mail-sync?bindcode=' + v.trim()).then(r => r.json()).then(j => {
      if (j.ok && j.me) { localStorage.setItem('prepToken', j.me); try { simWipe() } catch(_){}; alert('登入完成 ✅'); hardRefresh() } // v4.31.4 清訪客快取+整個App重開＝名字/權限/分頁即時變（張良：登入完畫面還是訪客要手動刷）
      else alert(j.error || '登入碼錯誤或過期——私訊 DD「登入碼」再拿一組新的')
    }).catch(() => alert('網路不穩，再試一次'))
    return
  }
  if (/bind=/i.test(v)) { location.href = '/prep?bind=' + v.split(/bind=/i)[1].replace(/[^a-z0-9]/gi,''); return } // DD 新版連結 ?bind=xxx 直接走（2026-10-01 Toby 綁不上＝解析器只認舊格式）
  const m = v.match(/me=([a-z0-9]+)/i) || v.match(/(pv[a-z0-9]{8,})/i)
  if (!m) { alert('看不懂這串——輸入 DD 給的 4 位數登入碼，或完整貼上個人連結'); return }
  localStorage.setItem('prepToken', m[1])
  try { simWipe() } catch(_){} // 清掉訪客身分抓的畫面快取
  alert('綁定完成 ✅')
  hardRefresh() // v4.31.4 整個App重開＝名字/權限/分頁即時變（manifest 個人化 maniSync 重開後自動跑）
}
const BIND_HINT = `私訊 DD「登入碼」拿 4 位數 → 按 <button class="mini" onclick="bindPrompt()">🔑 登入</button> 填入（沒綁定過先跟 DD 說「綁定GD 本名」）`
async function load(store, fresh){
  curStore = store
  setTabs(store)
  if (!K) { app.innerHTML = '<div class="err">網址缺少金鑰，請跟店長要完整連結</div>'; return }
  // ⚡ 快取先上（打開秒出畫面）、背景抓最新無感刷新（張良 2026-09-21：讀取太慢）
  const ck = 'obc_' + store
  let hadCache = false
  try { const c = localStorage.getItem(ck); if (c) { renderBoard(JSON.parse(c), store); hadCache = true; document.getElementById('upd').textContent = '⚡ 快取畫面・背景更新最新資料中…' } } catch(e){}
  if (!hadCache) app.innerHTML = '<section>載入中…</section>'
  let d
  try { const r = await fetch('/api/mail-sync?opsboard=' + encodeURIComponent(K) + '&store=' + store + (fresh ? '&r=' + Date.now() : '')); d = await r.json() } catch(e){}
  if (d && d.prepAct) window._prepAct = d.prepAct
  if (d && d.prepS86) window._prepS86 = d.prepS86
  if (!d || !d.ok) { if (!hadCache) app.innerHTML = '<div class="err">讀不到資料（金鑰錯誤或連線問題），請跟店長要新連結</div>'; return }
  try { localStorage.setItem(ck, JSON.stringify(d)) } catch(e){}
  if (curStore !== store) return // 使用者已切到別店，別把畫面蓋回來
  renderBoard(d, store)
}
function dayPer(k){ window._dayPeriod = k; if (window._bd) renderBoard(window._bd, window._bd.store || lastStore) } // 每日數據期間切換（v4.30.0）
function renderBoard(d, store){
  document.getElementById('upd').textContent = '最新日結：' + (d.anchor || '—') + '・資料自動同步'
  let h = ''
  // 今日事項（張良 2026-09-22：最上面＝今天該做的事——任務/收貨/班表；資料來自各分頁快取，todayRender 畫）
  h += `<div id="todaysec"></div>`

  if (el) el.innerHTML = repFiles.map((f, i) => `📎 ${(f.name || '檔案' + (i + 1)).slice(0, 30)} <a href="#" onclick="repFiles.splice(${i},1);repListRender();return false" style="color:var(--red)">✕移除</a>`).join('<br>')
}
async function repSend(st){
  const txt = (document.getElementById('repTxt') || {}).value || ''
  if (!txt.trim() && !repFiles.length) { alert('至少寫一句話或附一個檔案'); return }
  const btns = document.querySelectorAll('#repOv button'); btns.forEach(b => b.disabled = true)
  const media = []
  for (const f of repFiles) {
    try {
      if (f.size > 80 * 1024 * 1024) { alert(`${f.name} 超過 80MB，跳過（影片請拍短一點）`); continue }
      const ext = ((f.name || '').split('.').pop() || (f.type.includes('video') ? 'mp4' : 'jpg')).toLowerCase()
      const sr = await fetch('/api/mail-sync?sopsign=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ext }) })
      const sd = await sr.json()
      if (!sd || !sd.ok) { alert('取得上傳位址失敗'); continue }
      const ur = await fetch(sd.uploadUrl, { method: 'PUT', headers: { 'content-type': f.type || 'application/octet-stream' }, body: f })
      if (ur.ok) media.push(sd.publicUrl); else alert(`${f.name} 上傳失敗`)
    } catch(e){ alert(`${f.name} 上傳失敗`) }
  }
  let by = sopData && sopData.me ? sopData.me.name : (localStorage.getItem('sopName') || prompt('你的名字？') || '匿名')
  const r = await fetch('/api/mail-sync?sopreport=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ st, text: txt, media, by, token: TK() }) })
  const d = await r.json().catch(()=>null)
  repClose()
  if (d && d.ok) { alert('回報已送出，DD 已通知群裡 ✅'); sopLoad() } else alert((d&&d.error)||'送出失敗，再試一次')
}
async function sopResolve(id){

  const r = await fetch('/api/mail-sync?sopresolve=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) { if (d.status === 'pending') alert('已送出，等老闆審核 ✅'); refreshView() } else alert((d&&d.error)||'失敗（要先跟 DD 綁定GD）')

async function sopReview(id, pass){

  const r = await fetch('/api/mail-sync?sopreview=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id, pass: !!pass, token: TK() }) })

// 標準照上傳：選圖 → sopsign 簽名直傳 → 存進該列 data-ref（按「儲存這一站」才寫入定義）
function edRefPick(btn){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return
    btn.textContent = '⏳'
    try {
      const ext = ((f.name||'').split('.').pop()||'jpg').toLowerCase()
      const sr = await fetch('/api/mail-sync?sopsign=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ext }) })
      const sd = await sr.json()
      if (sd && sd.ok) { const ur = await fetch(sd.uploadUrl, { method:'PUT', headers:{'content-type': f.type||'image/jpeg'}, body: f }); if (ur.ok) { btn.closest('.sopEdRow').dataset.ref = sd.publicUrl; btn.innerHTML = '🖼✓'; btn.style.color='var(--primary)'; btn.style.fontWeight='800'; return } }
      btn.innerHTML = '🖼'; alert('上傳失敗，再試一次')
    } catch(e){ btn.innerHTML = '🖼'; alert('上傳失敗') }
  }
  inp.click()
}
function sopEdAdd(){
  const box = document.getElementById('sopEd')
  const div = document.createElement('div'); div.innerHTML = sopEdRow({ due:'11:00' })

  try {
    const r = await fetch('/api/mail-sync?sopedit=' + encodeURIComponent(K), { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ token: TK(), st: box.dataset.st, items }) })

// 我對這件事的每個「可評面」已評了幾個面向
function lbMyRated(x, meN){
  const out = []
  for (const a of ['find','fix']){
    const target = a==='find' ? x.by : x.doneBy
    if (!target || target==='匿名' || target===meN) continue
    const st = (x.stars||{})[a]||{}
    out.push({ a, n: window._lbD.facets.filter(f=>((st[f]||{})[meN])>=1).length })
  }
  return out
}

  </div>`).join(''):'<div class="mut">還沒有人回報過問題</div>'}</div></section>`
  h += `<section><h2>積分排行榜 <span class="hint">積分＝每件「發現」與「解決」的全員評星平均加總（1~5⭐）</span></h2>
  <div class="scroll"><table><thead><tr><th>#</th><th style="text-align:left">夥伴</th><th>發現分</th><th>解決分</th><th>總積分</th>${d.facets.map(f=>'<th>'+f+'</th>').join('')}<th>發現次</th><th>解決次</th></tr></thead><tbody>`

// 完成任務卡（排行榜評分用）：拉桿評星＋等級說明，onchange 就地送出
function rateCard(x, meN, archived){
  const d = window._lbD
  let s = `<div style="background:var(--card);border:1.5px solid ${archived?'var(--line)':'#BBE3CC'};border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px">
    <div><b>✅ ${x.text||'（附件）'}</b>${(x.media||[]).map((m,i)=>` <a href="${m}" target="_blank">📎${i+1}</a>`).join('')}</div>
    <div class="hint">${x.st||''}・發現：${x.by}・${x.ts}｜解決：${x.doneBy||'—'}${x.doneTs?'・'+x.doneTs:''}${x.durMin?`・耗時${x.durMin}分`:''}</div>`
  for (const a of ['find','fix']){
    const target = a==='find' ? x.by : x.doneBy
    if (!target || target==='匿名') continue
    const avg = a==='find' ? x.findAvg : x.fixAvg
    const st = (x.stars||{})[a]||{}
    const nAll = Object.values(st).reduce((t2,f)=>t2+Object.keys(f||{}).length,0)
    const canVote = meN && meN!==target
    s += `<div style="margin-top:8px;font-weight:800;font-size:14px">${a==='find'?'🔍 發現':'🔧 解決'}｜${target} <span class="avg">${avg!=null?'⭐'+avg:'—'}</span> <span class="hint">${nAll}票${canVote?'':(meN===target?'（自己的不能評）':'')}</span></div>`
    if (canVote){
      s += `<div style="background:var(--soft);border-radius:10px;padding:7px 10px;margin-top:4px">`
      s += d.facets.map(f=>{ const mine = (st[f]||{})[meN]||0
        return `<div style="display:flex;align-items:center;gap:8px;padding:3px 0"><span style="width:34px;font-size:13px;font-weight:700;flex:0 0 auto">${f}</span><input type="range" min="1" max="5" step="1" value="${mine||3}" style="flex:1;accent-color:#E8B931;min-width:80px" oninput="lbSlide(this,'${x.id}','${a}','${f}')" onchange="lbRate(this,'${x.id}','${a}','${f}')"><span class="lbst" style="width:78px;text-align:right;font-size:15px;color:#E8B931;flex:0 0 auto">${mine?'★'.repeat(mine)+'☆'.repeat(5-mine):'<span class="mut" style="font-size:13px">未評</span>'}</span></div>`
      }).join('')
      s += `<div id="fd_${x.id}_${a}" class="hint" style="margin-top:3px">拉一下拉桿：星數＋等級說明會即時顯示，放開手＝送出（每面向一票、可改）；不熟的面向可以不評</div></div>`
    }
  }
  if (!archived && meN) s += `<div style="margin-top:6px;display:flex;justify-content:flex-end;gap:8px;align-items:center"><span class="hint">兩邊面向都評完會自動收進封存</span><button class="mini" onclick="lbSkipFn('${x.id}')">先收起</button></div>`
  s += `</div>`
  return s
}
function lbSlide(el, id, aspect, facet){

  const fd = document.getElementById('fd_'+id+'_'+aspect); if (fd) fd.textContent = facet+'｜'+LVLTXT[v]
}
async function lbRate(el, id, aspect, facet){
  const stars = +el.value
  const r = await fetch('/api/mail-sync?soprate=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ id, aspect, facet, stars, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (!d || !d.ok) { alert((d&&d.error)||'評分失敗'); return }
  const x = (window._lbD.issues||[]).find(i=>i.id===id)
  if (x) x.stars = d.stars
  const sp = el.parentElement.querySelector('.lbst'); if (sp) sp.innerHTML = '★'.repeat(stars)+'☆'.repeat(5-stars)
  const fd = document.getElementById('fd_'+id+'_'+aspect); if (fd) fd.textContent = '✅ 已送出｜'+facet+'｜'+LVLTXT[stars]
  const meN = window._lbD.me && window._lbD.me.name

function lbElapsed(at){ if(!at) return ''; const m=Math.floor((Date.now()-at)/60000); return m<60?`${m}分`:`${Math.floor(m/60)}時${m%60}分` }
function taskCard(x, meN, me){

    <div class="hint">發現：${x.by}・${x.ts}</div>`
  if (x.pub==='pending') s += `<div style="color:#A85C26;font-weight:800;font-size:13px">🕐 等確認發布（還沒進群）</div>`
  if (x.pub==='hold') s += `<div class="hint" style="font-weight:700">📥 保留中（不進群）</div>`
  if (x.due) s += `<div class="hint" style="color:#A85C26;font-weight:700">⏰ 排定：${x.due}</div>`
  if (x.status==='open' && x.claimBy) s += `<div style="color:var(--pdark);font-weight:800">🔧 ${x.claimBy} 處理中・已 ${lbElapsed(x.claimAt)}</div>`
  if (x.status==='pending') s += `<div style="color:#A85C26;font-weight:700">🕐 ${x.doneBy} 已處理・等審核</div>`
  // 📝 階段性 checklist（文字＋圖片；張良 2026-09-22）
  const ck = x.ck||[]
  if (ck.length || meN) {
    const dn = ck.filter(c=>c.done).length
    s += `<div style="margin-top:6px;border-top:1px dashed var(--line);padding-top:5px">`
    if (ck.length) s += `<div style="font-size:13px;font-weight:800">📝 步驟 ${dn}/${ck.length}</div>`
    ck.forEach(c=>{ s += `<div style="display:flex;gap:6px;align-items:flex-start;font-size:14px;padding:2px 0">
      ${meN?`<input type="checkbox" ${c.done?'checked':''} style="margin-top:2px" onclick="ckOp('${x.id}','cktog','${c.id}')">`:(c.done?'☑':'☐')}
      <span style="flex:1;${c.done?'text-decoration:line-through;color:var(--muted)':''}">${(c.t||'').replace(/</g,'&lt;')}${c.img?` <a href="${c.img}" target="_blank">📎圖</a>`:''}${c.done&&c.doneBy?` <span class="hint">${c.doneBy}</span>`:''}</span>
      ${meN?`<button class="mini" style="padding:1px 6px;color:var(--red)" onclick="if(confirm('刪除這個步驟？'))ckOp('${x.id}','ckdel','${c.id}')">✕</button>`:''}
    </div>` })
    if (meN) s += `<button class="mini" onclick="ckAdd('${x.id}')">＋ 加步驟</button>`
    s += `</div>`
  }
  if (meN) {
    s += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">`
    if (x.status==='open' && !x.claimBy) s += `<button class="mini on" onclick="lbOp('${x.id}','claim')">🙋 我來解決</button>`
    if (x.status==='open' && x.claimBy===meN) s += `<button class="mini on" onclick="sopResolve('${x.id}')">✅ 解決了</button><button class="mini" onclick="lbOp('${x.id}','unclaim')">放棄</button>`
    if (x.status==='open' && x.claimBy && x.claimBy!==meN) s += `<button class="mini" onclick="sopResolve('${x.id}')">✅ 已解決</button>`
    if (x.status==='open' && !x.claimBy) s += `<button class="mini" onclick="sopResolve('${x.id}')">✅ 已解決</button>`
    if (x.status==='pending' && me && me.approver) s += `<button class="mini on" onclick="sopReview('${x.id}',1)">✅ 核准</button><button class="mini" style="color:var(--red)" onclick="sopReview('${x.id}',0)">↩︎ 退回</button>`
    if ((x.pub==='pending'||x.pub==='hold') && me && me.approver) s += `${x.pub!=='hold'?'':''}<button class="mini on" onclick="lbOp('${x.id}','pub','go')">📣 發布</button>${x.pub==='pending'?`<button class="mini" onclick="lbOp('${x.id}','pub','hold')">📥 保留</button>`:''}<button class="mini" style="color:var(--red)" onclick="if(confirm('刪除這筆回報？'))lbOp('${x.id}','pub','del')">🗑 刪除</button>`
    s += `<button class="mini" onclick="lbOp('${x.id}','flag',${x.flag?0:1})">${x.flag?'取消🚩':'🚩標記'}</button><button class="mini" onclick="lbDue('${x.id}','${(x.due||'').replace(/'/g,'')}')">⏰排時間</button><button class="mini" onclick="taskOwn('${x.id}')">👤負責人</button>`
    s += `</div>`
  }
  s += `</div>`
  return s
}

function shInitRange(){ if(window._shRangeStart) return; const [y,m]=todayTpe().slice(0,7).split('-').map(Number); const b=new Date(y,m-1-2,1), f=new Date(y,m-1+2,1); window._shRangeStart=b.getFullYear()+'-'+String(b.getMonth()+1).padStart(2,'0'); window._shRangeEnd=f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0') }

async function shiftDrop(ev, pos, dt){
  ev.preventDefault(); ev.stopPropagation(); ev.currentTarget.style.outline = ''
  const id = ev.dataTransfer.getData('text/plain'); if (!id) return
  if (id.startsWith('u|')) { // v4.6.3（張良）：未排名片拖進格子＝直接排班（時間帶同崗位最近一筆）
    const nm = id.slice(2), d0 = window._shiftD
    if (d0.sched.some(x=>x.date===dt && (x.pos||'未分崗')===pos && x.name===nm)) return
    const byNew = (a,b)=>b.date.localeCompare(a.date)
    const last = [...d0.sched].filter(x=>(x.pos||'未分崗')===pos).sort(byNew)[0] || [...d0.sched].sort(byNew)[0]
    const tmp = { name: nm, date: dt, start: last?last.start:'11:00', end: last?last.end:'20:00', break: last?(last.break==null?60:last.break):60, pos: (pos==='未分崗'?'':pos), id: 'tmp' + Math.random().toString(36).slice(2) }
    queueSaveTmp(tmp); shiftRender(); return
  }
  const d = window._shiftD; let it = d.sched.find(x=>x.id===id)
  if (!it) { it = shMergedSched().find(x=>x.id===id); if (it) d.sched.push(it) } // v4.28.6 舊月的卡也拖得動
  if (!it) return
  if (it.date === dt && (it.pos||'未分崗') === pos) return
  it.date = dt; it.pos = (pos==='未分崗'?'':pos); shiftRender() // 先畫再存（樂觀更新）
  if (String(id).startsWith('tmp')) return // 還在排隊的卡只改畫面，真正寫入由隊伍那筆帶 pos/date
  shQueue(async ()=>{ const d2 = await shPost({ op:'save', item: it, token: TK() }); if (!(d2&&d2.ok)) alert((d2&&d2.error)||'移動失敗') })
}

function menuExport(kind){ // 匯出完整菜單（張良 2026-10-02）：txt=文字檔 / img=圖片檔；只含現行菜單（刪除的不進）
  const d = window._menuD; if (!d) return
  const L = []
  L.push('GROUN:D 菜單 ' + todayTpe())
  if (d.draft.note) L.push(d.draft.note)
  ;(d.draft.sections||[]).forEach(s2=>{
    L.push('')
    L.push('【' + s2.name + '】' + (s2.note ? '（' + s2.note + '）' : ''))
    ;(s2.items||[]).forEach(i2=>{
      L.push('・' + i2.name + (i2.en ? '｜' + i2.en : '') + '｜$' + i2.price + (i2.np ? '（新售價 $' + i2.np + '）' : '') + (i2.note ? '｜' + i2.note : ''))
    })
  })
  if (kind === 'txt') {
    const blob = new Blob(['\ufeff' + L.join('\n')], { type: 'text/plain;charset=utf-8' })
    const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'GROUND菜單_' + todayTpe() + '.txt'; a2.click(); URL.revokeObjectURL(a2.href)
    return
  }
  // 圖片：canvas 畫整份
  const pad = 40, lh = 34, W = 1000
  const cv = document.createElement('canvas'); cv.width = W; cv.height = pad * 2 + lh * L.length
  const g = cv.getContext('2d')
  // v4.25.7（張良「匯出的圖片沒辦法看」）：匯出圖=給人看/印的，固定白底深字不跟深色主題——底色曾被深色改版誤掃成#2E2814深底深字
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, cv.width, cv.height)
  L.forEach((ln, i) => {
    const isTitle = i === 0, isSec = ln.startsWith('【')
    g.fillStyle = isTitle ? '#F92A1B' : isSec ? '#1d4e79' : '#22303f'
    g.font = (isTitle ? '900 30px' : isSec ? '800 24px' : '500 20px') + ' "PingFang TC",system-ui,sans-serif'
    g.fillText(ln, pad, pad + lh * i + 22)
  })
  cv.toBlob(bl => { const a2 = document.createElement('a'); a2.href = URL.createObjectURL(bl); a2.download = 'GROUND菜單_' + todayTpe() + '.png'; a2.click(); URL.revokeObjectURL(a2.href) }, 'image/png')
}

  <div class="hint" style="margin:8px 0">水準 ${f.level} 份/日・成長 ×${f.growth}${f.growthRate!=null?`（近7vs前7 ${f.growthRate>0?'+':''}${Math.round(f.growthRate*100)}%）`:''}・校正 ×${f.calib}（樣本 ${f.calibMeta.n} 天${f.calibMeta.R?'，R='+f.calibMeta.R:''}）・正常營業日 ${f.normalDays} 天（${f.dataFrom||''}~${f.dataTo||''}）${f.notes.length?'<br>⚠ '+f.notes.join('；'):''}</div>
  <div class="scroll"><table><thead><tr><th>日期</th><th>週幾比例</th><th>校正前</th><th>系統預測</th><th>舊法(備料卡)</th></tr></thead><tbody>

  </tbody></table></div>
  <details style="margin-top:8px"><summary class="hint" style="cursor:pointer;font-weight:700">明日品項預測（前 20）＋佔比</summary>
  <div class="scroll" style="margin-top:6px"><table><thead><tr><th>品項</th><th>佔比</th><th>明日預測</th><th>舊法</th><th>調</th></tr></thead><tbody>
  ${(()=>{ const fi=(f.futureItems[0]||{}).items||{}; const wd0=f.future[0]?f.future[0].wd:1
    const d0 = f.future[0]?f.future[0].date:''
    const adjD = (d.adj||{})[d0]||{}
    return f.shares.slice(0,20).map(s=>{ const a=adjD[s.k]; return `<tr><td class="iname">${s.n}</td><td>${Math.round(s.share*1000)/10}%</td><td class="avg">${fi[s.k]||0}${a?`<span style="color:#A85C26;font-weight:800"> ${a.n>0?'+':''}${a.n}</span>`:''}</td><td>${Math.round((f.baseItems[s.k]||{})[wd0]||0)}</td><td><button class="mini" style="padding:1px 8px" onclick="fcAdj('${d0}','${s.k}',${a?a.n:0},'${a?(a.why||'').replace(/'/g,''):''}')">±</button></td></tr>` }).join('') })()}
  </tbody></table></div></details>
  <details style="margin-top:8px"><summary class="hint" style="cursor:pointer;font-weight:700">準確度（新模型 vs 舊法）＋逐日</summary>
  ${d.snapDays?`<div class="scroll" style="margin-top:6px"><table><thead><tr><th>期間</th><th>全店WAPE系統</th><th>最終</th><th>舊</th><th>品項WAPE新</th><th>舊</th><th>逐日勝負</th><th>高/低估</th></tr></thead><tbody>${accRow('近7天',d.acc7)}${accRow('近28天',d.acc28)}</tbody></table></div>
  <div class="scroll" style="margin-top:6px"><table><thead><tr><th>日期</th><th>實際</th><th>新預測</th><th>舊法</th></tr></thead><tbody>${d.daily.map(x=>`<tr><td>${x.date.slice(5)}</td><td class="avg">${x.actual}</td><td style="${Math.abs(x.sys-x.actual)<=Math.abs(x.base-x.actual)?'color:var(--green);font-weight:800':''}">${x.sys}</td><td style="${Math.abs(x.base-x.actual)<Math.abs(x.sys-x.actual)?'color:var(--green);font-weight:800':''}">${x.base}</td></tr>`).join('')}</tbody></table></div>`:'<div class="mut" style="margin-top:6px">還沒有快照實績——每天 11:00 自動鎖當日預測，明天起開始累積成績單</div>'}

  <details style="margin-top:8px"><summary class="hint" style="cursor:pointer;font-weight:700">中間值（星期比例／有效週）</summary>
  <div class="hint" style="margin-top:6px">星期比例：${[1,2,3,4,5].map(w=>`週${wdN[w]} ${f.ratios[w]||1}`).join('・')}<br>有效週：${f.weekMeta.map(w=>`${w.week.slice(5)}起${w.days}天${w.valid?'✓':'✗'}`).join('｜')}</div></details>

  el.innerHTML = h
}
// ── 今日賣完回報（張良 2026-09-26 P2）：收班時勾——只記「有賣完」不用時間；預測佔比/校正會用到 ──
async function soLoad(){
  const el = document.getElementById('sosec'); if (!el) return
  let d
  try { const r = await fetch('/api/mail-sync?fcso=' + encodeURIComponent(K)); d = await r.json() } catch(e){}
  if (!d || !d.ok) { el.innerHTML = ''; return }
  if (d.none) { // 公休/未到11:00：區塊照樣顯示位置＋說明（張良 2026-09-26「沒看到在哪」——藏起來反而找不到）
    el.innerHTML = `<section><div style="font-weight:800;color:var(--muted)">今日賣完回報 <span class="hint">${d.none}——營業日 11:00 後這裡會出現品項清單，收班時把賣完的勾一勾</span></div></section>`
    return
  }
  const soN = d.items.filter(x=>x.so).length
  el.innerHTML = `<section><details><summary style="font-weight:800;cursor:pointer">今日賣完回報（收班勾）${soN?`<span style="color:var(--red);font-weight:800">・已勾 ${soN} 項</span>`:''} <span class="hint">哪些品項今天賣完了？收班時勾一下——預測會把它當「需求下限」不會誤判賣不動</span></summary>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:8px">
    ${d.items.map(x=>`<label style="display:flex;gap:7px;align-items:center;background:${x.so?'#3A2023':'var(--soft)'};border:1px solid ${x.so?'#F0B8B1':'var(--line)'};border-radius:9px;padding:7px 10px;font-size:14px;cursor:pointer"><input type="checkbox" ${x.so?'checked':''} onchange="soTog('${x.k}',this.checked)" style="width:16px;height:16px"> ${x.n}</label>`).join('')}
    </div></details></section>`
}
async function soTog(k, on){
  if (!TK()) { alert('要先登入才能勾賣完：按右上「登入」'); soLoad(); return }
  const r = await fetch('/api/mail-sync?fcso=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ k, on, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (!d || !d.ok) alert((d&&d.error)||'失敗')
  soLoad()
}
// ── 特殊日標記＋人工調整（主管/審核人；在預測驗證區操作）──
async function fcSpecial(dateDef){
  const date = prompt('特殊日日期（YYYY-MM-DD；標記後該日不參與比例/水準/校正計算）', dateDef || todayTpe())
  if (!date) return
  const note = prompt('原因（包場/颱風/停電/設備故障/活動…）', '')
  if (note == null) return
  const r = await fetch('/api/mail-sync?fcsp=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ date, note, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) fcLoad(); else alert((d&&d.error)||'失敗')
}
async function fcSpecialDel(date){
  if (!confirm(date + ' 取消特殊日標記？')) return
  const r = await fetch('/api/mail-sync?fcsp=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ date, del: 1, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) fcLoad(); else alert((d&&d.error)||'失敗')
}
async function fcAdj(date, k, n0, why0){
  const n = prompt(`人工調整 ±份數（${date}；現在 ${n0>0?'+':''}${n0||0}；0=清除）`, String(n0||''))
  if (n == null) return
  let why = ''
  if (Math.round(Number(n)||0) !== 0) { why = prompt('原因（必填——規格要求）', why0||'') || ''; if (!why.trim()) { alert('要填原因'); return } }
  const r = await fetch('/api/mail-sync?fcadj=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ date, k, n, why, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) fcLoad(); else alert((d&&d.error)||'失敗')
}
// ── 🐞 App 錯誤自動偵測 L1（張良 2026-09-26）：JS 錯誤/未攔截 Promise 自動上報（同錯誤 3 分鐘內只送一次）──
const _erSent = {}
function errReport(msg, src, stack){
  try {
    const key = String(msg).slice(0, 120)
    if (_erSent[key] && Date.now() - _erSent[key] < 180000) return
    _erSent[key] = Date.now()
    fetch('/api/mail-sync?errlog=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ msg: String(msg).slice(0,300), src: String(src||'').slice(0,120), stack: String(stack||'').slice(0,600), page: curStore || location.pathname, ver: (document.querySelector('meta[name=appver]')||{}).content || '', token: TK() }) }).catch(()=>{})
  } catch(e){}
}
window.addEventListener('error', (e) => { errReport(e.message || '未知錯誤', (e.filename||'') + ':' + (e.lineno||''), e.error && e.error.stack) })
window.addEventListener('unhandledrejection', (e) => { const r = e.reason || {}; errReport('未處理的Promise：' + (r.message || String(r)).slice(0,200), 'promise', r.stack) })
// 🐞 問題回報・功能許願（張良 2026-09-26 全員入口；09-26晚抓包「切過去明顯慢」→改 stale-first：先畫快取秒開、背景更新；技術日誌另外非同步塞進來）
function errsRender(){
  if (curStore !== 'errs') return
  document.getElementById('upd').textContent = '問題回報・功能許願'
  const d = window._lbD || {}
  const mine = (d.issues||[]).filter(x=>['App問題','功能許願'].includes(x.st))
  const badge = x => x.status==='done' ? '<span style="color:var(--green);font-weight:800">✅ 已完成</span>' : x.status==='pending' ? '<span style="color:#A85C26;font-weight:800">🕐 待審核</span>' : (x.claimBy ? `<span style="color:var(--pdark);font-weight:800">處理中（${x.claimBy}）</span>` : '<span class="hint">已收到</span>')
  app.innerHTML = `<section><h2>問題回報・功能許願 <span class="hint">用得不順、想要新功能——文字＋照片＋影片直接說明，老闆看得到</span></h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    <button class="mini on" style="padding:10px 18px" onclick="sopReport('App問題')">回報使用問題</button>
    <button class="mini on" style="padding:10px 18px" onclick="sopReport('功能許願')">許願新功能</button>
  </div>
  ${mine.length ? mine.map(x=>`<div style="background:var(--card);border:1.5px solid ${x.status==='done'?'#BBE3CC':'var(--line)'};border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:14px">
    <b>${x.st==='功能許願'?'💡':'🐞'} ${x.text||'（附件）'}</b>${(x.media||[]).length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">${x.media.map(m=>/\.(mp4|mov|webm|m4v)(\?|$)/i.test(m)?`<a href="${m}" target="_blank" style="font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 9px">🎬 影片</a>`:`<img src="${m}" style="width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer" onclick="imgView('${m}')">`).join('')}</div>`:''}
    <div class="hint">${x.by}・${x.ts}・${badge(x)}</div>
  </div>`).join('') : '<div class="mut">還沒有回報——上面兩顆按鈕隨時丟</div>'}
  </section><div id="errTech"></div>`
  errsTech() // 技術日誌（主管）非同步補進來，不擋畫面
}
async function errsView(){
  curStore = 'errs'; setTabs('errs')
  if (!window._lbD) { const c = tcGet('lb'); if (c) window._lbD = c }
  if (window._lbD) errsRender(); else app.innerHTML = '<section>載入中…</section>'
  await lbFetch()
  errsRender()
}
async function errsTech(){
  const el = document.getElementById('errTech'); if (!el || !TK()) return
  try {
    const r2 = await fetch('/api/mail-sync?errs=' + encodeURIComponent(K) + '&me=' + encodeURIComponent(TK()))
    const d2 = await r2.json()
    if (!d2 || !d2.ok) return
    const el2 = document.getElementById('errTech'); if (!el2 || curStore !== 'errs') return
    el2.innerHTML = `<section><details><summary style="font-weight:800;cursor:pointer">自動偵測錯誤日誌（${d2.list.length}）<span class="hint">程式報錯自動抓；同錯當天只通知一次</span></summary>
      ${d2.list.length?d2.list.map(x=>`<div style="padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px"><b style="color:var(--red)">${x.msg}</b><div class="hint">頁面 ${x.page||'?'}・v${x.ver||'?'}・${x.by}・首見 ${x.day} ${x.ts}・累計 ${x.n} 次</div></div>`).join(''):'<div class="mut" style="margin-top:6px">沒有錯誤紀錄 🎉</div>'}
      </details></section>`
  } catch(e){}
}
// 🔍 發現王明細（張良 2026-09-26）
function lbFinder(nm){
  const d = window._lbD
  const arr = (d.issues||[]).filter(x=>x.by===nm)
  const ov = document.createElement('div'); ov.id='fdOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(16,24,43,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px'
  ov.innerHTML = `<div style="background:#222B38;border:1px solid #3B4654;box-shadow:0 18px 50px rgba(0,0,0,.55);border-radius:14px;max-width:520px;width:100%;padding:16px;max-height:84vh;overflow:auto" onclick="event.stopPropagation()">
    <div style="font-weight:800;margin-bottom:8px">🔍 ${nm} 發現的問題（${arr.length} 件）</div>
    ${arr.map(x=>`<div style="border-bottom:1px dashed var(--line);padding:7px 0;font-size:14px">
      <b>${x.text||'（附件）'}</b> ${x.status==='done'?'<span style="color:var(--green);font-weight:800">✅</span>':x.status==='pending'?'<span style="color:#A85C26">🕐</span>':''}
      <div class="hint">${x.st||''}・${x.ts}${x.findAvg!=null?`・發現評分 ⭐${x.findAvg}`:''}${(x.media||[]).map((m,i)=>` <a href="${m}" target="_blank">📎${i+1}</a>`).join('')}</div>
    </div>`).join('')||'<div class="mut">—</div>'}
    <div style="text-align:right;margin-top:10px"><button class="mini" style="padding:8px 14px" onclick="document.getElementById('fdOv').remove()">關閉</button></div></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
// 開場：深層連結(#meet=/#sop=/#tab=)優先→重新整理留在原分頁→首頁（v4.16.0）
(function(){
  let v = null; try { v = sessionStorage.getItem('prepView') } catch(_) {}
  const R = { lb: loadLB, buy: buyLoad, meet: meetLoad, shift: shiftLoad, fb: fbLoad, menu: menuLoad, errs: errsView, sop: sopPage, settings: settingsLoad, taskx: ()=>taskEmbed(), food: ()=>invLoad('food'), pack: ()=>invLoad('pack'), abeach: ()=>load('abeach') }
  const routeHash = () => { // v4.18.5：頁內點深層連結也要動（原本只在開頁時解析）
    const hs = location.hash || ''
    const mS2 = hs.match(/sop=([A-Za-z0-9_-]+)/), mM = hs.match(/meet=([A-Za-z0-9]+)/), mT = hs.match(/tab=([a-z]+)/)
    if (mS2) { sopPage(); glowWait('sopit-' + mS2[1]); return true }
    if (mM) { meetLoad(); glowWait('mt-' + mM[1]); setTimeout(()=>{ if (TK()) meetMop({ op:'view', id: mM[1] }, 1) }, 1500); return true }
    if (mT && R[mT[1]]) { R[mT[1]](); return true }
    return false
  }
  window.addEventListener('hashchange', routeHash)
  if (!routeHash()) { if (v && R[v]) R[v](); else load('ground') }
  // 側欄每個分頁小🔗（張良：這裡旁邊都建立複製連結）
  try { document.querySelectorAll('.tabs button[id^="tab-"]').forEach(b=>{ const k2 = b.id.slice(4); if (k2 === 'home') return
    const sp = document.createElement('span'); sp.className = 'lnkbtn'; sp.title = '複製此分頁連結'; sp.textContent = '🔗'; sp.style.marginLeft = 'auto'
    sp.addEventListener('click', e2=>{ e2.stopPropagation(); if (k2 === 'task') { try { navigator.clipboard.writeText(location.origin + '/ops-tasks.html') } catch(_) {} const t3 = document.createElement('div'); t3.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;background:#10182B;color:#fff;border-radius:10px;padding:8px 16px;font-size:14px'; t3.textContent = '🔗 連結已複製'; document.body.appendChild(t3); setTimeout(()=>t3.remove(), 1200) } else copyLink('#tab=' + k2) })
    b.appendChild(sp) }) } catch(_) {}
})()
