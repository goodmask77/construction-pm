<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GD</title>
<meta name="robots" content="noindex" />
<!-- PWA（張良 2026-09-21 幹成App）：手機瀏覽器「加入主畫面」→ 全螢幕獨立視窗＋icon；icon=:D 紅標、名稱=GD -->
<link rel="manifest" href="/ops/manifest.json" />
<link rel="icon" type="image/png" href="/ops/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GD" />
<meta name="theme-color" content="#087EBA" />
<link rel="apple-touch-icon" href="/ops/icon-180.png" />
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Beach Ops 同款視覺（張良 2026-09-24：顏色/字型/間距/排版對齊 beachops）——類名不動只換皮 */
  :root{ --bg:#F2F6FA; --card:#FFF; --soft:#F5F8FC; --ink:#0E2A47; --text:#33475E; --muted:#64788F;
    --primary:#1677D9; --pdark:#10529E; --psoft:#E8F2FD; --line:#E2E9F2; --green:#12923F; --red:#D14343;
    --grad:linear-gradient(135deg,#2493EF,#1266C8);
    --shadow:0 1px 2px rgba(15,35,60,.04),0 8px 24px rgba(15,35,60,.06); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
  .brand{font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--primary)}
  .bseg{cursor:pointer;opacity:.35;padding-bottom:2px}
  .bseg.on{opacity:1;border-bottom:2.5px solid var(--primary)}
  h1{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:6px}
  .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:15px;font-weight:700;color:#33475E;cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:background .15s;display:inline-flex;gap:7px;align-items:center}
  .tabs button:hover{background:#EEF4FB}
  .tabs button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(18,102,200,.30)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
  .kpi .l{font-size:14px;font-weight:600;color:var(--text)}
  .kpi .v{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;margin-top:16px;overflow:hidden}
  .mini{border:1px solid #D5DEEA;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#31567E;cursor:pointer;margin-left:4px;transition:background .15s}
  .mini:hover{background:#EEF4FB}
  .mini.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 9px rgba(18,102,200,.28)}
  h2{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
  .hint{font-size:13px;color:var(--muted);font-weight:500}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  th{background:#F4F8FC;color:var(--muted);font-size:12.5px;font-weight:700;text-align:right;padding:9px 8px;white-space:nowrap;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 8px;border-top:1px solid #EEF2F7;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even) td{background:#FAFCFE}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  .catband td{background:var(--psoft)!important;color:var(--pdark);font-weight:800;font-size:14px}
  .subrow td{background:#FBF6EA!important}
  .todaycol{background:var(--psoft)!important;color:var(--pdark)!important;animation:glowp 2s ease-in-out infinite;position:relative}
  @keyframes glowp{0%,100%{box-shadow:inset 0 0 0 1.5px #2493EF,0 0 5px rgba(36,147,239,.3)}50%{box-shadow:inset 0 0 0 1.5px #2493EF,0 0 13px rgba(36,147,239,.7)}}
  @media (prefers-reduced-motion:reduce){.todaycol{animation:none;box-shadow:inset 0 0 0 1.5px #2493EF}}
  .iname{max-width:40vw;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--ink)}
  .avg{font-weight:800;color:var(--pdark);font-size:15px}
  .up{color:var(--green);font-weight:800} .dn{color:var(--red);font-weight:800} .mut{color:var(--muted)}
  .bar{display:inline-block;background:var(--primary);border-radius:2px 2px 0 0;width:14px;vertical-align:bottom}
  .slotrow{display:flex;align-items:flex-end;gap:6px;padding:6px 2px 0}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
  .foot{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}
  .err{background:#FDEBEB;color:#D14343;border-radius:12px;padding:14px;font-weight:700;margin-top:20px}
  @media(max-width:480px){ .kpi .v{font-size:19px} h1{font-size:22px} .tabs button{padding:7px 13px;font-size:14px} }
  /* 桌機＝Beach Ops 左側欄版型（≥920px；分頁選單變側欄、內容右移） */
  @media(min-width:920px){
    body{padding-left:216px}
    .wrap{max-width:1200px}
    .tabs{position:fixed;left:0;top:0;bottom:0;width:216px;margin:0;padding:18px 12px;background:#fff;border-right:1px solid var(--line);flex-direction:column;align-items:stretch;gap:4px;overflow-y:auto;z-index:20;flex-wrap:nowrap}
    .tabs::before{content:"≋ GD 營運看板";display:block;font-weight:800;font-size:15px;color:var(--primary);padding:2px 10px 16px;letter-spacing:.02em}
    .tabs button{text-align:left;border:none;background:transparent;border-radius:10px;padding:11px 13px;font-size:15px}
    .tabs button:hover{background:#EEF4FB}
    .tabs button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(18,102,200,.32)}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 品牌字標＝切店（張良 2026-09-21）；右上=⏰打卡＋🔄更新App（張良 2026-09-22：🔄不是只抓數據，是整個App重開、連新功能一起拿最新版） -->
  <div class="brand" style="display:flex;align-items:center;justify-content:space-between">
    <span><span id="bs-ground" class="bseg on" onclick="load('ground')">GROUN:D</span> × <span id="bs-abeach" class="bseg" onclick="load('abeach')">A BEACH</span></span>
    <span style="display:flex;gap:6px"><button class="mini" style="font-size:14px;padding:5px 12px;font-weight:700;display:inline-flex;gap:5px;align-items:center" onclick="punchNow()" title="上下班打卡"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>打卡</button><button class="mini" style="padding:5px 10px;display:inline-flex;align-items:center" onclick="hardRefresh()" title="更新App到最新版"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4h-4"/></svg></button></span>
  </div>
  <h1>營運看板</h1>
  <div class="sub" id="upd">載入中…</div>
  <div class="tabs">
    <button id="tab-home" onclick="load(lastStore)" title="回營運看板" style="padding:7px 13px;font-size:16px">🏠</button>
    <button id="tab-task" onclick="taskLoad()">🛠 任務</button>
    <button id="tab-lb" onclick="loadLB()">🏆 排行榜</button>
    <button id="tab-food" onclick="invLoad('food')">🥩 盤點</button>
    <button id="tab-pack" onclick="invLoad('pack')">📦 包材</button>
    <button id="tab-buy" onclick="buyLoad()">🛒 採購</button>
    <button id="tab-meet" onclick="meetLoad()">📋 會議</button>
    <button id="tab-shift" onclick="shiftLoad()">📅 班表</button>
    <button id="tab-fb" onclick="fbLoad()">💬 回饋</button>
    <button id="tab-menu" onclick="menuLoad()">🍔 菜單</button>
    <button id="tab-gear" onclick="tabsEdit()" title="編輯分頁名稱/排序" style="padding:7px 10px">⚙️</button>
    <button id="tab-bell" onclick="notifyEdit()" title="群組通知開關" style="padding:7px 10px">🔔</button>
  </div>
  <div id="app"></div>
  <div class="foot">資料每天自動同步（打開即最新）・僅供內部參考與備料使用，請勿外傳連結</div>
</div>
<script>
const K = new URLSearchParams(location.search).get('k') || (location.hash || '').replace(/^#k?=?/, '') || '7ea362bae1f0274372d4ec7b27c78852' // 內建看板唯讀金鑰（短網址 /prep 用；與管理金鑰分開）
const fmt = n => 'NT$' + Math.round(n || 0).toLocaleString()
const app = document.getElementById('app')
let curStore = 'ground'
let lastStore = 'ground'
function setTabs(k){
  ['task','lb','food','pack','buy','meet','shift','fb','menu'].forEach(t => { const b = document.getElementById('tab-' + t); if (b) b.className = (t===k) ? 'on' : '' })
  const hb = document.getElementById('tab-home'); if (hb) hb.className = (k==='ground'||k==='abeach') ? 'on' : '' // 🏠=回店面（張良 2026-09-21：怕有人不知道怎麼回去）
  if (k === 'ground' || k === 'abeach') lastStore = k
  const g = document.getElementById('bs-ground'), a = document.getElementById('bs-abeach')
  if (g) g.className = 'bseg' + (lastStore==='ground' ? ' on' : '')
  if (a) a.className = 'bseg' + (lastStore==='abeach' ? ' on' : '')
}
// 🔄 更新App（張良 2026-09-22：不是只抓數據——整個 App 重開、連新功能一起拿最新版；r=時戳穿透 CDN 快取）
function hardRefresh(){ location.replace(location.pathname + '?r=' + Date.now()) }
// 依目前分頁重畫（綁定後/操作後用）
function goView(){
  if (curStore === 'task') taskLoad()
  else if (curStore === 'lb') loadLB()
  else if (curStore === 'food' || curStore === 'pack') invLoad(curStore)
  else if (curStore === 'buy') buyLoad()
  else if (curStore === 'meet') meetLoad()
  else if (curStore === 'shift') shiftLoad()
  else if (curStore === 'fb') fbLoad()
  else if (curStore === 'menu') menuLoad()
  else load(curStore, true)
}
// 🔑 輸入綁定碼（iPhone 加入主畫面的 App 跟 Safari 儲存分開→token 帶不過去；貼一次 DD 給的連結/代碼即可）
function bindPrompt(){
  const v = prompt('貼上 DD 給你的「個人連結」或綁定碼（跟 DD 說「綁定GD」拿）')
  if (!v) return
  const m = v.match(/me=([a-z0-9]+)/i) || v.match(/(pv[a-z0-9]{8,})/i)
  if (!m) { alert('看不懂這串，請完整貼上 DD 給的連結'); return }
  localStorage.setItem('prepToken', m[1])
  alert('綁定完成 ✅')
  goView()
}
const BIND_HINT = `跟 DD 說「綁定GD」拿個人連結；已加入主畫面的 App 請按 <button class="mini" onclick="bindPrompt()">🔑 輸入綁定碼</button>`
async function load(store, fresh){
  curStore = store
  setTabs(store)
  if (!K) { app.innerHTML = '<div class="err">網址缺少金鑰，請跟店長要完整連結</div>'; return }
  // ⚡ 快取先上（打開秒出畫面）、背景抓最新無感刷新（張良 2026-09-21：讀取太慢）
  const ck = 'obc_' + store
  let hadCache = false
  try { const c = localStorage.getItem(ck); if (c) { renderBoard(JSON.parse(c), store); hadCache = true; document.getElementById('upd').textContent = '⚡ 快取畫面・背景更新最新資料中…' } } catch(e){}
  if (!hadCache) app.innerHTML = '<section>載入中…</section>'
  let d
  try { const r = await fetch('/api/mail-sync?opsboard=' + encodeURIComponent(K) + '&store=' + store + (fresh ? '&r=' + Date.now() : '')); d = await r.json() } catch(e){}
  if (!d || !d.ok) { if (!hadCache) app.innerHTML = '<div class="err">讀不到資料（金鑰錯誤或連線問題），請跟店長要新連結</div>'; return }
  try { localStorage.setItem(ck, JSON.stringify(d)) } catch(e){}
  if (curStore !== store) return // 使用者已切到別店，別把畫面蓋回來
  renderBoard(d, store)
}
function renderBoard(d, store){
  document.getElementById('upd').textContent = '最新日結：' + (d.anchor || '—') + '・資料自動同步'
  let h = ''
  // 今日事項（張良 2026-09-22：最上面＝今天該做的事——任務/收貨/班表；資料來自各分頁快取，todayRender 畫）
  h += `<div id="todaysec"></div>`
  // 備料卡（GD：炸台/沙拉/吧檯；總平均＋每週幾平均＋峰值/低值——張良 2026-09-20 取消時段拆分，一早備好）
  if (d.prep) {
    const grps = [...new Set(d.prep.map(p=>p.grp))]
    let tw = new Date().getDay() // 今天星期幾（1~5發光）
    if (tw === 0 || tw === 6) tw = 1 // 週六日（GD公休）打開＝在準備週一的量 → 發光週一（張良 2026-09-20 抓到週日沒東西亮）
    h += `<section><h2>預估備料量 <span class="hint">份/日</span></h2>`
    h += `<div class="scroll"><table><thead><tr><th>項目</th><th>平均</th>${['一','二','三','四','五'].map((w,i)=>`<th${tw===i+1?' class="todaycol"':''}>週${w}${tw===i+1?' ★':''}</th>`).join('')}<th>峰值</th><th>低值</th></tr></thead><tbody>`
    grps.forEach(g=>{
      h += `<tr class="catband"><td colspan="9">${g}</td></tr>`
      d.prep.filter(p=>p.grp===g).forEach(p=>{
        const wds = (p.byWd||[]).map((v,i)=>{
          if(v==null||p.avg==null||!p.avg) return `<td>—</td>`
          // 每一格都顯示 %（高度一致，張良 2026-09-20）；與總平均的差
          const diff = Math.round((v-p.avg)/p.avg*100)
          const badge = `<div style="font-size:11.5px;font-weight:800;color:${diff>0?'var(--pdark)':diff<0?'var(--muted)':'#B9C4D0'}">${diff>0?'+':''}${diff}%</div>`
          return `<td${tw===i+1?' class="todaycol"':''}><b>${v}</b>${badge}</td>`
        }).join('')
        h += `<tr${p.sub?' class="subrow"':''}><td style="font-weight:${p.sub?800:700};color:${p.sub?'#8a5a2e':'var(--ink)'}">${p.sub?'└ ':''}${p.name}</td><td class="avg">${p.avg!=null?p.avg:'—'}</td>${wds}<td style="font-weight:800;color:#A85C26">${p.peak!=null?p.peak:'—'}</td><td class="mut">${p.low!=null?p.low:'—'}</td></tr>`
      })
    })
    h += `</tbody></table></div><div class="hint" style="margin-top:8px">怎麼用：①平均＝近30天「去掉最高/最低各一天」的截尾平均（颱風日/異常日不拉偏；樣本不足8天不截）②看今天星期幾那欄（藍底）＝該星期的截尾平均，±% 是跟平均的差（超過 ±10% 才顯示）③峰值/低值＝近30天單日最高/最低（極端值特意保留在這兩欄）——大日抓峰值、保守抓平均，低於低值就太少了。</div></section>`
  }
  // ✅ 今日SOP（張良 2026-09-21）：每站每天SOP＋拍照＋完成記時；先放佔位div，資料另外抓（sopLoad）
  if (store === 'ground') h += `<div id="sop"></div>`
  // 預做節奏表（張良 2026-09-21）：完整菜單＋品類分組＋隱藏設定；內容由 rhythmRender 畫（隱藏清單走即時的 sop 口）
  if (d.rhythm) {
    window._rhy = d.rhythm
    h += `<section><h2>預做節奏表 <span style="float:right;white-space:nowrap"><button class="mini on" id="rb15" onclick="rSwitch(15)">15分</button><button class="mini" id="rb30" onclick="rSwitch(30)">30分</button><button class="mini" id="rbMng" onclick="rMng()">🙈 隱藏管理</button></span><br><span class="hint">${d.rhythm.days ? `近 ${d.rhythm.days} 個營業日平均・每格＝該時段平均賣幾份（·＝不到0.5份）——照表預做、尖峰前先備` : '⏳ 資料累積中（GD 從 2026-09-21 起、AB 從 2026-09-22 起含歷史回補）——顯示近 7 個營業日平均，跑幾天會越來越準'}</span></h2><div id="rhyBody"></div></section>`
  }
  // KPI（張良 2026-09-22：搬到每日數據上面）
  h += `<div class="kpis">
    <div class="kpi"><div class="l">近30天營收（${d.kpi.days30} 個營業日）</div><div class="v">${fmt(d.kpi.rev30)}</div></div>
    <div class="kpi"><div class="l">日均營收</div><div class="v">${fmt(d.kpi.avgRev)}</div></div>
    <div class="kpi"><div class="l">近30天單數</div><div class="v">${(d.kpi.tx30||0).toLocaleString()}</div></div>
  </div>`
  // 日表（張良 2026-09-22 v3：去NT簡化版面、日期欄凍結、至14:00=14點前營收、總營收、表頭下平均列、高低於平均用色階（綠=高於、紅=低於，深淺=差多少））
  const isGD = d.store === 'ground'
  const dv = d.days.filter(x=>x.rev>0) // 平均只算有營業的日子
  const mean = f => { const a = dv.map(f).filter(v=>v!=null&&isFinite(v)); return a.length ? a.reduce((s2,v)=>s2+v,0)/a.length : null }
  const luOf = x => x.lunchRev!=null ? x.lunchRev : (x.lunchPct!=null&&x.rev ? x.rev*x.lunchPct/100 : null)
  const avR = mean(x=>x.rev), avLu = isGD?mean(luOf):null, avTx = mean(x=>x.tx||null)
  const avAvg = (()=>{ const tr=dv.reduce((s2,x)=>s2+(x.rev||0),0), tt=dv.reduce((s2,x)=>s2+(x.tx||0),0); return tt?tr/tt:null })()
  const avCash = mean(x=>x.cash), avCard = mean(x=>x.card), avLp = mean(x=>x.linepay||null), avUb = mean(x=>x.uber||null), avDis = mean(x=>x.discount||null)
  const avKp = isGD?mean(x=>x.kioskPct):null, avTk = isGD?mean(x=>x.takePct):null
  const avSet = isGD?(()=>{ const a=(d.setPcts||[]).filter(v=>v!=null); return a.length?a.reduce((s2,v)=>s2+v,0)/a.length:null })():null
  const fN = v => v!=null ? Math.round(v).toLocaleString() : '—' // 去 NT$：數字乾淨版面
  const fP = v => v!=null?Math.round(v)+'%':'—'
  // 色階：跟該欄平均比，高=綠、低=紅，差越多越深（±3%內不上色）
  const heat = (v, avg) => { if (v==null||!avg) return ''; let dv2=(v-avg)/avg; if (Math.abs(dv2)<0.03) return ''; dv2=Math.max(-0.5,Math.min(0.5,dv2)); const a=Math.min(0.26,Math.abs(dv2)*0.5); return `background:rgba(${dv2>0?'220,38,38':'22,163,74'},${a.toFixed(2)})` } // 紅=高於平均(台灣看盤習慣)、綠=低於（張良 2026-09-22 指定反轉）
  const hc = (v, avg, extra) => `<td style="${heat(v,avg)}${extra?';'+extra:''}">${fN(v)}</td>`

function lbElapsed(at){ if(!at) return ''; const m=Math.floor((Date.now()-at)/60000); return m<60?`${m}分`:`${Math.floor(m/60)}時${m%60}分` }
function taskCard(x, meN, me){
  const stColor = x.status==='pending'?'#A85C26':'var(--red)'
  const border = x.flag?'#E8B931':x.status==='pending'?'#E8D089':'#F0B8B1'
  let s = `<div style="background:#fff;border:1.5px solid ${border};border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:14px">
    <div><b style="color:${stColor}">${x.flag?'🚩 ':''}${x.status==='pending'?'🕐':'⚠️'} ${x.text||'（附件）'}</b>${(x.media||[]).map((m,i)=>` <a href="${m}" target="_blank">📎${i+1}</a>`).join('')}</div>
    <div class="hint">發現：${x.by}・${x.ts}</div>`
  if (x.pub==='pending') s += `<div style="color:#A85C26;font-weight:800;font-size:13px">🕐 等老闆確認發布（還沒進群）</div>`
  if (x.pub==='hold') s += `<div class="hint" style="font-weight:700">📥 保留中（不進群）</div>`
  if (x.due) s += `<div class="hint" style="color:#A85C26;font-weight:700">⏰ 排定：${x.due}</div>`
  if (x.status==='open' && x.claimBy) s += `<div style="color:var(--pdark);font-weight:800">🔧 ${x.claimBy} 處理中・已 ${lbElapsed(x.claimAt)}</div>`
  if (x.status==='pending') s += `<div style="color:#A85C26;font-weight:700">🕐 ${x.doneBy} 已處理・等審核</div>`
  // 📝 階段性 checklist（文字＋圖片；張良 2026-09-22）
  const ck = x.ck||[]
  if (ck.length || meN) {
    const dn = ck.filter(c=>c.done).length
    s += `<div style="margin-top:6px;border-top:1px dashed var(--line);padding-top:5px">`
    if (ck.length) s += `<div style="font-size:13px;font-weight:800">📝 步驟 ${dn}/${ck.length}</div>`
    ck.forEach(c=>{ s += `<div style="display:flex;gap:6px;align-items:flex-start;font-size:14px;padding:2px 0">
      ${meN?`<input type="checkbox" ${c.done?'checked':''} style="margin-top:2px" onclick="ckOp('${x.id}','cktog','${c.id}')">`:(c.done?'☑':'☐')}
      <span style="flex:1;${c.done?'text-decoration:line-through;color:var(--muted)':''}">${(c.t||'').replace(/</g,'&lt;')}${c.img?` <a href="${c.img}" target="_blank">📎圖</a>`:''}${c.done&&c.doneBy?` <span class="hint">${c.doneBy}</span>`:''}</span>
      ${meN?`<button class="mini" style="padding:1px 6px;color:var(--red)" onclick="if(confirm('刪除這個步驟？'))ckOp('${x.id}','ckdel','${c.id}')">✕</button>`:''}
    </div>` })
    if (meN) s += `<button class="mini" onclick="ckAdd('${x.id}')">＋ 加步驟</button>`
    s += `</div>`
  }
  if (meN) {
    s += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">`
    if (x.status==='open' && !x.claimBy) s += `<button class="mini on" onclick="lbOp('${x.id}','claim')">🙋 我來解決</button>`
    if (x.status==='open' && x.claimBy===meN) s += `<button class="mini on" onclick="sopResolve('${x.id}')">✅ 解決了</button><button class="mini" onclick="lbOp('${x.id}','unclaim')">放棄</button>`
    if (x.status==='open' && x.claimBy && x.claimBy!==meN) s += `<button class="mini" onclick="sopResolve('${x.id}')">✅ 已解決</button>`
    if (x.status==='open' && !x.claimBy) s += `<button class="mini" onclick="sopResolve('${x.id}')">✅ 已解決</button>`
    if (x.status==='pending' && me && me.approver) s += `<button class="mini on" onclick="sopReview('${x.id}',1)">✅ 核准</button><button class="mini" style="color:var(--red)" onclick="sopReview('${x.id}',0)">↩︎ 退回</button>`
    if ((x.pub==='pending'||x.pub==='hold') && me && me.approver) s += `${x.pub!=='hold'?'':''}<button class="mini on" onclick="lbOp('${x.id}','pub','go')">📣 發布</button>${x.pub==='pending'?`<button class="mini" onclick="lbOp('${x.id}','pub','hold')">📥 保留</button>`:''}<button class="mini" style="color:var(--red)" onclick="if(confirm('刪除這筆回報？'))lbOp('${x.id}','pub','del')">🗑 刪除</button>`
    s += `<button class="mini" onclick="lbOp('${x.id}','flag',${x.flag?0:1})">${x.flag?'取消🚩':'🚩標記'}</button><button class="mini" onclick="lbDue('${x.id}','${(x.due||'').replace(/'/g,'')}')">⏰排時間</button><button class="mini" onclick="taskOwn('${x.id}')">👤負責人</button>`
    s += `</div>`
  }
  s += `</div>`
  return s
}

function shiftRender(){
  const d = window._shiftD; if (!d || curStore !== 'shift') return
  document.getElementById('upd').textContent = '班表 × 打卡・' + shiftYm
  const meN = d.me && d.me.name
  const tmin = hm => { const a=String(hm||'').split(':'); return (+a[0]||0)*60+(+a[1]||0) }
  const fhm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')
  const today = todayTpe()
  // 打卡整理：人+日 → 事件列（台北時區）
  const pd = {}
  for (const p2 of d.punches){
    const t3 = new Date(p2.ts)
    const dt = t3.toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'})
    const tm = t3.toLocaleTimeString('en-GB',{hour12:false,timeZone:'Asia/Taipei'})
    const k2 = p2.name+'|'+dt
    ;(pd[k2]=pd[k2]||[]).push({ m: (+tm.slice(0,2))*60+(+tm.slice(3,5)), dir: p2.dir })
  }
  Object.values(pd).forEach(a=>a.sort((x,y)=>x.m-y.m))
  // 逐「人日」：工時＋狀態
  const rows = []
  const keys = new Set([...d.sched.map(s=>s.name+'|'+s.date), ...Object.keys(pd)])
  for (const k2 of keys){
    const [name, date] = k2.split('|')
    if (!date || !date.startsWith(shiftYm)) continue
    const s = d.sched.find(x=>x.name===name && x.date===date)
    const ev = pd[k2]||[]
    let ms = 0, working = false
    for (let i=0;i<ev.length;i++){ if (ev[i].dir==='in'){ if (ev[i+1] && ev[i+1].dir==='out'){ ms += ev[i+1].m - ev[i].m; i++ } else if (date===today) working = true } }
    let workedMin = ms
    if (workedMin>0 && ev.length<=2 && s && s.break) workedMin = Math.max(0, workedMin - (+s.break||0)) // 只打上下班各一次→扣班表休息
    const firstIn = ev.find(e=>e.dir==='in'), lastOut = [...ev].reverse().find(e=>e.dir==='out')
    const st = []
    if (s){
      if (firstIn){ if (firstIn.m > tmin(s.start)+5) st.push('遲到'+(firstIn.m-tmin(s.start))+'分') }
      else if (date < today) st.push('未到')
      if (lastOut && lastOut.m < tmin(s.end) && !working) st.push('早退'+(tmin(s.end)-lastOut.m)+'分')
    } else if (ev.length) st.push('未排班出勤')
    if (working) st.push('上班中')
    const h2 = workedMin/60
    rows.push({ date, name, s, firstIn: firstIn?fhm(firstIn.m):'', lastOut: lastOut?fhm(lastOut.m):'', working, h: h2, ot1: Math.max(0,Math.min(h2-8,2)), ot2: Math.max(0,h2-10), over12: h2>12, st })
  }
  // 人員月統計＋勞基法旗標
  const per = {}
  rows.forEach(r=>{ const p3 = per[r.name] = per[r.name]||{ h:0, ot1:0, ot2:0, days:[], flags:new Set() }
    p3.h+=r.h; p3.ot1+=r.ot1; p3.ot2+=r.ot2
    if (r.h>0) p3.days.push(r.date)
    if (r.over12) p3.flags.add('單日>12h('+r.date.slice(5)+')') })
  Object.values(per).forEach(p3=>{
    if (p3.ot1+p3.ot2 > 46) p3.flags.add('月加班'+(Math.round((p3.ot1+p3.ot2)*10)/10)+'h＞46h上限')
    const ds = [...new Set(p3.days)].sort(); let run = 1
    for (let i=1;i<ds.length;i++){ const gap = (new Date(ds[i])-new Date(ds[i-1]))/86400e3; run = gap===1 ? run+1 : 1; if (run>6){ p3.flags.add('連上超過6天（七休一）'); break } }
  })
  const r1 = x => Math.round(x*10)/10
  let h = `<section><h2>班表 × 打卡 <span class="hint">${meN?'':BIND_HINT}</span></h2>
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
     <button class="mini" onclick="shiftNav(-1)">‹</button><b style="font-size:15px">${shiftYm}</b><button class="mini" onclick="shiftNav(1)">›</button>
     ${meN?`<button class="mini on" style="margin-left:auto;padding:8px 16px" onclick="shiftForm()">＋ 排班</button>`:''}
   </div>
   <div style="background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:7px 11px;margin-bottom:8px;font-size:14px"><b>GD 人員</b>：${(d.names||[]).map(n=>`<span style="border:1px solid var(--line);border-radius:8px;padding:1px 4px 1px 8px;margin-right:4px;white-space:nowrap;display:inline-block;margin-top:2px">${n}${meN?` <span style="cursor:pointer;color:var(--red);font-weight:800" title="移出 GD 人員" onclick="gdStaffOp('del','${n}')">✕</span>`:''}</span>`).join('')||'—'} ${meN?`<button class="mini" style="padding:2px 10px" onclick="gdStaffAdd()">＋ 加人</button>`:''} <span class="hint">（＝主 App 名冊的 GD 標記，兩邊同步；排班/任務/回饋的選人都用這份）</span></div>
   <div class="hint" style="margin-bottom:10px">工時＝打卡配對（只打上下班各一次時，扣掉班表的休息分鐘）；遲到寬限 5 分。加班口徑同薪資引擎：前 2 小時 ×1.34、之後 ×1.67（勞基法§24）；單日＞12h、月加班＞46h、連上 7 天會標紅（§32／§36）。試算參考用，正式發薪以人工核定為準。</div>`
  // 📅 一週班表（張良 2026-09-22：崗位×星期——每格=人名+時間）
  if (!window._shiftWk) { const t0 = new Date(todayTpe()); t0.setDate(t0.getDate() - ((t0.getDay()+6)%7)); window._shiftWk = t0.toISOString().slice(0,10) }
  const wkDays = [...Array(7)].map((_,i)=>{ const t2 = new Date(window._shiftWk); t2.setDate(t2.getDate()+i); return t2.toISOString().slice(0,10) })
  const wdN = ['一','二','三','四','五','六','日']
  const wkEnts = d.sched.filter(x=>wkDays.includes(x.date))
  const posList = [...new Set(wkEnts.map(x=>x.pos||'未分崗'))]
  h += `<div style="display:flex;gap:8px;align-items:center;margin:2px 0 6px">
    <span style="font-weight:900">一週班表</span>${meN?`<button class="mini" style="padding:3px 10px" onclick="shiftPosEdit()">⚙️ 崗位</button>`:''}
    <button class="mini" onclick="shiftWkNav(-1)">‹</button><span class="hint" style="font-weight:800">${wkDays[0].slice(5)} ~ ${wkDays[6].slice(5)}</span><button class="mini" onclick="shiftWkNav(1)">›</button>
  </div>
  <div class="scroll" style="margin-bottom:12px"><table><thead><tr><th style="text-align:left;position:sticky;left:0;background:#F1F6F9;z-index:2">崗位</th>${wkDays.map((dt,i)=>`<th style="${dt===today?'color:var(--primary)':''}">${dt.slice(5)}<br>（${wdN[i]}）</th>`).join('')}</tr></thead><tbody>`
  if (!posList.length) h += `<tr><td colspan="8" class="mut" style="text-align:center">這週還沒排班——按「＋ 排班」開始（排班時可填崗位）</td></tr>`
  posList.forEach(ps=>{
    h += `<tr><td style="text-align:left;font-weight:800;color:var(--pdark);position:sticky;left:0;background:#fff;z-index:1">${ps}</td>` + wkDays.map(dt=>{
      const es = wkEnts.filter(x=>(x.pos||'未分崗')===ps && x.date===dt)
      if (!es.length) return `<td class="mut">—</td>`
      return `<td style="${dt===today?'background:#E5F3FA;':''}text-align:left;white-space:nowrap">${es.map(e=>`<div style="font-size:13px"><b>${e.name}</b> <span class="hint">${e.start}-${e.end}</span>${meN?` <span style="cursor:pointer" onclick="shiftForm('${e.id}')">✏️</span>`:''}</div>`).join('')}</td>`
    }).join('') + `</tr>`
  })
  h += `</tbody></table></div>`
  const pn = Object.keys(per).sort()
  if (pn.length){
    h += `<div class="scroll"><table><thead><tr><th style="text-align:left">夥伴</th><th>總工時</th><th>正常</th><th>加班×1.34</th><th>加班×1.67</th><th style="text-align:left">⚠️ 勞基法檢查</th></tr></thead><tbody>`
    pn.forEach(nm=>{ const p3 = per[nm]
      const flags = [...p3.flags]
      h += `<tr style="${meN===nm?'background:#E5F3FA':''}"><td style="text-align:left;font-weight:800;color:var(--ink)">${nm}</td><td class="avg">${r1(p3.h)}</td><td>${r1(p3.h-p3.ot1-p3.ot2)}</td><td>${p3.ot1?r1(p3.ot1):'—'}</td><td>${p3.ot2?r1(p3.ot2):'—'}</td><td style="text-align:left;${flags.length?'color:var(--red);font-weight:700':''}">${flags.length?flags.join('、'):'✓ 正常'}</td></tr>`
    })
    h += `</tbody></table></div>`
  } else h += `<div class="mut">這個月還沒有班表或打卡——${meN?'按右上「＋ 排班」開始':'綁定後可以排班'}；上班用最上面 ⏰ 打卡</div>`
  h += `</section><section><h2>明細</h2>`
  const byDate = {}
  rows.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r) })
  const wd = ['日','一','二','三','四','五','六']
  const dts = Object.keys(byDate).sort().reverse()
  if (!dts.length) h += `<div class="mut">沒有資料</div>`
  dts.forEach(dt=>{
    h += `<div style="font-weight:900;margin:10px 0 4px;color:var(--pdark)">${dt.slice(5)}（${wd[new Date(dt).getDay()]}）${dt===today?'・今天':''}</div>`
    byDate[dt].sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{
      const bad = r.st.some(x=>x!=='上班中')
      h += `<div style="background:#fff;border:1.5px solid ${r.over12?'var(--red)':'var(--line)'};border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <b style="min-width:56px">${r.name}</b>
        <span class="hint">班表 ${r.s?`${r.s.start}-${r.s.end}${r.s.break?`(休${r.s.break})`:''}`:'—'}</span>
        <span class="hint">打卡 ${r.firstIn||'—'}${r.lastOut?'~'+r.lastOut:(r.working?'~上班中':'')}</span>
        <span style="font-weight:800;color:${r.over12?'var(--red)':'var(--ink)'}">${r.h?r1(r.h)+'h':''}</span>
        ${r.st.map(x=>`<span style="font-size:13px;font-weight:800;color:${x==='上班中'?'var(--green)':'var(--red)'};background:${x==='上班中'?'#E8F6EE':'#FCEEEC'};border-radius:6px;padding:1px 7px">${x}</span>`).join('')}
        ${meN&&r.s?`<span style="margin-left:auto"><button class="mini" onclick="shiftForm('${r.s.id}')">✏️</button> <button class="mini" style="color:var(--red)" onclick="if(confirm('刪除 ${r.name} ${dt} 的班？'))shiftDel('${r.s.id}')">🗑</button></span>`:''}
      </div>`
    })
  })
  h += `</section>`
  app.innerHTML = h
}
function shiftForm(id){
  const d = window._shiftD, it = id ? d.sched.find(x=>x.id===id) : null
  const ov = document.createElement('div'); ov.id='shOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(16,24,43,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px'
  const ip = 'border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;font-family:inherit'
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:16px" onclick="event.stopPropagation()">
    <div style="font-weight:900;margin-bottom:10px">${it?'✏️ 編輯':'📅 新增'}排班</div>
    <div style="display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;font-size:14px">
      <span>夥伴</span><span><input id="shName" list="shNames" value="${it?it.name:''}" placeholder="名字" style="${ip};width:100%"><datalist id="shNames">${(d.names||[]).map(n=>`<option>${n}</option>`).join('')}</datalist></span>
      <span>崗位</span><span><input id="shPos" list="shPoss" value="${it?(it.pos||''):''}" placeholder="例：炸台/吧檯/外場（可空）" style="${ip};width:100%"><datalist id="shPoss">${(d.posList&&d.posList.length?d.posList:[...new Set((d.sched||[]).map(x=>x.pos).filter(Boolean))]).map(n=>`<option>${n}</option>`).join('')}</datalist></span>
      <span>日期</span><input id="shDate" type="date" value="${it?it.date:todayTpe()}" style="${ip}">
      <span>上班</span><span>${t24c('shS', it?it.start:'11:00')}</span>
      <span>下班</span><span>${t24c('shE', it?it.end:'20:00')}</span>
      <span>休息(分)</span><input id="shBreak" type="number" value="${it?(it.break||0):60}" min="0" max="240" style="${ip}">
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="mini" style="padding:9px 12px" onclick="document.getElementById('shOv').remove()">取消</button>
    <button class="mini on" style="padding:9px 18px" onclick="shiftSave('${id||''}')">儲存</button></div></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
async function shiftSave(id){
  const g2 = x => (document.getElementById(x)||{}).value||''
  const ovS = document.getElementById('shOv')
  const item = { id: id||undefined, name: g2('shName').trim(), date: g2('shDate'), start: t24read(ovS,'shS'), end: t24read(ovS,'shE'), break: +g2('shBreak')||0, pos: g2('shPos').trim() }
  if (!item.name || !item.date || !item.start || !item.end) { alert('姓名/日期/時間要填齊'); return }
  const r = await fetch('/api/mail-sync?shiftset=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ op:'save', item, token: TK() }) })
  const d = await r.json().catch(()=>null)
  const o = document.getElementById('shOv'); if (o) o.remove()
  if (d && d.ok) shiftLoad(); else alert((d&&d.error)||'儲存失敗')
}
async function shiftDel(id){
  const r = await fetch('/api/mail-sync?shiftset=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ op:'del', id, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) shiftLoad(); else alert((d&&d.error)||'失敗')
}
// ── 品項明細 v2（張良 2026-09-22：①全部/各分類/依品類分組切換 ②30日均/vs近60/累計點欄頭排序（分組模式=組內排）
//    ③累積金額取消→售價（手填牌價優先、無則30日金額÷份數湊5倍數）④%佔比獨立欄放30日均左邊 ⑤🙈隱藏管理＝App 同一份 pm_pos_hidden 全裝置同步）──
let itmView = 'group', itmSort = { c:'avg30', d:-1 }, itmMng = false
function itmSetView(v){ itmView = v; itemsRender() }
function itmSetSort(c){ itmSort = (itmSort.c===c) ? { c, d:-itmSort.d } : { c, d:-1 }; itemsRender() }
function itmMngTog(){ itmMng = !itmMng; itemsRender() }
async function posHide(kEnc, hide){
  if (!TK()) { alert('要先綁定才能改隱藏：跟 DD 說「綁定GD」'); return }
  const r = await fetch('/api/mail-sync?poshide=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ store: (window._bd||{}).store, key: decodeURIComponent(kEnc), hide, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) load(curStore, true); else alert((d&&d.error)||'失敗')
}
function itemsRender(){
  const d = window._bd, el = document.getElementById('itemsec')
  if (!d || !el || !d.cats) return
  const dts = d.dates.map(s=>s.slice(5))
  const growCell = gr => gr==null?'<span class="mut">—</span>':gr==='新'?'<span class="up">新</span>':`<span class="${gr>=0?'up':'dn'}">${gr>=0?'+':''}${gr}%</span>`
  const qCells = q => [...q].reverse().map(v=>'<td>'+(v||0)+'</td>').join('')
  d.cats.forEach(c=>c.items.forEach(o=>{ o.cat = c.name }))
  const sv = o => itmSort.c==='grow' ? (o.grow==='新'?9e9:(o.grow==null||typeof o.grow!=='number'?-9e9:o.grow)) : (o[itmSort.c]!=null?o[itmSort.c]:-9e9)
  const srt = list => [...list].sort((a,b)=>(sv(a)-sv(b))*itmSort.d)
  const catNames = d.cats.map(c=>c.name)
  const totalAmt = d.cats.reduce((t2,c)=>t2+(c.amt30||0),0)
  const hid = d.hidden || []
  const chip = (lb,v) => `<button class="mini${itmView===v?' on':''}" style="padding:5px 12px" onclick="itmSetView('${v}')">${lb}</button>`
  // 依品類分組／全部＝相連切換膠囊（張良 2026-09-22 指定「兩個匡一起做切換的感覺」）
  const seg = (lb,v) => `<button style="border:none;padding:6px 14px;font-size:14px;font-weight:800;cursor:pointer;${itmView===v?'background:var(--primary);color:#fff':'background:#fff;color:var(--primary)'}" onclick="itmSetView('${v}')">${lb}</button>`
  let s = `<section><h2>品項明細 <span class="hint">30日均＝近30天每營業日平均份數；名字旁 $＝售價（老闆手填優先）；%＝30天金額佔比；點欄頭排序</span></h2>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center">
    <span style="display:inline-flex;border:1.5px solid var(--primary);border-radius:9px;overflow:hidden">${seg('依品類分組','group')}${seg('全部','all')}</span>${catNames.map(cn=>chip(cn,cn)).join('')}
    <button class="mini${itmMng?' on':''}" style="padding:5px 12px;margin-left:auto" onclick="itmMngTog()">🙈 隱藏管理${hid.length?`（${hid.length}）`:''}</button>
  </div>`
  const arrow = c => itmSort.c===c ? (itmSort.d===-1?' ▼':' ▲') : ''
  const flat = itmView !== 'group'
  const th3 = `<th style="cursor:pointer;white-space:nowrap" onclick="itmSetSort('avg30')">30日均${arrow('avg30')}</th><th style="cursor:pointer;white-space:nowrap" onclick="itmSetSort('grow')">vs近60${arrow('grow')}</th><th style="cursor:pointer;white-space:nowrap" onclick="itmSetSort('cum30')">30天累計${arrow('cum30')}</th>`
  const nCols = 2 + (flat?1:0) + 3 + dts.length // 品項+(品類)+%+三欄+日
  s += `<div class="scroll" style="max-height:70vh;overflow-y:auto"><table><thead><tr><th style="position:sticky;left:0;background:#F1F6F9;z-index:2;text-align:left">品項</th>${flat?'<th>品類</th>':''}<th>%</th>${th3}${dts.map(t2=>'<th>'+t2+'</th>').reverse().join('')}</tr></thead><tbody>`
  const nameCell = (o,bg) => `<td class="iname" style="position:sticky;left:0;background:${bg};z-index:1${o.hid?';opacity:.5':''}" title="${o.n}">${o.n}${o.price?` <span style="font-size:11.5px;color:var(--muted);font-weight:600">$${o.price}</span>`:''}${itmMng?` <button class="mini" style="padding:1px 7px" onclick="posHide('${encodeURIComponent(o.k)}',${o.hid?0:1})">${o.hid?'恢復':'隱藏'}</button>`:''}</td>`
  const itemRow = o => `<tr style="${o.hid?'opacity:.6':''}">${nameCell(o,o.hid?'#F5F5F5':'#fff')}${flat?`<td><span style="font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;white-space:nowrap">${o.cat||''}</span></td>`:''}<td class="mut">${o.pct!=null?o.pct+'%':'—'}</td><td class="avg">${o.avg30!=null?o.avg30:'—'}</td><td>${growCell(o.grow)}</td><td>${o.cum30!=null?o.cum30:'—'}</td>${o.q?qCells(o.q):`<td colspan="${dts.length}"></td>`}</tr>`
  const hidRow = o => itemRow({ ...o, hid:1, pct:null, avg30:null, grow:null, q:null })
  if (!flat) {
    d.cats.forEach(c=>{
      const a = c.agg || {}
      const cPct = totalAmt && c.amt30!=null ? Math.round(c.amt30/totalAmt*1000)/10 : null
      s += `<tr class="catband"><td style="position:sticky;left:0;background:var(--psoft);z-index:1">${c.name}${c.amt30?` <span style="font-weight:700;font-size:13px">${fmt(c.amt30)}</span>`:''}</td><td style="font-weight:800">${cPct!=null?cPct+'%':''}</td><td style="font-weight:900">${a.avg30!=null?a.avg30:''}</td><td>${a.grow!=null?growCell(a.grow):''}</td><td style="font-weight:900">${a.cum30!=null?a.cum30:''}</td>${a.q?qCells(a.q):`<td colspan="${dts.length}"></td>`}</tr>`
      ;(c.subs||[]).forEach(sb=>{
        s += `<tr class="subrow"><td style="position:sticky;left:0;background:#FBF6EA;z-index:1;font-weight:700;color:#8a5a2e;white-space:pre">${sb.n}</td><td></td><td style="font-weight:800;color:#8a5a2e">${sb.avg30!=null?sb.avg30:'—'}</td><td>${growCell(sb.grow)}</td><td style="font-weight:800;color:#8a5a2e">${sb.cum30}</td>${qCells(sb.q)}</tr>`
      })

    srt(rows).forEach(o=>{ s += itemRow(o) })

  }

  el.innerHTML = s
}

    ${NOTIFY_DEF.map(([k,lb])=>`<label style="display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600"><input type="checkbox" data-nk="${k}" ${d.cfg[k]===1?'checked':''} ${d.canEdit?'':'disabled'} style="width:18px;height:18px"> ${lb}</label>`).join('')}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="mini" style="padding:9px 12px" onclick="document.getElementById('ntOv').remove()">關閉</button>
    ${d.canEdit?`<button class="mini on" style="padding:9px 18px" onclick="notifySave()">儲存</button>`:''}</div></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
async function notifySave(){
  const cfg = {}
  document.querySelectorAll('#ntOv input[data-nk]').forEach(i2=>{ cfg[i2.dataset.nk] = i2.checked ? 1 : 0 })
  const o = document.getElementById('ntOv'); if (o) o.remove()
  const r = await fetch('/api/mail-sync?notifyset=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ cfg, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) alert('✅ 通知開關已更新'); else alert((d&&d.error)||'儲存失敗')
}
// 24小時制時間選擇（張良 2026-09-21：原生 time 輸入會跟著系統顯示上午/下午——改成 00~23 時＋分兩個下拉）
function t24c(cls, v){
  const [h,m] = String(v||'11:00').split(':')
  const H = [...Array(24)].map((_,i)=>String(i).padStart(2,'0'))
  let M = ['00','05','10','15','20','25','30','35','40','45','50','55']
  if (m && !M.includes(m)) M = [...M, m].sort()
  const sS = 'border:1px solid var(--line);border-radius:6px;padding:4px 3px;font-size:14px;background:#fff'
  return `<span style="display:inline-flex;gap:2px;align-items:center;white-space:nowrap"><select class="${cls}h" style="${sS}">${H.map(x=>`<option${x===h?' selected':''}>${x}</option>`).join('')}</select>:<select class="${cls}m" style="${sS}">${M.map(x=>`<option${x===m?' selected':''}>${x}</option>`).join('')}</select></span>`
}
const t24read = (root, cls) => `${root.querySelector('.'+cls+'h').value}:${root.querySelector('.'+cls+'m').value}`
// ── 🖼 SOP 標準照（張良 2026-09-22：列表點條目→看標準照＋直接上傳/更換，不用進總編輯）──
function sopRefOpen(itemId){
  const it = ((sopData && sopData.def.items)||[]).find(x=>x.id===itemId)
  if (!it) return
  const canUp = !!(sopData && sopData.me)
  const ov = document.createElement('div'); ov.id='srOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,16,30,.82);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px'
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:480px;width:100%;padding:14px;text-align:center" onclick="event.stopPropagation()">
    <div style="font-weight:900;margin-bottom:8px">🖼 ${it.title}</div>
    ${it.ref?`<img src="${it.ref}" style="max-width:100%;max-height:60vh;border-radius:10px;border:1px solid var(--line)">`:`<div class="mut" style="padding:24px 0">還沒有標準照——${canUp?'按下面上傳，或直接 Cmd/Ctrl+V 貼截圖':'綁定後可以上傳'}</div>`}
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap">
      ${canUp?`<button class="mini on" style="padding:9px 16px" onclick="sopRefUp('${it.id}')">📷 ${it.ref?'更換':'上傳'}標準照</button><button class="mini" style="padding:9px 14px" onclick="sopRefPaste('${it.id}')">📋 貼截圖</button>`:''}
      ${canUp&&it.ref?`<button class="mini" style="color:var(--red);padding:9px 12px" onclick="if(confirm('移除標準照？'))sopRefSave('${it.id}','')">移除</button>`:''}
      <button class="mini" style="padding:9px 12px" onclick="document.getElementById('srOv').remove()">關閉</button>
    </div></div>`
  window._srItem = itemId
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
async function sopRefBlob(itemId, blob, mime){ // 共用上傳（選檔/貼截圖都走這）
  try {
    const ext = (mime||blob.type||'image/png').split('/')[1].replace('jpeg','jpg') || 'png'
    const sr = await fetch('/api/mail-sync?sopsign=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ext }) })
    const sd = await sr.json()
    if (sd && sd.ok) { const ur = await fetch(sd.uploadUrl, { method:'PUT', headers:{'content-type': blob.type||'image/png'}, body: blob }); if (ur.ok) { sopRefSave(itemId, sd.publicUrl); return } }
    alert('上傳失敗，再試一次')
  } catch(e){ alert('上傳失敗') }
}
function sopRefUp(itemId){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'
  inp.onchange = () => { const f = inp.files[0]; if (f) sopRefBlob(itemId, f, f.type) }
  inp.click()
}
// 📋 截圖直接貼（張良 2026-09-22）：按鈕讀剪貼簿；視窗開著時 Cmd/Ctrl+V 也直接貼
async function sopRefPaste(itemId){
  try {
    const cs = await navigator.clipboard.read()
    for (const ci of cs) { const ty = ci.types.find(x=>x.startsWith('image/')); if (ty) { const b = await ci.getType(ty); sopRefBlob(itemId, b, ty); return } }
    alert('剪貼簿裡沒有圖片——先截圖再按這顆')
  } catch(e){ alert('瀏覽器不給讀剪貼簿——直接按 Cmd/Ctrl+V 貼，或用「上傳」選檔') }
}
document.addEventListener('paste', (e) => {
  if (!document.getElementById('srOv') || !window._srItem) return
  const it = [...((e.clipboardData||{}).items||[])].find(x=>x.type&&x.type.startsWith('image/'))
  if (it) { e.preventDefault(); sopRefBlob(window._srItem, it.getAsFile(), it.type) }
})
async function sopRefSave(itemId, ref){
  const r = await fetch('/api/mail-sync?sopref=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ itemId, ref, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (!d || !d.ok) { alert((d&&d.error)||'儲存失敗'); return }
  const o = document.getElementById('srOv'); if (o) o.remove()
  sopLoad()
}
// ── 📝 每日回饋紀錄（張良 2026-09-22）：站別＋文字＋照片/影片（sopsign 直傳）──
let fbjFiles = []
function fbjNew(){
  fbjFiles = []
  const d = window._fbD
  const ov = document.createElement('div'); ov.id='fbjOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(16,24,43,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px'
  const ip = 'width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;font-family:inherit;margin-bottom:6px'
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:440px;width:100%;padding:16px" onclick="event.stopPropagation()">
    <div style="font-weight:900;margin-bottom:8px">📝 每日回饋（${d.date.slice(5)}）</div>
    <select id="fbjSt" style="${ip}"><option value="">— 選站別（可空）—</option>${(d.stations||[]).map(s2=>`<option>${s2}</option>`).join('')}<option>其他</option></select>
    <textarea id="fbjTxt" rows="4" placeholder="今天發現什麼問題／可以更好的地方？" style="${ip}"></textarea>
    <div id="fbjList" class="hint" style="margin:4px 0"></div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:6px">
      <button class="mini" style="padding:9px 12px" onclick="fbjPick()">📷 照片/影片</button>
      <span><button class="mini" style="padding:9px 12px" onclick="document.getElementById('fbjOv').remove()">取消</button>
      <button class="mini on" style="padding:9px 18px" onclick="fbjSend()">送出</button></span>
    </div></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
function fbjPick(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*,video/*'; inp.multiple=true
  inp.onchange = () => { fbjFiles = [...fbjFiles, ...inp.files].slice(0,6); const el=document.getElementById('fbjList'); if(el) el.innerHTML = fbjFiles.map((f,i)=>`📎 ${(f.name||'檔'+(i+1)).slice(0,28)}`).join('<br>') }
  inp.click()
}
async function fbjSend(){
  const st = (document.getElementById('fbjSt')||{}).value||''
  const text = (document.getElementById('fbjTxt')||{}).value||''
  if (!text.trim() && !fbjFiles.length) { alert('寫點文字或附照片/影片'); return }
  document.querySelectorAll('#fbjOv button').forEach(b=>b.disabled=true)
  const media = []
  for (const f of fbjFiles) {
    try {
      const ext = ((f.name||'').split('.').pop()||'jpg').toLowerCase()
      const sr = await fetch('/api/mail-sync?sopsign=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ext }) })
      const sd = await sr.json()
      if (sd && sd.ok) { const ur = await fetch(sd.uploadUrl, { method:'PUT', headers:{'content-type': f.type||'application/octet-stream'}, body: f }); if (ur.ok) media.push(sd.publicUrl) }
    } catch(e){}
  }
  const r = await fetch('/api/mail-sync?fbj=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ op:'add', date: window._fbD.date, st, text, media, token: TK() }) })
  const dd = await r.json().catch(()=>null)
  const o = document.getElementById('fbjOv'); if (o) o.remove()
  if (dd && dd.ok) fbLoad(window._fbD.date); else alert((dd&&dd.error)||'送出失敗')
}
async function fbjDel(id){
  const r = await fetch('/api/mail-sync?fbj=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ op:'del', id, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) fbLoad(window._fbD.date); else alert((d&&d.error)||'失敗')
}
// ── 👥 GD 人員直編＋⚙️ 崗位清單（張良 2026-09-24：班表頁直接管理，跟主 App 名冊 GD 標記同一份）──
async function gdStaffOp(op, name){
  if (op==='del' && !confirm(`把 ${name} 移出 GD 人員？（排班/任務/回饋選單就不會出現他；名冊本體不動）`)) return
  const r = await fetch('/api/mail-sync?gdstaff=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ op, name, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) shiftLoad(); else alert((d&&d.error)||'失敗')
}
function gdStaffAdd(){
  const d = window._shiftD
  const pool = (d.namesAll||[]).filter(n=>!(d.names||[]).includes(n))
  if (!pool.length) { alert('名冊在職的人都已經在 GD 人員裡了；新人先到主 App 名冊建檔'); return }
  const ov = document.createElement('div'); ov.id='gsOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(16,24,43,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px'
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:360px;width:100%;padding:16px" onclick="event.stopPropagation()">
    <div style="font-weight:900;margin-bottom:8px">＋ 加入 GD 人員</div>
    <select id="gsSel" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;margin-bottom:10px">${pool.map(n=>`<option>${n}</option>`).join('')}</select>
    <div class="hint" style="margin-bottom:8px">名單來自主 App 名冊在職夥伴；加入後排班/任務/回饋選單都會出現。</div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="mini" style="padding:9px 12px" onclick="document.getElementById('gsOv').remove()">取消</button>
    <button class="mini on" style="padding:9px 18px" onclick="gdStaffGo()">加入</button></div></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
function gdStaffGo(){
  const v = (document.getElementById('gsSel')||{}).value||''
  const o = document.getElementById('gsOv'); if (o) o.remove()
  if (v) gdStaffOp('add', v)
}
function shiftPosEdit(){
  const d = window._shiftD
  const cur = (d.posList||[]).join('、')
  const v = prompt('崗位清單（用「、」分隔，可增刪改名；排班時的崗位選單用這份）', cur || '炸台、吧檯、外場、廚房')
  if (v == null) return
  const list = v.split(/[、,，]/).map(s2=>s2.trim()).filter(Boolean)
  fetch('/api/mail-sync?shiftset=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ op:'pos', list, token: TK() }) })
    .then(r=>r.json()).then(d2=>{ if(d2&&d2.ok) shiftLoad(); else alert((d2&&d2.error)||'失敗') })
}
load('ground')
</script>
