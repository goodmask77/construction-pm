<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GROUN:D</title>
<meta name="robots" content="noindex" />
<!-- PWA（張良 2026-09-21 幹成App）：手機瀏覽器「加入主畫面」→ 全螢幕獨立視窗＋icon；icon=D: 紅標（v4.55.1 換成盒子品牌標誌）、名稱=GROUN:D -->
<link rel="manifest" href="/ops/manifest.json" />
<link rel="icon" type="image/png" href="/ops/icon-192-r2.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="GROUN:D" />
<meta name="theme-color" content="#0E1217" />
<link rel="apple-touch-icon" href="/ops/icon-180-r2.png" />
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><!-- 🎟 兌換券 QR 產生（券包出示用） -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><!-- 🎟 現場掃碼核銷 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- 菜單海報匯出用字型（張良 2026-10-07 v4.58.4 仿 Canva 風格）：Alfa Slab One 英文大標／Poppins 英文副標／Space Mono 標語 -->
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 菜單橫式電視圖用官方 Ultra 粗標題字（張良 2026-10-08 動態四螢幕） */
  @font-face{ font-family:'Ultra'; src:url('/ops/fonts/Ultra.ttf') format('truetype'); font-display:swap }
  /* Beach Ops 同款視覺（張良 2026-09-24：顏色/字型/間距/排版對齊 beachops）——類名不動只換皮 */
  :root{ /* v4.8.0 黑灰質感主題（張良 2026-10-02「整個app改黑灰底 有質感帥的」） */
    --bg:#0E1217; --card:#161B22; --soft:#1C222B; --ink:#F2F5F9; --text:#C7D0DB; --muted:#8C98A8;
    --primary:#4DA3FF; --pdark:#9CC7F5; --psoft:#1A2940; --line:#2A3240; --green:#3DBE6C; --red:#F07373;
    --grad:linear-gradient(135deg,#2493EF,#1266C8);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); }
  *{box-sizing:border-box;margin:0;padding:0}
  :root{color-scheme:dark}
  input,select,textarea{background:var(--soft);color:var(--ink)}
  html,body{overscroll-behavior-x:none} /* 擋瀏覽器橫滑返回上一頁（張良 2026-10-02） */
  body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.7}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
  /* v4.65.0 V3 SOP 桌面兩欄：左主流程、右收班彙整+交接；<1200 單欄（手機/平板） */
  .sopCols{display:flex;gap:16px;align-items:flex-start}
  .sopMain{flex:1;min-width:0}
  .sopSide{flex:0 0 300px;min-width:0}
  @media(max-width:1199px){.sopCols{flex-direction:column}.sopSide{flex:1 1 auto;width:100%}}
  .brand{font-weight:900;font-size:24px;letter-spacing:.04em;color:#fff} /* v4.52 張良「GROUND白色底線拿掉、字體變大」：15→24px */
  .brand b{color:#F92A1B} /* :D=品牌紅 */
  .bseg{cursor:pointer;opacity:.35} /* v4.52 底線移除（原 padding-bottom 2px 一併拿掉） */
  .bseg.on{opacity:1} /* v4.52 白色底線拿掉（原 border-bottom:2.5px solid #fff） */
  h1{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:6px}
  .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:15px;font-weight:700;color:#C3CEDC;cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:background .15s;display:inline-flex;gap:7px;align-items:center}
  .tabs button:hover{background:#232B36}
  .tabs button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(18,102,200,.30)}
  /* ⭐ 個人常用捷徑列（v4.39.1 張良「手機版固定一行、每個人可編輯自己的常用清單」）：手機限定固定螢幕最底；桌機有側欄不顯示 */
  #favbar{display:none}
  @media(max-width:919px){
    body{padding-bottom:78px} /* 內容不被捷徑列蓋住 */
    .tabs{display:none} /* v4.40.3 張良拍板：手機版整排功能鈕收掉——入口=底部☰(全部功能)+常用格；通知/編輯常用都在☰彈層（h1 已於 v4.41.3 整個移除） */
    #favbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:stretch;gap:2px;background:rgba(17,21,27,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
    #favbar button{flex:1 1 0;min-width:0;border:none;background:transparent;color:#C3CEDC;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
    #favbar button svg{width:21px;height:21px;flex:0 0 auto}
    #favbar button.on{color:#fff;background:var(--grad)}
  }
  .favchip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 8px;font-size:13px;font-weight:700;color:#C3CEDC;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  .favchip.on{border-color:transparent;background:var(--grad);color:#fff}
  .favchip .fno{position:absolute;top:-7px;right:-7px;background:#fff;color:#0D63C9;border-radius:999px;min-width:19px;height:19px;line-height:19px;font-size:12px;font-weight:900;text-align:center}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;min-width:0} /* v4.41.1 min-width:0=長數字不把三卡撐出螢幕 */
  .kpi{text-align:center} /* v4.41.2 張良「置中」 */
  .kpi .l{font-size:15.5px;font-weight:700;color:var(--text)}
  .kpi .v{font-size:31px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums} /* v4.41.2 字體數字放大 */
  .kpi .sub2{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums} /* v4.52 今年小字 */
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 16px;margin-top:16px;overflow:hidden}
  .mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;color:#A9C3E2;cursor:pointer;margin-left:4px;transition:background .15s}
  .mini:hover{background:#232B36}
  .mini{white-space:nowrap}
  .wopt{display:inline} @media(max-width:760px){.wopt{display:none}}
  .mini.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 9px rgba(18,102,200,.28)}
  h2{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
  .hint{font-size:13px;color:var(--muted);font-weight:500}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  th{background:var(--soft);color:var(--muted);font-size:12.5px;font-weight:700;text-align:right;padding:9px 8px;white-space:nowrap;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 8px;border-top:1px solid #222A35;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even) td{background:#191F28}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
  #lbTbl,#lbTbl th,#lbTbl td,#lbTbl div,#lbMn,#lbMn *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} /* v4.29.6 手機點格不再跳iOS選字浮條 */
  table.tight th{padding:5px 6px}
  table.tight td{padding:3px 6px;font-size:13px} /* v4.28.2 張良「縮小版面」：備料表緊湊版 */
  .catband td{background:var(--psoft)!important;color:var(--pdark);font-weight:800;font-size:14px}
  .subrow td{background:#2A2415!important}
  .todaycol{background:var(--psoft)!important;color:var(--pdark)!important;animation:glowp 2s ease-in-out infinite;position:relative}
  @keyframes glowp{0%,100%{box-shadow:inset 0 0 0 1.5px #2493EF,0 0 5px rgba(36,147,239,.3)}50%{box-shadow:inset 0 0 0 1.5px #2493EF,0 0 13px rgba(36,147,239,.7)}}
  @media (prefers-reduced-motion:reduce){.todaycol{animation:none;box-shadow:inset 0 0 0 1.5px #2493EF}}
  .iname{max-width:40vw;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--ink)}
  .avg{font-weight:800;color:var(--pdark);font-size:15px}
  .up{color:var(--green);font-weight:800} .dn{color:var(--red);font-weight:800} .mut{color:var(--muted)}
  .bar{display:inline-block;background:var(--primary);border-radius:2px 2px 0 0;width:14px;vertical-align:bottom}
  .slotrow{display:flex;align-items:flex-end;gap:6px;padding:6px 2px 0}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
  .foot{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}
  .err{background:#3A2023;color:#F07373;border-radius:12px;padding:14px;font-weight:700;margin-top:20px}
  @media(max-width:480px){ .kpis{gap:8px} .kpi{padding:12px 8px} .kpi .l{font-size:13.5px} .kpi .v{font-size:21px} h1{font-size:22px} .tabs button{padding:7px 13px;font-size:14px} } /* v4.41.2 三卡同排置中、字再放大一階 */
  #meTop{display:none}
  @media(max-width:920px){#meTop{display:inline-flex!important}.mbHide{display:none!important}}
  .brand>span:first-child{display:none} /* v4.48.2 電腦版頂列品牌隱藏(側欄已有)；手機顯示 */
  @media(max-width:920px){.brand>span:first-child{display:inline!important}}
  .tbrand{display:none} /* 側欄品牌字標＝桌機才顯示（v4.38.2 張良「GROUN:D就好、GROUN白:D紅、前面符號取消」） */
  /* 桌機＝Beach Ops 左側欄版型（≥920px；分頁選單變側欄、內容右移） */
  @media(min-width:920px){
    body{padding-left:216px}
    .wrap{max-width:1200px}
    .tabs{position:fixed;left:0;top:0;bottom:0;width:248px;margin:0;padding:13px 12px 10px;background:#11151B;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;gap:1px;overflow-y:auto;z-index:20;flex-wrap:nowrap} /* v4.41.5 張良「不要卷軸、最下面名字要看得到」：間距全面縮 */
    .tbrand{display:block;font-weight:900;font-size:22px;color:#fff;padding:2px 10px 10px;letter-spacing:.04em} .tbrand b{color:#F92A1B;font-weight:900} /* v4.38.2 GROUN 白、:D 品牌紅、≋ 取消（偽元素改真元素才能雙色） */
    .tabs button{text-align:left;border:none;background:transparent;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
    .tabs button:hover{background:#232B36}
    .tabs button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(18,102,200,.32)}
  }
@keyframes trGlow{0%,100%{box-shadow:0 0 2px 0 var(--gc)}50%{box-shadow:0 0 10px 2.5px var(--gc)}} /* 🎓帶訓卡發光（張良 2026-10-02） */
@keyframes goldGlow{0%,100%{box-shadow:0 0 0 2px #D4A72C,0 0 6px 2px rgba(212,167,44,.35)}50%{box-shadow:0 0 0 3px #F2CE60,0 0 22px 7px rgba(242,206,96,.75)}} /* 🔗deep link 跳轉定位閃光（v4.16.0） */
.vioGlow{animation:vioRed 1.6s ease-in-out infinite;border-radius:6px} /* 🔴 班表違規格紅光（v4.33.3 張良） */
.vioPendGlow{animation:vioPend 2.2s ease-in-out infinite;border-radius:6px} /* 🕐 已處理待審核=橘光（v4.38.0） */
@keyframes vioPend{0%,100%{box-shadow:inset 0 0 0 1.5px #E8A657,inset 0 0 5px 1px rgba(232,166,87,.25)}50%{box-shadow:inset 0 0 0 2px #F2C14E,inset 0 0 12px 3px rgba(232,166,87,.5)}}
tr.bdayGlow td{animation:bdayBg 1.9s ease-in-out infinite;border-top:1.5px solid #FF8FC5;border-bottom:1.5px solid #FF8FC5} /* 🎂 壽星整列生日光（v4.34.3 張良「生日氛圍可愛的顏色發光閃動」） */
tr.bdayGlow td:first-child{border-left:1.5px solid #FF8FC5;border-radius:8px 0 0 8px}
tr.bdayGlow td:last-child{border-right:1.5px solid #FF8FC5;border-radius:0 8px 8px 0}
@keyframes bdayBg{0%,100%{background:rgba(255,143,197,.07)}50%{background:rgba(255,143,197,.22)}}
td.hrmStick{position:sticky;left:0;background:var(--card);z-index:1} /* 夥伴名冊姓名凍結（v4.34.4 張良「凍結在姓名 滑到右邊才知道是誰」） */
th.hrmStick{position:sticky;left:0;background:var(--soft);z-index:2}
tr.bdayGlow td.hrmStick{animation:bdayBgSolid 1.9s ease-in-out infinite} /* 凍結格要實色不然後面字透出來 */
@keyframes bdayBgSolid{0%,100%{background:#281B27}50%{background:#3A2336}}
tr.rowAB td{background:rgba(59,130,246,.09)} /* A Beach 藍調底、GROUN:D 紅調底 好辨識（v4.35.0 張良「GD AB的人呈現不同底色」） */
tr.rowGD td{background:rgba(249,42,27,.08)}
tr.rowAB td.hrmStick{background:#19222F} /* 凍結姓名格要實色 */
tr.rowGD td.hrmStick{background:#2A1C1D}
@keyframes vioRed{0%,100%{box-shadow:inset 0 0 0 1.5px #F07373,inset 0 0 6px 1px rgba(240,115,115,.3)}50%{box-shadow:inset 0 0 0 2.5px #FF8B8B,inset 0 0 14px 3px rgba(240,115,115,.55)}} /* v4.36.0 改inset=不會被隔壁格切到 */
@keyframes shSlideL{from{transform:translateX(44px);opacity:.35}to{transform:none;opacity:1}} /* 週表左右滑動（張良 2026-10-02） */
@keyframes shSlideR{from{transform:translateX(-44px);opacity:.35}to{transform:none;opacity:1}}
.glowgold{animation:goldGlow 1s ease-in-out 4;border-radius:8px}
.lnkbtn{opacity:.35;cursor:pointer;font-size:12px} .lnkbtn:hover{opacity:1}
.plk{opacity:.42!important;cursor:not-allowed!important;filter:saturate(.4)}
</style>
</head>
<body>
<div class="wrap">
  <!-- 品牌字標＝切店（張良 2026-09-21）；右上=⏰打卡＋🔄更新App（張良 2026-09-22：🔄不是只抓數據，是整個App重開、連新功能一起拿最新版） -->
  <div class="brand" style="display:flex;align-items:center;gap:10px">
    <span><span id="bs-ground" class="bseg on" onclick="load('ground')">GROUN<b>:D</b></span><span id="bs-abeach" style="display:none" onclick="load('abeach')"></span></span>
    <span style="display:flex;gap:6px"><button id="bindBtn" class="mini" style="display:none;font-size:14px;padding:5px 12px;font-weight:700" onclick="bindPrompt()" title="私訊 DD「登入碼」拿 4 位數填入">登入</button><button class="mini" style="font-size:14px;padding:5px 12px;font-weight:700;display:inline-flex;gap:5px;align-items:center" onclick="punchNow()" title="上下班打卡"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>打卡</button><button class="mini mbHide" style="padding:5px 10px;display:inline-flex;align-items:center" onclick="mobilePreview()" title="手機版畫面預覽">📱</button><button class="mini" style="padding:5px 10px;display:inline-flex;align-items:center" onclick="hardRefresh()" title="更新App到最新版（清快取拿最新）"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v4h-4"/></svg></button></span>
    <span id="meTop" onclick="hrmHint()" style="display:none;align-items:center;gap:6px;margin-left:auto;cursor:default"></span>
  </div>
  <!-- v4.41.3 張良「營運看板四個字電腦版也拿掉」：h1 整個退役（手機版 v4.40.3 先藏、這次連桌機一起） -->
  <div class="sub" id="upd">載入中…</div>
  <div class="tabs">
    <div class="tbrand">GROUN<b>:D</b></div>
    <button id="tab-home" onclick="load(lastStore)" title="回營運看板" style="padding:7px 13px;font-size:16px">🏠</button>
    <button id="tab-prep" onclick="prepPage()">📊 銷售數據</button> <!-- v4.42.1 銷售數據分頁（備料量+節奏表+品項明細） -->
    <button id="tab-sop" onclick="sopPage()">✅ SOP</button>
    <button id="tab-task" onclick="taskEmbed()">🛠 任務</button> <!-- 2026-10-02 整併：改掛主App任務中心（同團隊空間雙向同步） -->
    <button id="tab-lb" onclick="loadLB()">🏆 排行榜</button>
    <button id="tab-food" onclick="invLoad('food')">🥩 盤點</button>
    <button id="tab-pack" onclick="invLoad('pack')">📦 包材</button>
    <button id="tab-buy" onclick="buyLoad()">🛒 採購</button>
    <button id="tab-matlib" onclick="matlibLoad()" title="A Beach 叫貨物料：分廠商/分類/搜尋/進價波動分析">🧾 物料庫</button>
    <button id="tab-meet" onclick="meetLoad()">📋 會議</button>
    <button id="tab-shift" onclick="window._shScrollTo='today';shiftLoad()">📅 班表</button>
    <button id="tab-inc" onclick="incLoad()" title="AB=阿桑系統自動同步；GD ERP 之後接入">⚠️ 異常通知</button>
    <button id="tab-fb" onclick="fbLoad()">💬 回饋</button>
    <button id="tab-menu" onclick="menuLoad()">🍔 菜單</button>
    <button id="tab-social" onclick="socialLoad()" title="FB/IG 貼文內容與成效">📣 行銷大師</button>
    <button id="tab-cust" onclick="custLoad()" title="inline 顧客資料庫＋營運洞察">👥 inline</button>
    <button id="tab-lib" onclick="libLoad()" title="文件庫（雲端硬碟：資料夾/上傳/權限）">📁 文件庫</button>
    <button id="tab-hrm" onclick="hrmLoad()" title="夥伴名冊（主管限定）">🪪 夥伴名冊</button>
    <button id="tab-onb" onclick="onbPage()" title="入職流程（新人填基本資料/繳交表）">入職</button>
    <button id="tab-gear" onclick="settingsLoad()" title="設定">⚙️ 設定</button>
    <button id="tab-errs" onclick="errsView()" title="問題回報・功能許願">🐞 問題回報</button>
    <div id="meChip" style="margin-top:auto;border-top:1px solid var(--line);padding:9px 6px 0;display:flex;gap:10px;align-items:center"></div> <!-- v4.41.5 側欄壓扁 -->
  </div>
  <div id="app"></div>
  <div id="taskWrap" style="display:none"></div> <!-- v4.33.7 任務iframe常駐（張良：點任務頁會閃跳）＝只載一次，切換用顯示/隱藏 -->
