<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GD</title>
<meta name="robots" content="noindex" />
<!-- PWA（張良 2026-09-21 幹成App）：手機瀏覽器「加入主畫面」→ 全螢幕獨立視窗＋icon；icon=:D 紅標、名稱=GD -->
<link rel="manifest" href="/ops/manifest.json" />
<link rel="icon" type="image/png" href="/ops/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GD" />
<meta name="theme-color" content="#087EBA" />
<link rel="apple-touch-icon" href="/ops/icon-180.png" />
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F3F7FA; --card:#FFF; --soft:#F7FAFC; --ink:#10182B; --text:#25324A; --muted:#66758E;
    --primary:#087EBA; --pdark:#075F91; --psoft:#E5F3FA; --line:#D8E1EA; --green:#079447; --red:#C83E3E;
    --shadow:0 8px 20px rgba(28,48,70,.08),0 2px 5px rgba(28,48,70,.05); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
  .brand{font-weight:900;font-size:13px;letter-spacing:.08em;color:var(--primary)}
  .bseg{cursor:pointer;opacity:.35;padding-bottom:2px}
  .bseg.on{opacity:1;border-bottom:2.5px solid var(--primary)}
  h1{font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-top:4px}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .tabs{display:flex;gap:8px;margin:14px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .kpi .l{font-size:11.5px;font-weight:700;color:var(--muted)}
  .kpi .v{font-size:22px;font-weight:900;color:var(--pdark);letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 14px;margin-top:14px;overflow:hidden}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;margin-left:4px}
  .mini.on{background:var(--pdark);color:#fff;border-color:var(--pdark)}
  h2{font-size:16px;font-weight:900;color:var(--ink);margin-bottom:8px}
  .hint{font-size:11.5px;color:var(--muted);font-weight:500}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  th{background:#F1F6F9;color:var(--muted);font-size:11.5px;font-weight:700;text-align:right;padding:8px 8px;white-space:nowrap;position:sticky;top:0}
  th:first-child,td:first-child{text-align:left}
  td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even) td{background:#FAFCFD}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
  .catband td{background:var(--psoft)!important;color:var(--pdark);font-weight:900;font-size:12.5px}
  .subrow td{background:#FBF6EA!important} /* 小計列琥珀底——用 !important 蓋過斑馬紋，不然偶數列會被蓋掉 */
  /* 今天星期幾的欄位發光（張良 2026-09-20）：亮藍內框＋呼吸光暈 */
  .todaycol{background:#E5F3FA!important;color:var(--pdark)!important;animation:glowp 2s ease-in-out infinite;position:relative}
  @keyframes glowp{0%,100%{box-shadow:inset 0 0 0 1.5px #24AFE1,0 0 5px rgba(36,175,225,.35)}50%{box-shadow:inset 0 0 0 1.5px #24AFE1,0 0 13px rgba(36,175,225,.8)}}
  @media (prefers-reduced-motion:reduce){.todaycol{animation:none;box-shadow:inset 0 0 0 1.5px #24AFE1}}
  .iname{max-width:40vw;overflow:hidden;text-overflow:ellipsis;font-weight:700;color:var(--ink)}
  .avg{font-weight:900;color:var(--pdark);font-size:14px}
  .up{color:var(--green);font-weight:800} .dn{color:var(--red);font-weight:800} .mut{color:var(--muted)}
  .bar{display:inline-block;background:var(--primary);border-radius:2px 2px 0 0;width:14px;vertical-align:bottom}
  .slotrow{display:flex;align-items:flex-end;gap:6px;padding:6px 2px 0}
  .slot{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted)}
  .foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:22px}
  .err{background:#FCEAEA;color:#C83E3E;border-radius:10px;padding:14px;font-weight:700;margin-top:20px}
  @media(max-width:480px){ .kpi .v{font-size:18px} h1{font-size:21px} }
</style>
</head>
<body>
<div class="wrap">
  <!-- 品牌字標＝切店（張良 2026-09-21）；右上=⏰打卡＋🔄更新App（張良 2026-09-22：🔄不是只抓數據，是整個App重開、連新功能一起拿最新版） -->
  <div class="brand" style="display:flex;align-items:center;justify-content:space-between">
    <span><span id="bs-ground" class="bseg on" onclick="load('ground')">GROUN:D</span> × <span id="bs-abeach" class="bseg" onclick="load('abeach')">A BEACH</span></span>
    <span style="display:flex;gap:6px"><button class="mini" style="font-size:13px;padding:5px 11px;font-weight:800" onclick="punchNow()" title="上下班打卡">⏰ 打卡</button><button class="mini" style="font-size:14px;padding:5px 12px" onclick="hardRefresh()" title="更新App到最新版">🔄</button></span>
  </div>
  <h1>營運看板</h1>
  <div class="sub" id="upd">載入中…</div>
  <div class="tabs">
    <button id="tab-home" onclick="load(lastStore)" title="回營運看板" style="padding:7px 13px;font-size:16px">🏠</button>
    <button id="tab-task" onclick="taskLoad()">🛠 任務</button>
    <button id="tab-lb" onclick="loadLB()">🏆 排行榜</button>
    <button id="tab-food" onclick="invLoad('food')">🥩 盤點</button>
    <button id="tab-pack" onclick="invLoad('pack')">📦 包材</button>
    <button id="tab-buy" onclick="buyLoad()">🛒 採購</button>
    <button id="tab-meet" onclick="meetLoad()">📋 會議</button>
    <button id="tab-shift" onclick="shiftLoad()">📅 班表</button>
    <button id="tab-fb" onclick="fbLoad()">💬 回饋</button>
  </div>
  <div id="app"></div>
  <div class="foot">資料每天自動同步（打開即最新）・僅供內部參考與備料使用，請勿外傳連結</div>
</div>
<script>
const K = new URLSearchParams(location.search).get('k') || (location.hash || '').replace(/^#k?=?/, '') || '7ea362bae1f0274372d4ec7b27c78852' // 內建看板唯讀金鑰（短網址 /prep 用；與管理金鑰分開）
const fmt = n => 'NT$' + Math.round(n || 0).toLocaleString()
const app = document.getElementById('app')
let curStore = 'ground'
let lastStore = 'ground'
function setTabs(k){
  ['task','lb','food','pack','buy','meet','shift','fb'].forEach(t => { const b = document.getElementById('tab-' + t); if (b) b.className = (t===k) ? 'on' : '' })
  const hb = document.getElementById('tab-home'); if (hb) hb.className = (k==='ground'||k==='abeach') ? 'on' : '' // 🏠=回店面（張良 2026-09-21：怕有人不知道怎麼回去）
  if (k === 'ground' || k === 'abeach') lastStore = k
  const g = document.getElementById('bs-ground'), a = document.getElementById('bs-abeach')
  if (g) g.className = 'bseg' + (lastStore==='ground' ? ' on' : '')
  if (a) a.className = 'bseg' + (lastStore==='abeach' ? ' on' : '')
}
// 🔄 更新App（張良 2026-09-22：不是只抓數據——整個 App 重開、連新功能一起拿最新版；r=時戳穿透 CDN 快取）
function hardRefresh(){ location.replace(location.pathname + '?r=' + Date.now()) }
// 依目前分頁重畫（綁定後/操作後用）
function goView(){
  if (curStore === 'task') taskLoad()
  else if (curStore === 'lb') loadLB()
  else if (curStore === 'food' || curStore === 'pack') invLoad(curStore)
  else if (curStore === 'buy') buyLoad()
  else if (curStore === 'meet') meetLoad()
  else if (curStore === 'shift') shiftLoad()
  else if (curStore === 'fb') fbLoad()
  else load(curStore, true)
}
// 🔑 輸入綁定碼（iPhone 加入主畫面的 App 跟 Safari 儲存分開→token 帶不過去；貼一次 DD 給的連結/代碼即可）
function bindPrompt(){
  const v = prompt('貼上 DD 給你的「個人連結」或綁定碼（跟 DD 說「綁定GD」拿）')
  if (!v) return
  const m = v.match(/me=([a-z0-9]+)/i) || v.match(/(pv[a-z0-9]{8,})/i)
  if (!m) { alert('看不懂這串，請完整貼上 DD 給的連結'); return }
  localStorage.setItem('prepToken', m[1])
  alert('綁定完成 ✅')
  goView()
}
const BIND_HINT = `跟 DD 說「綁定GD」拿個人連結；已加入主畫面的 App 請按 <button class="mini" onclick="bindPrompt()">🔑 輸入綁定碼</button>`
async function load(store, fresh){
  curStore = store
  setTabs(store)
  if (!K) { app.innerHTML = '<div class="err">網址缺少金鑰，請跟店長要完整連結</div>'; return }
  // ⚡ 快取先上（打開秒出畫面）、背景抓最新無感刷新（張良 2026-09-21：讀取太慢）
  const ck = 'obc_' + store
  let hadCache = false
  try { const c = localStorage.getItem(ck); if (c) { renderBoard(JSON.parse(c), store); hadCache = true; document.getElementById('upd').textContent = '⚡ 快取畫面・背景更新最新資料中…' } } catch(e){}
  if (!hadCache) app.innerHTML = '<section>載入中…</section>'
  let d
  try { const r = await fetch('/api/mail-sync?opsboard=' + encodeURIComponent(K) + '&store=' + store + (fresh ? '&r=' + Date.now() : '')); d = await r.json() } catch(e){}
  if (!d || !d.ok) { if (!hadCache) app.innerHTML = '<div class="err">讀不到資料（金鑰錯誤或連線問題），請跟店長要新連結</div>'; return }
  try { localStorage.setItem(ck, JSON.stringify(d)) } catch(e){}
  if (curStore !== store) return // 使用者已切到別店，別把畫面蓋回來
  renderBoard(d, store)
}
function renderBoard(d, store){
  document.getElementById('upd').textContent = '最新日結：' + (d.anchor || '—') + '・資料自動同步'
  let h = ''
  // KPI
  h += `<div class="kpis">
    <div class="kpi"><div class="l">近30天營收（${d.kpi.days30} 個營業日）</div><div class="v">${fmt(d.kpi.rev30)}</div></div>
    <div class="kpi"><div class="l">日均營收</div><div class="v">${fmt(d.kpi.avgRev)}</div></div>
    <div class="kpi"><div class="l">近30天單數</div><div class="v">${(d.kpi.tx30||0).toLocaleString()}</div></div>
  </div>`
  // 備料卡（GD：炸台/沙拉/吧檯；總平均＋每週幾平均＋峰值/低值——張良 2026-09-20 取消時段拆分，一早備好）
  if (d.prep) {
    const grps = [...new Set(d.prep.map(p=>p.grp))]
    let tw = new Date().getDay() // 今天星期幾（1~5發光）
    if (tw === 0 || tw === 6) tw = 1 // 週六日（GD公休）打開＝在準備週一的量 → 發光週一（張良 2026-09-20 抓到週日沒東西亮）
    h += `<section><h2>預估備料量 <span class="hint">份/日</span></h2>`
    h += `<div class="scroll"><table><thead><tr><th>項目</th><th>總平均</th>${['一','二','三','四','五'].map((w,i)=>`<th${tw===i+1?' class="todaycol"':''}>週${w}${tw===i+1?' ★':''}</th>`).join('')}<th>峰值</th><th>低值</th></tr></thead><tbody>`
    grps.forEach(g=>{
      h += `<tr class="catband"><td colspan="9">${g}</td></tr>`
      d.prep.filter(p=>p.grp===g).forEach(p=>{
        const wds = (p.byWd||[]).map((v,i)=>{
          if(v==null||p.avg==null||!p.avg) return `<td>—</td>`
          // 每一格都顯示 %（高度一致，張良 2026-09-20）；與總平均的差
          const diff = Math.round((v-p.avg)/p.avg*100)
          const badge = `<div style="font-size:9.5px;font-weight:800;color:${diff>0?'var(--pdark)':diff<0?'var(--muted)':'#B9C4D0'}">${diff>0?'+':''}${diff}%</div>`
          return `<td${tw===i+1?' class="todaycol"':''}><b>${v}</b>${badge}</td>`
        }).join('')
        h += `<tr${p.sub?' class="subrow"':''}><td style="font-weight:${p.sub?800:700};color:${p.sub?'#8a5a2e':'var(--ink)'}">${p.sub?'└ ':''}${p.name}</td><td class="avg">${p.avg!=null?p.avg:'—'}</td>${wds}<td style="font-weight:800;color:#A85C26">${p.peak!=null?p.peak:'—'}</td><td class="mut">${p.low!=null?p.low:'—'}</td></tr>`
      })
    })
    h += `</tbody></table></div><div class="hint" style="margin-top:8px">怎麼用：①看今天星期幾那欄（藍底）＝該星期近幾週的平均銷量，數字下的 ±% 是跟總平均的差（超過 ±10% 才顯示，多備或少備看它）②峰值/低值＝近30天單日最高/最低——大日抓峰值、保守抓平均，低於低值就太少了。</div></section>`
  }
  // ✅ 今日SOP（張良 2026-09-21）：每站每天SOP＋拍照＋完成記時；先放佔位div，資料另外抓（sopLoad）
  if (store === 'ground') h += `<div id="sop"></div>`
  // 🍳 預做節奏表（張良 2026-09-21）：完整菜單＋品類分組＋隱藏設定；內容由 rhythmRender 畫（隱藏清單走即時的 sop 口）
  if (d.rhythm) {
    window._rhy = d.rhythm
    h += `<section><h2>🍳 預做節奏表 <span style="float:right;white-space:nowrap"><button class="mini on" id="rb15" onclick="rSwitch(15)">15分</button><button class="mini" id="rb30" onclick="rSwitch(30)">30分</button><button class="mini" id="rbMng" onclick="rMng()">🙈 隱藏管理</button></span><br><span class="hint">${d.rhythm.days ? `近 ${d.rhythm.days} 個營業日平均・每格＝該時段平均賣幾份（·＝不到0.5份）——照表預做、尖峰前先備` : '⏳ 資料從 9/22（一）11:00 起每 15 分鐘自動累積——現在先看得到版面，之後開始長數字'}</span></h2><div id="rhyBody"></div></section>`
  }
  // 日表（張良 2026-09-22 v3：去NT簡化版面、日期欄凍結、至14:00=14點前營收、總營收、表頭下平均列、高低於平均用色階（綠=高於、紅=低於，深淺=差多少））
  const isGD = d.store === 'ground'
  const dv = d.days.filter(x=>x.rev>0) // 平均只算有營業的日子
  const mean = f => { const a = dv.map(f).filter(v=>v!=null&&isFinite(v)); return a.length ? a.reduce((s2,v)=>s2+v,0)/a.length : null }
  const luOf = x => x.lunchRev!=null ? x.lunchRev : (x.lunchPct!=null&&x.rev ? x.rev*x.lunchPct/100 : null)
  const avR = mean(x=>x.rev), avLu = isGD?mean(luOf):null, avTx = mean(x=>x.tx||null)
  const avAvg = (()=>{ const tr=dv.reduce((s2,x)=>s2+(x.rev||0),0), tt=dv.reduce((s2,x)=>s2+(x.tx||0),0); return tt?tr/tt:null })()
  const avCash = mean(x=>x.cash), avCard = mean(x=>x.card), avLp = mean(x=>x.linepay||null), avUb = mean(x=>x.uber||null), avDis = mean(x=>x.discount||null)
  const avKp = isGD?mean(x=>x.kioskPct):null, avTk = isGD?mean(x=>x.takePct):null
  const avSet = isGD?(()=>{ const a=(d.setPcts||[]).filter(v=>v!=null); return a.length?a.reduce((s2,v)=>s2+v,0)/a.length:null })():null
  const fN = v => v!=null ? Math.round(v).toLocaleString() : '—' // 去 NT$：數字乾淨版面
  const fP = v => v!=null?Math.round(v)+'%':'—'
  // 色階：跟該欄平均比，高=綠、低=紅，差越多越深（±3%內不上色）
  const heat = (v, avg) => { if (v==null||!avg) return ''; let dv2=(v-avg)/avg; if (Math.abs(dv2)<0.03) return ''; dv2=Math.max(-0.5,Math.min(0.5,dv2)); const a=Math.min(0.26,Math.abs(dv2)*0.5); return `background:rgba(${dv2>0?'22,163,74':'220,38,38'},${a.toFixed(2)})` }
  const hc = (v, avg, extra) => `<td style="${heat(v,avg)}${extra?';'+extra:''}">${fN(v)}</td>`
  h += `<section><h2>每日數據（全部歷史） <span class="hint">平均＝只算有營業的日子；綠＝高於平均、紅＝低於，越深差越多</span></h2><div class="scroll" style="max-height:62vh;overflow-y:auto"><table><thead><tr><th style="position:sticky;left:0;z-index:3;text-align:left">日期</th>${isGD?'<th>至14:00</th>':''}<th>總營收</th><th>單數</th><th>單均</th><th>現金</th><th>信用卡</th><th>LINE Pay</th><th>Uber</th><th>折扣</th>${isGD?'<th>自助%</th><th>外帶%</th><th>套餐/主餐%</th>':''}</tr></thead><tbody>`
  const avBg = 'background:var(--psoft);font-weight:800;color:var(--pdark)'
  h += `<tr><td style="position:sticky;left:0;z-index:1;${avBg};font-weight:900">平均</td>${isGD?`<td style="${avBg}">${fN(avLu)}</td>`:''}<td style="${avBg};font-weight:900">${fN(avR)}</td><td style="${avBg}">${avTx!=null?Math.round(avTx):'—'}</td><td style="${avBg}">${fN(avAvg)}</td><td style="${avBg}">${fN(avCash)}</td><td style="${avBg}">${fN(avCard)}</td><td style="${avBg}">${fN(avLp)}</td><td style="${avBg}">${fN(avUb)}</td><td style="${avBg}">${fN(avDis)}</td>${isGD?`<td style="${avBg}">${fP(avKp)}</td><td style="${avBg}">${fP(avTk)}</td><td style="${avBg}">${fP(avSet)}</td>`:''}</tr>`
  d.days.forEach((x,i)=>{
    const wknd = x.wd==='六'||x.wd==='日'
    const zb = (i%2===0) ? '#FAFCFD' : '#fff' // 凍結欄自帶底色（斑馬對齊：平均列佔第1列）
    const lu = luOf(x)

function lbElapsed(at){ if(!at) return ''; const m=Math.floor((Date.now()-at)/60000); return m<60?`${m}分`:`${Math.floor(m/60)}時${m%60}分` }
function taskCard(x, meN, me){
  const stColor = x.status==='pending'?'#A85C26':'var(--red)'
  const border = x.flag?'#E8B931':x.status==='pending'?'#E8D089':'#F0B8B1'
  let s = `<div style="background:#fff;border:1.5px solid ${border};border-radius:10px;padding:9px 10px;margin-bottom:8px;font-size:12.5px">
    <div><b style="color:${stColor}">${x.flag?'🚩 ':''}${x.status==='pending'?'🕐':'⚠️'} ${x.text||'（附件）'}</b>${(x.media||[]).map((m,i)=>` <a href="${m}" target="_blank">📎${i+1}</a>`).join('')}</div>
    <div class="hint">發現：${x.by}・${x.ts}</div>`
  if (x.due) s += `<div class="hint" style="color:#A85C26;font-weight:700">⏰ 排定：${x.due}</div>`
  if (x.status==='open' && x.claimBy) s += `<div style="color:var(--pdark);font-weight:800">🔧 ${x.claimBy} 處理中・已 ${lbElapsed(x.claimAt)}</div>`
  if (x.status==='pending') s += `<div style="color:#A85C26;font-weight:700">🕐 ${x.doneBy} 已處理・等審核</div>`
  // 📝 階段性 checklist（文字＋圖片；張良 2026-09-22）
  const ck = x.ck||[]
  if (ck.length || meN) {
    const dn = ck.filter(c=>c.done).length
    s += `<div style="margin-top:6px;border-top:1px dashed var(--line);padding-top:5px">`
    if (ck.length) s += `<div style="font-size:12px;font-weight:800">📝 步驟 ${dn}/${ck.length}</div>`
    ck.forEach(c=>{ s += `<div style="display:flex;gap:6px;align-items:flex-start;font-size:12.5px;padding:2px 0">
      ${meN?`<input type="checkbox" ${c.done?'checked':''} style="margin-top:2px" onclick="ckOp('${x.id}','cktog','${c.id}')">`:(c.done?'☑':'☐')}
      <span style="flex:1;${c.done?'text-decoration:line-through;color:var(--muted)':''}">${(c.t||'').replace(/</g,'&lt;')}${c.img?` <a href="${c.img}" target="_blank">📎圖</a>`:''}${c.done&&c.doneBy?` <span class="hint">${c.doneBy}</span>`:''}</span>
      ${meN?`<button class="mini" style="padding:1px 6px;color:var(--red)" onclick="if(confirm('刪除這個步驟？'))ckOp('${x.id}','ckdel','${c.id}')">✕</button>`:''}
    </div>` })
    if (meN) s += `<button class="mini" onclick="ckAdd('${x.id}')">＋ 加步驟</button>`
    s += `</div>`
  }
  if (meN) {
    s += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">`
    if (x.status==='open' && !x.claimBy) s += `<button class="mini on" onclick="lbOp('${x.id}','claim')">🙋 我來解決</button>`
    if (x.status==='open' && x.claimBy===meN) s += `<button class="mini on" onclick="sopResolve('${x.id}')">✅ 解決了</button><button class="mini" onclick="lbOp('${x.id}','unclaim')">放棄</button>`
    if (x.status==='open' && x.claimBy && x.claimBy!==meN) s += `<button class="mini" onclick="sopResolve('${x.id}')">✅ 已解決</button>`
    if (x.status==='open' && !x.claimBy) s += `<button class="mini" onclick="sopResolve('${x.id}')">✅ 已解決</button>`
    if (x.status==='pending' && me && me.approver) s += `<button class="mini on" onclick="sopReview('${x.id}',1)">✅ 核准</button><button class="mini" style="color:var(--red)" onclick="sopReview('${x.id}',0)">↩︎ 退回</button>`
    s += `<button class="mini" onclick="lbOp('${x.id}','flag',${x.flag?0:1})">${x.flag?'取消🚩':'🚩標記'}</button><button class="mini" onclick="lbDue('${x.id}','${(x.due||'').replace(/'/g,'')}')">⏰排時間</button><button class="mini" onclick="taskOwn('${x.id}')">👤負責人</button>`
    s += `</div>`
  }
  s += `</div>`
  return s
}

//    正常8h/日、加班前2h×1.34、之後×1.67（勞基法§24）；單日>12h（§32）、月加班>46h（§32）、連上7天（§36七休一）標紅；遲到寬限5分）──
let shiftYm = null

async function shiftLoad(ym){

  if (!window._shiftD || window._shiftD.ym !== shiftYm) { const c = tcGet('shift_'+shiftYm); if (c) window._shiftD = c }

  if (!d || !d.ok) { if (!window._shiftD) app.innerHTML = '<div class="err">讀不到資料</div>'; return }
  window._shiftD = d; tcSet('shift_'+shiftYm, d)
  if (curStore === 'shift') shiftRender()
}
function shiftRender(){
  const d = window._shiftD; if (!d || curStore !== 'shift') return
  document.getElementById('upd').textContent = '📅 班表 × 打卡・' + shiftYm
  const meN = d.me && d.me.name
  const tmin = hm => { const a=String(hm||'').split(':'); return (+a[0]||0)*60+(+a[1]||0) }
  const fhm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')
  const today = todayTpe()
  // 打卡整理：人+日 → 事件列（台北時區）
  const pd = {}
  for (const p2 of d.punches){
    const t3 = new Date(p2.ts)
    const dt = t3.toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'})
    const tm = t3.toLocaleTimeString('en-GB',{hour12:false,timeZone:'Asia/Taipei'})
    const k2 = p2.name+'|'+dt
    ;(pd[k2]=pd[k2]||[]).push({ m: (+tm.slice(0,2))*60+(+tm.slice(3,5)), dir: p2.dir })
  }
  Object.values(pd).forEach(a=>a.sort((x,y)=>x.m-y.m))
  // 逐「人日」：工時＋狀態
  const rows = []
  const keys = new Set([...d.sched.map(s=>s.name+'|'+s.date), ...Object.keys(pd)])
  for (const k2 of keys){
    const [name, date] = k2.split('|')
    if (!date || !date.startsWith(shiftYm)) continue
    const s = d.sched.find(x=>x.name===name && x.date===date)
    const ev = pd[k2]||[]
    let ms = 0, working = false
    for (let i=0;i<ev.length;i++){ if (ev[i].dir==='in'){ if (ev[i+1] && ev[i+1].dir==='out'){ ms += ev[i+1].m - ev[i].m; i++ } else if (date===today) working = true } }
    let workedMin = ms
    if (workedMin>0 && ev.length<=2 && s && s.break) workedMin = Math.max(0, workedMin - (+s.break||0)) // 只打上下班各一次→扣班表休息
    const firstIn = ev.find(e=>e.dir==='in'), lastOut = [...ev].reverse().find(e=>e.dir==='out')
    const st = []
    if (s){
      if (firstIn){ if (firstIn.m > tmin(s.start)+5) st.push('遲到'+(firstIn.m-tmin(s.start))+'分') }
      else if (date < today) st.push('未到')
      if (lastOut && lastOut.m < tmin(s.end) && !working) st.push('早退'+(tmin(s.end)-lastOut.m)+'分')
    } else if (ev.length) st.push('未排班出勤')
    if (working) st.push('上班中')
    const h2 = workedMin/60
    rows.push({ date, name, s, firstIn: firstIn?fhm(firstIn.m):'', lastOut: lastOut?fhm(lastOut.m):'', working, h: h2, ot1: Math.max(0,Math.min(h2-8,2)), ot2: Math.max(0,h2-10), over12: h2>12, st })
  }
  // 人員月統計＋勞基法旗標
  const per = {}
  rows.forEach(r=>{ const p3 = per[r.name] = per[r.name]||{ h:0, ot1:0, ot2:0, days:[], flags:new Set() }
    p3.h+=r.h; p3.ot1+=r.ot1; p3.ot2+=r.ot2
    if (r.h>0) p3.days.push(r.date)
    if (r.over12) p3.flags.add('單日>12h('+r.date.slice(5)+')') })
  Object.values(per).forEach(p3=>{
    if (p3.ot1+p3.ot2 > 46) p3.flags.add('月加班'+(Math.round((p3.ot1+p3.ot2)*10)/10)+'h＞46h上限')
    const ds = [...new Set(p3.days)].sort(); let run = 1
    for (let i=1;i<ds.length;i++){ const gap = (new Date(ds[i])-new Date(ds[i-1]))/86400e3; run = gap===1 ? run+1 : 1; if (run>6){ p3.flags.add('連上超過6天（七休一）'); break } }
  })
  const r1 = x => Math.round(x*10)/10
  let h = `<section><h2>📅 班表 × 打卡 <span class="hint">${meN?'':BIND_HINT}</span></h2>
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
     <button class="mini" onclick="shiftNav(-1)">‹</button><b style="font-size:15px">${shiftYm}</b><button class="mini" onclick="shiftNav(1)">›</button>
     ${meN?`<button class="mini on" style="margin-left:auto;padding:8px 16px" onclick="shiftForm()">＋ 排班</button>`:''}
   </div>
   <div class="hint" style="margin-bottom:10px">工時＝打卡配對（只打上下班各一次時，扣掉班表的休息分鐘）；遲到寬限 5 分。加班口徑同薪資引擎：前 2 小時 ×1.34、之後 ×1.67（勞基法§24）；單日＞12h、月加班＞46h、連上 7 天會標紅（§32／§36）。試算參考用，正式發薪以人工核定為準。</div>`
  const pn = Object.keys(per).sort()
  if (pn.length){
    h += `<div class="scroll"><table><thead><tr><th style="text-align:left">夥伴</th><th>總工時</th><th>正常</th><th>加班×1.34</th><th>加班×1.67</th><th style="text-align:left">⚠️ 勞基法檢查</th></tr></thead><tbody>`
    pn.forEach(nm=>{ const p3 = per[nm]
      const flags = [...p3.flags]
      h += `<tr style="${meN===nm?'background:#E5F3FA':''}"><td style="text-align:left;font-weight:800;color:var(--ink)">${nm}</td><td class="avg">${r1(p3.h)}</td><td>${r1(p3.h-p3.ot1-p3.ot2)}</td><td>${p3.ot1?r1(p3.ot1):'—'}</td><td>${p3.ot2?r1(p3.ot2):'—'}</td><td style="text-align:left;${flags.length?'color:var(--red);font-weight:700':''}">${flags.length?flags.join('、'):'✓ 正常'}</td></tr>`
    })
    h += `</tbody></table></div>`
  } else h += `<div class="mut">這個月還沒有班表或打卡——${meN?'按右上「＋ 排班」開始':'綁定後可以排班'}；上班用最上面 ⏰ 打卡</div>`
  h += `</section><section><h2>🗓 明細</h2>`
  const byDate = {}
  rows.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r) })
  const wd = ['日','一','二','三','四','五','六']
  const dts = Object.keys(byDate).sort().reverse()
  if (!dts.length) h += `<div class="mut">沒有資料</div>`
  dts.forEach(dt=>{
    h += `<div style="font-weight:900;margin:10px 0 4px;color:var(--pdark)">${dt.slice(5)}（${wd[new Date(dt).getDay()]}）${dt===today?'・今天':''}</div>`
    byDate[dt].sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{
      const bad = r.st.some(x=>x!=='上班中')
      h += `<div style="background:#fff;border:1.5px solid ${r.over12?'var(--red)':'var(--line)'};border-radius:10px;padding:7px 10px;margin-bottom:6px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <b style="min-width:56px">${r.name}</b>

}
function fbSlide(el, nm){
  const v = +el.value
  const sp = document.getElementById('fbst_'+nm); if (sp) sp.innerHTML = '★'.repeat(v)+'☆'.repeat(5-v)
  const fd = document.getElementById('fbd_'+nm); if (fd) fd.textContent = LVLTXT[v]
  el.dataset.touched = '1'
}
async function fbSend(nm){
  const card = document.getElementById('fbtx_'+nm)
  const sl = card ? card.closest('div').parentElement.querySelector('input[type=range]') : null
  const mine = ((window._fbD.fbs||[]).find(x=>x.target===nm && x.by===window._fbD.me.name)) || null
  const stars = (sl && (sl.dataset.touched || mine)) ? +sl.value : 0
  const text = card ? card.value : ''
  const r = await fetch('/api/mail-sync?fbset=' + encodeURIComponent(K), { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ date: window._fbD.date, target: nm, stars, text, token: TK() }) })
  const d = await r.json().catch(()=>null)
  if (d && d.ok) fbLoad(window._fbD.date); else alert((d&&d.error)||'送出失敗')
}
function fbOther(){
  const d = window._fbD
  const pool = (d.names||[]).filter(n=>!(d.workers||[]).includes(n) && n!==(d.me&&d.me.name))
  const ov = document.createElement('div'); ov.id='fboOv'
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(16,24,43,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px'
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:360px;width:100%;padding:16px" onclick="event.stopPropagation()">
    <div style="font-weight:900;margin-bottom:8px">＋ 對其他人回饋</div>
    <select id="fboSel" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;margin-bottom:10px">${pool.map(n=>`<option>${n}</option>`).join('')}</select>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="mini" style="padding:9px 12px" onclick="document.getElementById('fboOv').remove()">取消</button>
    <button class="mini on" style="padding:9px 18px" onclick="fbOtherGo()">加入</button></div></div>`
  ov.onclick = () => ov.remove()
  document.body.appendChild(ov)
}
function fbOtherGo(){
  const v = (document.getElementById('fboSel')||{}).value||''
  const o = document.getElementById('fboOv'); if (o) o.remove()
  if (!v) return
  window._fbD.workers = [...(window._fbD.workers||[]), v]
  fbRender()
}
load('ground')
</script>
