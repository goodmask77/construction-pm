<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ce1611">
<title>GROUN:D 會員卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Lora:wght@600;700&display=swap">
<style>
/* 🪪 GROUN:D 會員卡（LIFF 端點 /member）v4.70.83：入會同意→會員卡（60 秒 QR＋會員號碼）→點數／流水／券→個人資料→退會。計畫 docs/MEMBER_PLAN_v1.md */
:root{--bg:#f5efe4;--paper:#fffaf2;--ink:#2b1d18;--mute:#7a6a62;--line:#d8c9b6;--red:#ce1611;--soft:#f3e4dd;--ok:#2f7a4a;--warn:#b4581a;--warnbg:#fdeedd;--num:'Lora','Noto Sans TC',serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14.5px/1.5 'Noto Sans TC',system-ui,sans-serif;padding-bottom:30px}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px}
.brand{text-align:center;padding:6px 0 2px}.brand b{display:block;color:var(--red);font-size:20px;font-weight:900;letter-spacing:.06em}.brand small{color:var(--mute);font-size:11.5px;letter-spacing:.18em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
h3{font-size:13px;margin:0 0 8px;font-weight:700;color:var(--mute);letter-spacing:.06em}.sub{font-size:12.5px;color:var(--mute)}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;font:700 14px 'Noto Sans TC',sans-serif;cursor:pointer}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.line{background:#06c755;border-color:#06c755;color:#fff}.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mcard{background:linear-gradient(135deg,#ce1611,#8f0e0a);color:#fff;border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 10px 30px rgba(206,22,17,.25)}
.mcard .nm{font-weight:900;font-size:18px}.mcard .mno{font-family:var(--num);font-size:26px;letter-spacing:.14em;font-weight:700}.mcard .lbl{font-size:11px;opacity:.85;letter-spacing:.14em}
.mcard .pts{font-family:var(--num);font-size:40px;font-weight:700;line-height:1}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:grid;place-items:center;margin-top:12px}.qrbox canvas,.qrbox img{width:200px;height:200px}
.led{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.led .p{font-family:var(--num);font-weight:700}.led .p.plus{color:var(--ok)}.led .p.minus{color:var(--red)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--red)}.pill.grey{background:var(--line);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#166534;color:#fff;padding:8px 14px;border-radius:10px;font-weight:800;font-size:13.5px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}.toast.bad{background:#b91c1c}
.consent{font-size:12.5px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:160px;overflow:auto}
details summary{cursor:pointer;font-weight:700;font-size:13.5px}
/* 🎡 轉盤 */
.wheelOv{position:fixed;inset:0;background:rgba(20,10,8,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
.wheelWrap{position:relative;width:280px;height:280px}
.wheel{width:280px;height:280px;border-radius:50%;border:8px solid #fff;box-shadow:0 0 0 4px #ce1611,0 14px 40px rgba(0,0,0,.5);transition:transform 4.2s cubic-bezier(.12,.7,.08,1);position:relative;overflow:hidden}
.wheel .lab{position:absolute;left:50%;top:50%;width:120px;margin-left:-60px;transform-origin:0 0;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:center;line-height:1.15}
.wheelPin{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));z-index:2}
.wheelBtn{margin-top:22px;background:#ce1611;color:#fff;border:0;border-radius:999px;padding:14px 34px;font:900 17px 'Noto Sans TC',sans-serif;box-shadow:0 8px 24px rgba(206,22,17,.45)}
.wheelBtn[disabled]{opacity:.6}
.result{background:#fff;color:var(--ink);border-radius:16px;padding:18px 20px;text-align:center;margin-top:18px;max-width:300px}
.result b{display:block;font-size:22px;color:var(--red)}
@media (prefers-reduced-motion:reduce){.wheel{transition-duration:.6s}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="brand"><b>GROUN:D</b><small>會員卡</small></div><div class="card sub" id="loading">讀取中…</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<script>
(async () => {
  const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const tw = (iso, d) => { try { return new Intl.DateTimeFormat(d ? 'sv-SE' : 'zh-TW', { timeZone: 'Asia/Taipei', ...(d ? { year: 'numeric', month: '2-digit', day: '2-digit' } : { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) }).format(new Date(iso)) } catch (_) { return String(iso || '').slice(0, 16) } }
  const fmt = n => Math.round(Number(n) || 0).toLocaleString('zh-TW')
  const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)) } catch (_) { return null } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (_) {} }, del: k => { try { localStorage.removeItem(k) } catch (_) {} } }
  const api = async (body) => { try { const r = await fetch('/api/mail-sync?mcard=1' + (body ? '' : '&r=' + Date.now()), body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}); return await r.json() } catch (_) { return { ok: false, error: '連線失敗，請再試一次' } } }
  function toast (t, bad) { const el = $('toast'); el.textContent = t; el.className = 'toast' + (bad ? ' bad' : ''); el.style.opacity = '1'; clearTimeout(el._t); el._t = setTimeout(() => { el.style.opacity = '0' }, 2200) }
  let SES = LS.get('gd_member_ses'), ME = null, qrTimer = null, W = null
  const cfg = await api()
  // 1) 身分：LIFF（在 LINE 內或 LINE Login）
  async function login () {
    if (!cfg.liff) { $('loading').innerHTML = '會員卡還在準備中（LINE 登入尚未開通）。請稍後再試，或到櫃檯請店員幫您建立會員。'; return false }
    try {
      await new Promise((res, rej) => { if (window.liff) return res(); const s = document.createElement('script'); s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s) })
      await liff.init({ liffId: cfg.liff })
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return false }
      W = await api({ op: 'who', at: liff.getAccessToken() })
      if (!W.ok) { $('loading').textContent = W.error || '登入失敗'; return false }
      SES = { uid: W.uid, mt: W.mt }; LS.set('gd_member_ses', SES)
      return true
    } catch (e) { $('loading').innerHTML = 'LINE 登入失敗，請從 GROUN:D 官方帳號重新打開會員卡。'; return false }
  }
  async function loadMe () {
    const d = await api({ op: 'me', ...SES })
    if (d && d.ok) { ME = d; render(); return true }
    if (d && d.needConsent) { renderConsent(); return true }
    return false
  }
  // 試上次 session，不行再走 LIFF
  let okS = false
  if (SES && SES.uid) okS = await loadMe()
  if (!okS) { if (await login()) { if (W && W.needConsent) renderConsent(); else await loadMe() } }

  function renderConsent () {
    const name = (W && W.name) || ((ME || {}).member || {}).name || ''
    const txt = (W && W.consentText) || ''
    $('root').innerHTML = `<div class="brand"><b>GROUN:D</b><small>加入會員</small></div>
      <div class="card"><h3>加入 GROUN:D 會員</h3><div class="sub" style="margin-bottom:8px">消費累點、點數換餐、團體訂餐自動歸戶。</div>
        <label class="sub">名字（店員會用這個稱呼您）</label><input id="cName" value="${esc(name)}" placeholder="名字">
        <label class="sub" style="display:block;margin-top:8px">手機（選填，找回會員用）</label><input id="cPhone" inputmode="tel" placeholder="09xxxxxxxx">
        <h3 style="margin-top:12px">個資告知</h3><div class="consent">${esc(txt)}</div>
        <label class="row" style="margin-top:10px;font-size:13.5px"><input type="checkbox" id="cAgree" style="width:auto"> 我已閱讀並同意上述說明（版本 ${esc((W && W.consentVer) || '')}）</label>
        <button class="btn red" id="cGo" style="width:100%;margin-top:12px;padding:13px;font-size:15px">同意並加入</button></div>`
    $('cGo').onclick = async () => { if (!$('cAgree').checked) return toast('請先勾選同意', true); const n = $('cName').value.trim(); if (!n) return toast('請填名字', true); $('cGo').disabled = true; const d = await api({ op: 'consent', ...SES, name: n, phone: $('cPhone').value, pic: (W && W.pic) || '' }); if (!d || !d.ok) { $('cGo').disabled = false; return toast((d && d.error) || '加入失敗', true) } ME = d; render(); toast(d.created ? '歡迎加入 GROUN:D！' : '歡迎回來！') }
  }
  function render () {
    const m = ME.member
    const led = (ME.ledger || []).map(l => `<div class="led"><div><div>${esc(l.note || ({ earn: '消費累點', spend: '兌換', adjust: '店家調整', welcome: '入會禮', game: '遊戲', reverse: '沖回' })[l.kind] || l.kind)}${l.amount ? ` <span class="sub">消費 ${fmt(l.amount)}</span>` : ''}</div><div class="sub">${tw(l.created_at)}</div></div><div class="p ${l.pts > 0 ? 'plus' : 'minus'}">${l.pts > 0 ? '+' : ''}${fmt(l.pts)}</div></div>`).join('') || '<div class="sub">還沒有紀錄。消費時出示會員號碼或 QR 給店員就能累點。</div>'
    const cps = (ME.coupons || []).map(c => `<div class="led"><div><div>${esc(c.name)}</div><div class="sub">${tw(c.created_at, 1)}${c.redeemed_at ? '・已於櫃檯兌換' : c.expires_at ? '・' + tw(c.expires_at, 1) + ' 前到櫃檯使用' : ''}</div></div><span class="pill ${c.status === 'redeemed' ? 'grey' : ''}">${({ issued: '可用', redeemed: '已兌換', expired: '已過期', void: '作廢' })[c.status] || c.status}</span></div>`).join('') || '<div class="sub">還沒有兌換紀錄</div>'
    const rws = (ME.rewards || []).map(r => `<div class="led"><div>${esc(r.name)}</div><b style="font-family:var(--num)">${r.pts} 點</b></div>`).join('')
    $('root').innerHTML = `<div class="brand"><b>GROUN:D</b><small>會員卡</small></div>
      <div class="mcard"><div class="row" style="justify-content:space-between"><div><div class="lbl">MEMBER</div><div class="nm">${esc(m.name)}</div></div>${m.pic ? `<img src="${esc(m.pic)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.7)">` : ''}</div>
        <div style="margin-top:14px" class="row"><div style="flex:1"><div class="lbl">可用點數</div><div class="pts">${fmt(ME.balance)}</div></div><div><div class="lbl">會員號碼</div><div class="mno">${esc(m.mno || '')}</div></div></div>
        <div class="qrbox"><canvas id="qr"></canvas><div class="sub" style="margin-top:6px;color:#555">結帳時出示此 QR 或報會員號碼・<span id="qrT">60</span> 秒自動更新</div></div></div>
      ${gameCard()}
      <div class="card"><h3>怎麼累點</h3><div class="sub">每消費 ${ME.perAmt} 元 1 點，結帳時給店員掃 QR 或報會員號碼。團體訂餐用 LINE 登入點餐會自動累點。</div>${ME.invoiceScan ? `<button class="btn" id="btnInv" style="width:100%;margin-top:8px">掃發票自己集點（48 小時內）</button>` : ''}</div>
      <div class="card"><h3>可以換什麼</h3>${rws || '<div class="sub">尚未開放</div>'}<div class="sub" style="margin-top:6px">到櫃檯出示會員卡，請店員幫您兌換（直接扣點）。</div></div>
      <div class="card"><h3>點數紀錄</h3>${led}</div>
      <div class="card"><h3>兌換紀錄</h3>${cps}</div>
      <details class="card"><summary>個人資料</summary><div style="margin-top:8px"><label class="sub">名字</label><input id="pName" value="${esc(m.name || '')}"><label class="sub" style="display:block;margin-top:8px">手機</label><input id="pPhone" value="${esc(m.phone || '')}" inputmode="tel"><label class="sub" style="display:block;margin-top:8px">生日（填一次後不能自己改）</label><input id="pBday" type="date" value="${esc(m.birthday || '')}" ${m.birthday ? 'disabled' : ''}><button class="btn" id="pSave" style="margin-top:10px">儲存</button></div>
        <div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:10px"><div class="sub">退會後個資會匿名化，點數與紀錄依法保留、不能再使用。</div><label class="row" style="margin-top:8px;font-size:13px"><input type="checkbox" id="pMkt" ${ME.mktOut ? 'checked' : ''} style="width:auto"> 不要收 GROUN:D 的行銷訊息（點數、訂單通知不受影響）</label><button class="btn sm" id="pLeave" style="margin-top:6px;color:var(--red)">退會</button></div></details>`
    drawQR(); clearInterval(qrTimer); let left = 60; qrTimer = setInterval(async () => { left--; const t = $('qrT'); if (t) t.textContent = left; if (left <= 0) { left = 60; const d = await api({ op: 'me', ...SES }); if (d && d.ok) { ME = d; drawQR(); const p = document.querySelector('.pts'); if (p) p.textContent = fmt(d.balance) } } }, 1000)
    const bw = $('btnWheel'); if (bw) bw.onclick = (ME.game && ME.game.campaign && ME.game.campaign.type === 'slot') ? openSlot : openWheel
    const bi = $('btnInv'); if (bi) bi.onclick = scanInvoice
    const pm = $('pMkt'); if (pm) pm.onchange = async () => { const d = await api({ op: 'mktout', ...SES, out: pm.checked }); toast(d && d.ok ? (d.mktOut ? '已關閉行銷訊息' : '已開啟行銷訊息') : '失敗', !(d && d.ok)) }
    $('pSave').onclick = async () => { const d = await api({ op: 'update', ...SES, name: $('pName').value, phone: $('pPhone').value, birthday: $('pBday').disabled ? null : $('pBday').value }); if (!d || !d.ok) return toast((d && d.error) || '儲存失敗', true); ME = d; render(); toast('已儲存') }
    $('pLeave').onclick = async () => { if (!window.confirm('確定退會？退會後點數與紀錄不能再使用。')) return; const d = await api({ op: 'leave', ...SES }); if (!d || !d.ok) return toast((d && d.error) || '失敗', true); LS.del('gd_member_ses'); $('root').innerHTML = '<div class="brand"><b>GROUN:D</b><small>會員卡</small></div><div class="card">已退會，謝謝您曾經的支持。要再加入隨時從官方帳號打開會員卡即可。</div>' }
  }
  function gameCard () {
    const g = ME.game; if (!g || !g.campaign) return ''
    const c = g.campaign, n = (g.rights || []).length
    const pz = (c.prizes || []).filter(p => p.kind !== 'none').map(p => `${esc(p.name)}${p.total ? `（剩 ${p.left}/${p.total}）` : ''}`).join('、')
    return `<div class="card" style="border-color:var(--red)"><div class="row" style="justify-content:space-between"><h3 style="margin:0;color:var(--red)">🎡 ${esc(c.name)}</h3>${c.endAt ? `<span class="sub">至 ${tw(c.endAt, 1)}</span>` : ''}</div>
      <div style="margin-top:6px;font-size:13.5px">${n ? `你有 <b style="color:var(--red);font-size:18px">${n}</b> 次機會` : '目前沒有可用的機會，消費累點後就會多一次'}</div>
      ${n ? `<button class="btn red" id="btnWheel" style="width:100%;margin-top:10px;padding:12px;font-size:15px">轉一次</button>` : ''}
      <div class="sub" style="margin-top:8px">獎項：${pz || '—'}。${esc((c.rules || {}).note || '')}獎項數量有限，抽完為止；券請到櫃檯出示給店員核銷。</div>
      ${(g.draws || []).length ? `<details style="margin-top:6px"><summary class="sub">我的抽獎紀錄</summary>${g.draws.map(d => `<div class="led"><span>${esc((d.prize || {}).name || '—')}${(d.prize || {}).capped ? ' <span class="sub">(已達全年上限)</span>' : ''}</span><span class="sub">${tw(d.created_at)}</span></div>`).join('')}</details>` : ''}</div>`
  }
  function openWheel () {
    const g = ME.game, c = g.campaign, prizes = c.prizes || [], N = prizes.length || 1, seg = 360 / N
    const colors = ['#ce1611', '#f0a35c', '#2f7a4a', '#2049c9', '#8f0e0a', '#b4581a', '#1f6f5f', '#6b4ac9']
    const grad = prizes.map((p, i) => `${colors[i % colors.length]} ${i * seg}deg ${(i + 1) * seg}deg`).join(',')
    const ov = document.createElement('div'); ov.className = 'wheelOv'; ov.id = 'wheelOv'
    ov.innerHTML = `<div style="font-weight:900;font-size:18px;margin-bottom:12px">${esc(c.name)}</div><div class="wheelWrap"><div class="wheelPin"></div><div class="wheel" id="wheel" style="background:conic-gradient(${grad})">${prizes.map((p, i) => `<div class="lab" style="transform:rotate(${i * seg + seg / 2}deg) translateY(-118px) translateX(-50%)">${esc(p.name)}</div>`).join('')}</div></div>
      <button class="wheelBtn" id="wheelGo">開始轉！</button><div id="wheelRes"></div><button class="btn" id="wheelClose" style="margin-top:14px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">關閉</button>`
    document.body.appendChild(ov)
    $('wheelClose').onclick = () => { ov.remove(); refreshMe() }
    $('wheelGo').onclick = async () => {
      const b = $('wheelGo'); b.disabled = true; b.textContent = '轉動中…'
      const d = await api({ op: 'draw', ...SES, rightKey: (g.rights[0] || {}).key })
      if (!d || !d.ok) { b.disabled = false; b.textContent = '開始轉！'; return toast((d && d.error) || '抽獎失敗', true) }
      const idx = prizes.findIndex(p => p.idx === d.pidx); const center = (idx < 0 ? 0 : idx) * seg + seg / 2
      const w = $('wheel'); const turns = 360 * 5 + (360 - center); w.style.transform = `rotate(${turns}deg)`
      setTimeout(() => { const pz = d.prize || {}; $('wheelRes').innerHTML = `<div class="result">${pz.kind === 'none' ? `<div>這次沒中</div><b>銘謝惠顧</b>${pz.capped ? '<div class="sub">你今年中獎已達上限，下次再來</div>' : ''}` : `<div>恭喜！抽中</div><b>${esc(pz.name)}</b><div class="sub">${pz.kind === 'pts' ? '點數已入帳' : '券已放進你的兌換紀錄，到櫃檯出示給店員核銷'}</div>`}</div>`; b.style.display = 'none' }, 4300)
    }
  }
  // 🎰 拉霸：三條直式捲軸，伺服器先決定結果，前端依序停在抽到的獎項
  function openSlot () {
    const g = ME.game, c = g.campaign, prizes = c.prizes || [], N = prizes.length || 1
    const ov = document.createElement('div'); ov.className = 'wheelOv'; ov.id = 'wheelOv'
    const reel = (k) => `<div style="width:84px;height:120px;overflow:hidden;background:#fff;border-radius:12px;border:3px solid #ce1611;position:relative"><div id="reel${k}" style="transition:transform 2.6s cubic-bezier(.15,.8,.1,1);display:flex;flex-direction:column">${[...prizes, ...prizes, ...prizes, ...prizes, ...prizes, ...prizes].map(p => `<div style="height:120px;display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:900;color:#2b1d18;padding:4px;line-height:1.2">${esc(p.name)}</div>`).join('')}</div></div>`
    ov.innerHTML = `<div style="font-weight:900;font-size:18px;margin-bottom:12px">${esc(c.name)}</div><div style="display:flex;gap:8px;background:#8f0e0a;padding:14px;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.5)">${reel(0)}${reel(1)}${reel(2)}</div><button class="wheelBtn" id="wheelGo">拉！</button><div id="wheelRes"></div><button class="btn" id="wheelClose" style="margin-top:14px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)">關閉</button>`
    document.body.appendChild(ov)
    $('wheelClose').onclick = () => { ov.remove(); refreshMe() }
    $('wheelGo').onclick = async () => {
      const b = $('wheelGo'); b.disabled = true; b.textContent = '轉動中…'
      const d = await api({ op: 'draw', ...SES, rightKey: (g.rights[0] || {}).key })
      if (!d || !d.ok) { b.disabled = false; b.textContent = '拉！'; return toast((d && d.error) || '抽獎失敗', true) }
      const idx = Math.max(0, prizes.findIndex(p => p.idx === d.pidx))
      ;[0, 1, 2].forEach(k => { const r = $('reel' + k); const stop = (3 + k) * N + idx; r.style.transitionDuration = (2.2 + k * 0.5) + 's'; r.style.transform = `translateY(-${stop * 120}px)` })
      setTimeout(() => { const pz = d.prize || {}; $('wheelRes').innerHTML = `<div class="result">${pz.kind === 'none' ? `<div>這次沒中</div><b>銘謝惠顧</b>${pz.capped ? '<div class="sub">你今年中獎已達上限，下次再來</div>' : ''}` : `<div>恭喜！抽中</div><b>${esc(pz.name)}</b><div class="sub">${pz.kind === 'pts' ? '點數已入帳' : '券已放進你的兌換紀錄，到櫃檯出示給店員核銷'}</div>`}</div>`; b.style.display = 'none' }, 3600)
    }
  }
  // 🧾 掃電子發票左邊那顆 QR 自己集點
  function scanInvoice () {
    if (typeof Html5Qrcode === 'undefined') return toast('掃描元件還沒載入，請再試一次', true)
    const ov = document.createElement('div'); ov.className = 'wheelOv'; ov.id = 'invOv'
    ov.innerHTML = `<div style="background:#fff;color:var(--ink);border-radius:16px;padding:14px;width:100%;max-width:380px"><div style="font-weight:900;margin-bottom:6px">掃發票左邊的 QR</div><div id="invReader" style="width:100%;border-radius:12px;overflow:hidden"></div><div id="invMsg" class="sub" style="margin-top:8px">對準發票左邊那顆 QR code…</div><div style="text-align:right;margin-top:10px"><button class="btn sm" id="invClose">關閉</button></div></div>`
    document.body.appendChild(ov)
    const h5 = new Html5Qrcode('invReader'); let busy = false
    const stop = () => { try { h5.stop().then(() => { try { h5.clear() } catch (_) {} }).catch(() => {}) } catch (_) {} ov.remove() }
    $('invClose').onclick = stop
    h5.start({ facingMode: 'environment' }, { fps: 10, qrbox: 200 }, async (txt) => { if (busy) return; busy = true; $('invMsg').textContent = '登錄中…'; const d = await api({ op: 'invoice', ...SES, qr: txt }); if (!d || !d.ok) { busy = false; $('invMsg').innerHTML = `<span style="color:var(--red)">${esc((d && d.error) || '登錄失敗')}</span>`; return } stop(); ME = d; render(); toast(`發票 ${d.no} 已登錄，+${d.pts} 點`) }, () => {}).catch(() => { $('invMsg').innerHTML = '<span style="color:var(--red)">開不了鏡頭，請允許相機權限</span>' })
  }
  async function refreshMe () { const d = await api({ op: 'me', ...SES }); if (d && d.ok) { ME = d; render() } }
  function drawQR () { try { const c = $('qr'); if (c && window.QRCode) QRCode.toCanvas(c, ME.qr, { width: 200, margin: 1, color: { dark: '#2b1d18' } }) } catch (_) {} }
  document.addEventListener('visibilitychange', async () => { if (!document.hidden && ME && SES) { const d = await api({ op: 'me', ...SES }); if (d && d.ok) { ME = d; render() } } })
})()
</script>
</body>
</html>
