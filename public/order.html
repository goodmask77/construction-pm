<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ce1611">
<title>GROUN:D 團體訂餐</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Lora:wght@600;700&display=swap">
<style>
/* 🧾 團體訂餐 客人頁 v4.70.78（/order/<連結碼>；免登入，連結碼即授權；菜單即時讀最新菜單；計價＝/ops/js/grporder-calc.js 同一支） */
:root{--bg:#f5efe4;--paper:#fffaf2;--ink:#2b1d18;--mute:#7a6a62;--line:#d8c9b6;--red:#ce1611;--soft:#f3e4dd;--ok:#2f7a4a;--warn:#b4581a;--warnbg:#fdeedd;--num:'Lora','Noto Sans TC',serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14.5px/1.5 'Noto Sans TC',system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
.brand{text-align:center;padding:8px 0 4px}.brand b{display:block;color:var(--red);font-size:20px;font-weight:900;letter-spacing:.06em}.brand small{color:var(--mute);font-size:12px;letter-spacing:.18em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
h2{font-size:17px;margin:0 0 4px;font-weight:900}h3{font-size:13px;margin:0 0 8px;font-weight:700;color:var(--mute);letter-spacing:.06em}
.sub{font-size:12.5px;color:var(--mute)}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:9px 14px;font:700 13.5px 'Noto Sans TC',sans-serif;cursor:pointer}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.sm{padding:4px 9px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--red)}.pill.ok{background:#dff3e5;color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.grey{background:var(--line);color:var(--ink)}
.person{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);display:grid;gap:8px;margin-top:10px}.person.pend{border-color:var(--warn);background:var(--warnbg)}
.person .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.person .hd input{font-weight:700;width:130px}
.tot{font-family:var(--num);font-size:19px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.fld{display:grid;grid-template-columns:58px 1fr;gap:6px;align-items:center;font-size:13px}.fld label{color:var(--mute);font-weight:500}.fld .in{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.fld select{flex:1 1 140px}.fld input.q{width:50px;text-align:center}.fld input.nt{width:84px}
.sug{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}.sug .btn{border-color:var(--warn);color:var(--warn)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--red);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5}
.sticky .big{font-family:var(--num);font-size:24px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;margin-top:12px}.banner.ok{background:#dff3e5;color:var(--ok)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.info{background:var(--soft);color:var(--red)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#166534;color:#fff;padding:8px 14px;border-radius:10px;font-weight:800;font-size:13.5px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none}.toast.bad{background:#b91c1c}
.menuList{display:grid;gap:4px;font-size:13px;columns:2}.menuList b{display:block;margin-top:6px}
@media(max-width:380px){.fld{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="brand"><b>GROUN:D</b><small>團體訂餐</small></div><div class="card sub" id="loading">讀取中…</div></div>
<div class="sticky" id="sticky" hidden><div><div class="sub" id="totSub"></div><div class="big" id="tot"></div></div><button class="btn red" id="mainBtn"></button></div>
<div class="toast" id="toast"></div>
<script type="module">
import GC from '/ops/js/grporder-calc.js?v=4778'
const code = (location.pathname.match(/\/order\/([a-z0-9]+)/i) || [])[1] || new URLSearchParams(location.search).get('c') || ''
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const fmt = n => Math.round(Number(n) || 0).toLocaleString('zh-TW')
let D = null, MENU = null, saveT = null, dirty = false
const api = async (body) => { try { const r = await fetch('/api/mail-sync?gorder=' + encodeURIComponent(code) + (body ? '' : '&r=' + Date.now()), body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}); return await r.json() } catch (_) { return { ok: false, error: '連線失敗，請再試一次' } } }
function toast (t, bad) { const el = $('toast'); el.textContent = t; el.className = 'toast' + (bad ? ' bad' : ''); el.style.opacity = '1'; clearTimeout(el._t); el._t = setTimeout(() => { el.style.opacity = '0' }, 2200) }
async function load () {
  if (!code) { $('loading').textContent = '連結不完整，請跟店家要一次點餐連結。'; return }
  const d = await api()
  if (!d || !d.ok) { $('loading').textContent = (d && d.error) || '找不到這張點餐單'; return }
  D = d; MENU = d.menu; render()
}
const label = pk => GC.labelOf(MENU, pk)
function opt (kind, sel) { const items = GC.flatItems(MENU).filter(i => kind === 'main' ? i.kind !== 'pizza' && i.kind !== 'drink' : i.kind === kind); return `<option value="">—</option>` + items.map(i => `<option value="${i.id}" ${sel === i.id ? 'selected' : ''} ${i.soon ? 'disabled' : ''}>${esc(i.name)}${i.soon ? '（即將上線）' : ' ' + i.price}</option>`).join('') }
function render () {
  const ed = D.editable, t = GC.totals(MENU, D), L = GC.STATUS_LABEL
  const stBanner = D.status === 'submitted' ? `<div class="banner info">已送出給店家，店家核價中。要改還來得及，改了會自動回到待核價。</div>`
    : D.status === 'priced' ? `<div class="banner ok">店家核價完成：全單 ${fmt(t.total)} 元${t.disc ? '（含折扣 −' + fmt(t.disc) + '）' : ''}。沒問題請按下方「確認無誤」。</div>`
    : D.status === 'confirmed' ? `<div class="banner ok">您已確認，等店家鎖單。取餐 ${esc(D.when || '待定')}。</div>`
    : ['locked', 'done'].includes(D.status) ? `<div class="banner ok">訂單已成立${D.priceAt ? '（' + String(D.priceAt.at).slice(0, 10) + ' 價格）' : ''}。全單 ${fmt(t.total)} 元，取餐 ${esc(D.when || '待定')}。</div>`
    : D.expired ? `<div class="banner warn">這條連結已過期，請跟店家再要一次。</div>` : ''
  const people = (D.rows || []).map((r, i) => {
    const p = GC.priceRow(MENU, r, D.frozen), bad = p.pend || p.missing
    const fld = (lab, k, kind) => { const e = r[k]; return `<div class="fld"><label>${lab}</label><div class="in">${ed ? `<select data-i="${i}" data-k="${k}" data-f="id">${opt(kind, e && e.id)}</select>` : `<span>${e ? esc(label(e)) : '—'}</span>`}${ed && e ? `<input class="q" type="number" min="1" value="${e.q || 1}" data-i="${i}" data-k="${k}" data-f="q"><input class="nt" placeholder="${kind === 'drink' ? '冰／糖' : '口味'}" value="${esc(e.note || '')}" data-i="${i}" data-k="${k}" data-f="note">` : ''}</div></div>` }
    const extras = (r.extras || []).map((e, j) => `<span class="pill grey">${esc(label(e))} ${GC.pickPrice(MENU, e, D.frozen).price * (e.q || 1)}${ed ? `<button class="btn sm" data-del="${i}:${j}" style="margin-left:4px;padding:0 5px">×</button>` : ''}</span>`).join(' ')
    const pend = (r.pend || []).map((pd, j) => `<div class="sug"><span class="pill warn">待確認：${esc(pd.text)}${pd.q > 1 ? ' ×' + pd.q : ''}</span>${ed ? `<span class="sub">最新菜單沒有這項，換成：</span>${(pd.sug || []).map(sid => { const it = GC.itemOf(MENU, sid); return it ? `<button class="btn sm" data-fix="${i}:${j}:${sid}">${esc(it.name)} ${it.price}</button>` : '' }).join('')}<button class="btn sm" data-drop="${i}:${j}">不要了</button>` : ''}</div>`).join('')
    return `<div class="person ${bad ? 'pend' : ''}"><div class="hd"><div class="row"><span class="pill">${String(i + 1).padStart(2, '0')}</span>${ed ? `<input data-i="${i}" data-f="name" value="${esc(r.name)}" placeholder="姓名">` : `<b>${esc(r.name || '（沒寫名字）')}</b>`}</div><div class="row">${r.main ? `<label class="sub"><input type="checkbox" data-i="${i}" data-f="combo" ${r.combo ? 'checked' : ''} ${ed ? '' : 'disabled'}> 套餐 +${MENU.setN}</label>` : ''}<span class="tot">${bad ? (p.missing ? '已下架' : '待確認') : '$' + fmt(p.total)}</span>${ed ? `<button class="btn sm" data-rm="${i}" title="刪除這一人">刪</button>` : ''}</div></div>
      ${fld('主餐', 'main', 'main')}${fld('副餐', 'side', 'snack')}${fld('飲品', 'drink', 'drink')}
      <div class="fld"><label>額外單點</label><div class="in">${extras || (ed ? '' : '<span class="sub">—</span>')}${ed ? `<select data-i="${i}" data-f="addx"><option value="">＋ 加單點</option>${GC.flatItems(MENU).filter(x => !x.soon && x.kind !== 'pizza').map(x => `<option value="${x.id}">${esc(x.name)} ${x.price}</option>`).join('')}</select>` : ''}</div></div>
      ${pend}
      <div class="sub">主餐 ${p.main}${p.set ? ' ＋ 套餐 ' + p.set : ''}${p.diff ? ' ＋ 補差 ' + p.diff : ''}${p.ala ? ' ＋ 單點 ' + p.ala : ''}${bad ? '（待確認的還沒算）' : ''}</div></div>`
  }).join('')
  const shared = (D.shared || []).map((s, j) => `<div class="row" style="justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)"><span>${esc(label({ ...s, q: 1 }))} <span class="sub">${GC.pickPrice(MENU, s, D.frozen).price}</span></span><span class="row">${ed ? `<button class="btn sm" data-sq="${j}:-1">−</button>` : ''}<b>${s.q}</b>${ed ? `<button class="btn sm" data-sq="${j}:1">＋</button>` : ''}<b style="font-family:var(--num);color:var(--red);min-width:50px;text-align:right">${fmt(GC.pickPrice(MENU, s, D.frozen).price * s.q)}</b></span></div>`).join('')
  $('root').innerHTML = `<div class="brand"><b>GROUN:D</b><small>團體訂餐</small></div>
    <div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(D.company || D.custName || '團體訂餐')}</h2><div class="sub">取餐 ${esc(D.when || '待定')}・${esc(D.mode || '')}${D.taxId ? '・統編 ' + esc(D.taxId) : ''}</div></div><span class="pill">${esc(L[D.status] || D.status)}</span></div>${stBanner}</div>
    ${ed ? `<div class="card"><h3>把大家的訂餐文字貼進來，自動拆成每人一列</h3><textarea id="paste" rows="5" style="width:100%" placeholder="一行一人，例如：&#10;小美：雙層牛肉起司堡＋薯條＋四季烏龍 去冰無糖&#10;阿明：爐烤牛排越南三明治套餐（薯條＋美式咖啡 冰）"></textarea><div class="row" style="margin-top:8px"><button class="btn red" id="btnParse">自動拆成每人一列</button><label class="sub"><input type="checkbox" id="parseAppend" checked> 加在現有名單後面</label></div><div class="sub" style="margin-top:4px">對不到最新菜單的會標「待確認」，點一下建議品項就能換；也可以直接用下面的下拉選。</div></div>` : ''}
    <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">每人一列（${(D.rows || []).length} 人）</h3>${ed ? `<button class="btn sm" id="btnAdd">＋ 加一人</button>` : ''}</div>${people || '<div class="sub" style="margin-top:8px">還沒有人。貼文字或按「＋ 加一人」。</div>'}</div>
    <div class="card"><h3>大家共用（披薩等，不分攤到個人）</h3>${shared || '<div class="sub">沒有共用品項</div>'}${ed ? `<div class="row" style="margin-top:8px"><select id="sharedPick">${GC.flatItems(MENU).filter(i => !i.soon).map(i => `<option value="${i.id}">${esc(i.name)} ${i.price}</option>`).join('')}</select><button class="btn sm" id="btnShared">＋ 加入共用</button></div>` : ''}</div>
    <div class="card"><h3>菜單（最新）</h3><div class="menuList">${MENU.sections.map(s => `<div style="break-inside:avoid"><b>${esc(s.name)}${s.combo ? ` <span class="pill">套餐折抵 ${s.combo}</span>` : ''}</b>${s.items.map(i => `<div style="display:flex;justify-content:space-between;gap:6px;${i.soon ? 'opacity:.5' : ''}"><span>${esc(i.name)}</span><span>${i.soon ? '即將上線' : i.price}</span></div>`).join('')}</div>`).join('')}</div><div class="sub" style="margin-top:6px">主餐 +${MENU.setN} 升級套餐＝副餐選 1＋飲品選 1；超過折抵的差額補差價。</div></div>
    <div class="sub" style="text-align:center;margin-top:14px">${D.custSavedAt ? '最後儲存 ' + esc(String(D.custSavedAt).slice(11, 16)) + '（UTC）' : ''}</div>`
  // 底部
  const st = $('sticky'); st.hidden = false
  $('tot').textContent = '$' + fmt(t.total); $('totSub').textContent = `${(D.rows || []).length} 人＋共用 ${(D.shared || []).reduce((n, s) => n + s.q, 0)} 項${t.pend ? '・' + t.pend + ' 項待確認' : ''}${t.disc ? '・已含折扣' : ''}`
  const mb = $('mainBtn')
  if (D.status === 'priced') { mb.textContent = '確認無誤'; mb.disabled = false; mb.onclick = confirmGo }
  else if (ed) { mb.textContent = D.status === 'submitted' ? '再次送出' : '送出給店家'; mb.disabled = !((D.rows || []).length || (D.shared || []).length); mb.onclick = submitGo }
  else { mb.textContent = L[D.status] || '已鎖定'; mb.disabled = true; mb.onclick = null }
  bind()
}
function bind () {
  if (!D.editable) return
  document.querySelectorAll('[data-f]').forEach(el => { el.onchange = () => {
    const i = +el.dataset.i, r = D.rows[i], f = el.dataset.f, k = el.dataset.k
    if (f === 'name') r.name = el.value
    else if (f === 'combo') r.combo = el.checked
    else if (f === 'addx') { if (el.value) r.extras.push({ id: el.value, q: 1, note: '' }) }
    else if (f === 'id') { r[k] = el.value ? { id: el.value, q: 1, note: '' } : null; if (!r.main) r.combo = false; else if (k !== 'main' && r.main && r.side && r.drink && !r.combo) r.combo = true }
    else if (f === 'q') r[k].q = Math.max(1, +el.value || 1)
    else if (f === 'note') r[k].note = el.value
    changed()
  } })
  document.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => { const [i, j, id] = b.dataset.fix.split(':'); const r = D.rows[+i], pd = r.pend.splice(+j, 1)[0], it = GC.itemOf(MENU, id); if (!it) return; const ent = { id, q: pd.q || 1, note: pd.note || '' }
    if (it.kind === 'snack' && !r.side && ent.q === 1) r.side = ent; else if (it.kind === 'drink' && !r.drink) r.drink = ent; else if ((it.kind === 'main' || it.kind === 'snack') && !r.main) r.main = ent; else r.extras.push(ent)
    if (!r.pend.length && r.main && r.side && r.drink) r.combo = true; changed() })
  document.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.drop.split(':'); D.rows[+i].pend.splice(+j, 1); changed() })
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const [i, j] = b.dataset.del.split(':'); D.rows[+i].extras.splice(+j, 1); changed() })
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { D.rows.splice(+b.dataset.rm, 1); changed() })
  document.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => { const [j, d] = b.dataset.sq.split(':'); D.shared[+j].q += +d; if (D.shared[+j].q <= 0) D.shared.splice(+j, 1); changed() })
  const add = $('btnAdd'); if (add) add.onclick = () => { D.rows.push({ name: '', main: null, side: null, drink: null, extras: [], combo: false, pend: [] }); changed(); setTimeout(() => { const ins = document.querySelectorAll('[data-f="name"]'); const last = ins[ins.length - 1]; if (last) last.focus() }, 50) }
  const sh = $('btnShared'); if (sh) sh.onclick = () => { const id = $('sharedPick').value; const ex = D.shared.find(s => s.id === id); if (ex) ex.q++; else D.shared.push({ id, q: 1, note: '' }); changed() }
  const bp = $('btnParse'); if (bp) bp.onclick = parseGo
}
function changed () { dirty = true; render(); clearTimeout(saveT); saveT = setTimeout(save, 800) }
async function save () {
  if (!dirty) return; dirty = false
  const d = await api({ op: 'save', rows: D.rows, shared: D.shared })
  if (!d || !d.ok) { toast((d && d.error) || '儲存失敗', true); dirty = true; return }
  const keep = { rows: D.rows, shared: D.shared }; D = { ...d, menu: MENU, ...(dirty ? keep : {}) }
  if (!dirty) render(); toast('已儲存')
}
async function parseGo () {
  const ta = $('paste'), b = $('btnParse'); if (!ta.value.trim()) return toast('先貼文字', true)
  b.disabled = true; b.textContent = 'AI 讀取中…'
  const d = await api({ op: 'parse', text: ta.value })
  if (!d || !d.ok) { b.disabled = false; b.textContent = '自動拆成每人一列'; return toast((d && d.error) || 'AI 讀不出來', true) }
  const append = $('parseAppend').checked
  D.rows = append ? [...D.rows, ...d.rows] : d.rows
  for (const s of d.shared) { const ex = D.shared.find(x => x.id === s.id); if (ex && append) ex.q += s.q; else if (!ex) D.shared.push(s) }
  changed(); toast(`拆出 ${d.rows.length} 人${d.shared.length ? '＋共用 ' + d.shared.length + ' 項' : ''}`)
}
async function submitGo () {
  const t = GC.totals(MENU, D)
  if (t.pend && !window.confirm(`還有 ${t.pend} 項待確認（最新菜單沒有的品項），先送出讓店家處理嗎？`)) return
  clearTimeout(saveT); if (dirty) await save()
  const d = await api({ op: 'submit' }); if (!d || !d.ok) return toast((d && d.error) || '送出失敗', true)
  D = { ...d, menu: MENU }; render(); toast('已送出給店家'); window.scrollTo({ top: 0, behavior: 'smooth' })
}
async function confirmGo () {
  const d = await api({ op: 'confirm' }); if (!d || !d.ok) return toast((d && d.error) || '確認失敗', true)
  D = { ...d, menu: MENU }; render(); toast('已確認，謝謝！')
}
// 不在編輯時每 30 秒看一次狀態（店家核價完成會自動出現「確認無誤」）
setInterval(async () => { if (!D || dirty || document.hidden) return; const d = await api(); if (d && d.ok && (d.status !== D.status || JSON.stringify(d.totals) !== JSON.stringify(D.totals))) { D = d; MENU = d.menu; render() } }, 30000)
load()
</script>
</body>
</html>
