<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E53935" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GROUN:D" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>工程管理系統 · Construction PM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; padding: 0; min-height: 100%; }
      html, body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
      body { font-family: 'Noto Sans TC', -apple-system, sans-serif; background: #f4efe5; }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      /* 手機觸控優化：避免 iOS 點輸入框時自動放大（font-size 需 ≥16px） */
      @media (max-width: 767px) {
        input, select, textarea { font-size: 16px !important; }
        button, a, [role="button"] { touch-action: manipulation; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
